include:
  - local: /infra/ci/images.yml
  - local: /infra/ci/gitlab-release.yml

# GitLab is a build/package/publish pipeline only. All automated tests and
# Final Gate run on GitHub Actions for the exact accepted commit.
stages:
  - build
  - package
  - release-build
  - promote
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
    - when: never

default:
  interruptible: true
  hooks:
    pre_get_sources_script:
      - |
        set -euo pipefail
        if command -v powershell.exe >/dev/null 2>&1; then
          cache_path="$CI_PROJECT_DIR/.cache/go-mod"
          echo "[ci] clearing stale Windows Go module cache before Git source cleanup: $cache_path"
          if command -v go >/dev/null 2>&1; then
            GOMODCACHE="$cache_path" GOFLAGS= go clean -modcache || true
          fi
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '$path = Join-Path $env:CI_PROJECT_DIR ".cache\go-mod"; if (Test-Path -LiteralPath $path) { Write-Host "[ci] forcing removal of stale Go module cache: $path"; Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop }'
        fi

variables:
  GIT_DEPTH: "0"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  # All GitLab master and stable-tag image builders package without running
  # test suites; exact-HEAD tests and Final Gate are owned by GitHub Actions.
  XDRIVE_GITLAB_PACKAGE_ONLY: "1"

.ci-linux-helpers:
  before_script:
    # Only use APT in jobs that actually need jq/xz. The Go image already
    # provides curl/CA/tar for cached Docker CLI installation in image builds.
    - &ensure_linux_fetch_tools |
        bash scripts/ci/install-linux-fetch-tools.sh
    - &install_node22 bash scripts/ci/install-node22.sh
    - &install_docker_cli bash scripts/ci/install-docker-cli.sh
    - &install_docker_cli_only bash scripts/ci/install-docker-cli.sh --docker-only
    - &install_postgres_client |
        set -euo pipefail
        bash scripts/ci/install-linux-fetch-tools.sh postgresql-client
        rm -rf /var/lib/apt/lists/*

.electron-linux-cache:
  variables:
    XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  cache:
    key: "xdrive-electron-linux-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/electron/
      - .cache/electron-builder/
      - .cache/ci-tools/
      - .cache/npm/
    policy: pull-push
    when: always

.go-linux-cache:
  variables:
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  cache:
    key: "xdrive-go-linux-v2-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/go-mod/
      - .cache/go-build/
    policy: pull-push
    when: always

.ci-tools-cache:
  cache:
    key: "xdrive-ci-tools-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/ci-tools/
    policy: pull-push
    when: always

desktop-linux:
  # Master builds can be superseded; only active publication is noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      interruptible: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: true
    - when: on_success
  image: $XDRIVE_CI_NODE_IMAGE
  extends: .electron-linux-cache
  stage: build
  needs: []
  tags:
    - linux
  script:
    - |
      set -euo pipefail
      source scripts/ci/build-metadata.sh
      cd desktop
      npm install --no-audit --no-fund
      node scripts/set-version.mjs "$XDRIVE_DESKTOP_VERSION"
      npm run runtime:linux
      test -x release/linux-unpacked/xdrive-desktop
      cd ..
      mkdir -p dist
      tar -C desktop/release -czf dist/desktop-runtime-linux-amd64.tar.gz linux-unpacked
  artifacts:
    name: "xdrive-desktop-runtime-linux-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - dist/desktop-runtime-linux-amd64.tar.gz

desktop-windows:
  # Master builds can be superseded; only active publication is noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      interruptible: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: true
    - when: on_success
  stage: build
  needs: []
  variables:
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  tags:
    - windows
  cache:
    key: "xdrive-desktop-windows-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/npm/
      - .cache/electron/
      - .cache/electron-builder/
    policy: pull-push
    when: always
  script:
    - bash scripts/ci/gitlab-desktop-windows.sh
  artifacts:
    name: "xdrive-desktop-runtime-windows-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - desktop/release/win-unpacked/

# The published DSM SPK must include the isolated common MUI bundle,
# not just the CLI-only ARMv7 agent payload.
build-client-core:
  variables:
    GIT_DEPTH: "0"
  # Master builds can be superseded; only active publication is noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      interruptible: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: true
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  extends: .go-linux-cache
  stage: build
  needs:
    - job: web
      artifacts: true
  tags:
    - linux
  # Unlike GitHub's Ubuntu runner, the Go image has neither XZ nor Node.
  # XZ is also required to unpack the pinned Node distribution itself.
  before_script:
    - *ensure_linux_fetch_tools
    - *install_node22
  script:
    - |
      set -euo pipefail
      source scripts/ci/client-artifact-version.sh
      bash scripts/build-client-core.sh "$XDRIVE_RELEASE_VERSION" release/core
      # Same immutable core binaries as Desktop; never build a second uploader.
      if ! command -v python3 >/dev/null 2>&1; then
        bash scripts/ci/install-linux-fetch-tools.sh python3
      fi
      bash scripts/package-backup-cli.sh release/core release/backup-cli
      source scripts/ci/synology-spk-version.sh
      source scripts/ci/build-metadata.sh
      bash scripts/build-synology-spk.sh "$XDRIVE_SPK_VERSION" release/synology-cli
      bash scripts/build-synology-spk.sh "$XDRIVE_SPK_VERSION" \
        release/synology release/synology-cli/core web/dist-synology
      bash scripts/ci/verify-synology-spk-release.sh release/synology --require-mui
  artifacts:
    name: "xdrive-client-core-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - release/core/
      - release/backup-cli/
      - release/synology/*.spk
      - release/synology/*.spk.sha256

package-linux-client:
  # Master builds can be superseded; only active publication is noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      interruptible: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: true
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  stage: package
  needs:
    - job: desktop-linux
      artifacts: true
    - job: build-client-core
      artifacts: true
  tags:
    - linux
  script:
    - bash scripts/ci/gitlab-package-linux-client.sh
  artifacts:
    name: "xdrive-linux-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xdrive-linux-amd64.deb

server-image:
  # Master builds can be superseded; only active publication is noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      interruptible: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: true
      variables:
        XDRIVE_GITLAB_PACKAGE_ONLY: "1"
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  extends: .ci-tools-cache
  stage: package
  needs: []
  tags:
    - linux
  before_script:
    - *install_docker_cli_only
  script:
    - XDRIVE_GITLAB_PACKAGE_ONLY=1 XDRIVE_GITLAB_STAGING_ONLY=1 bash scripts/ci/gitlab-server-image.sh
    - bash scripts/ci/gitlab-stage-image.sh xdrive-server dist/server-image xdrive/server:test
  artifacts:
    name: "xdrive-server-image-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - dist/server-image/image.ref
      - dist/server-image/image.digest
      - dist/server-image/image.id
      - dist/server-image/image.commit

media-worker-image:
  # Master builds can be superseded; only active publication is noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      interruptible: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      changes:
        - cmd/server/**/*
        - internal/**/*
        - go.mod
        - go.sum
        - deploy/MediaWorker.Dockerfile
        - deploy/install-media-worker-ffmpeg.sh
        - scripts/ci/test-media-worker-image.sh
        - scripts/ci/gitlab-registry-utils.sh
        - scripts/ci/gitlab-stage-image.sh
        - scripts/ci/gitlab-fetch-staged-image.sh
        - scripts/ci/gitlab-server-images.sh
        - scripts/ci/gitlab-promote-images.sh
        - .gitlab-ci.yml
        - infra/ci/gitlab-release.yml
      interruptible: true
      allow_failure: true
    - when: never
  image: $XDRIVE_CI_GO_IMAGE
  extends: .ci-tools-cache
  stage: package
  needs: []
  tags:
    - linux
  before_script:
    - *install_docker_cli_only
  script:
    - XDRIVE_GITLAB_PACKAGE_ONLY=1 XDRIVE_GITLAB_STAGING_ONLY=1 bash scripts/ci/test-media-worker-image.sh dist/media-worker-image
    - bash scripts/ci/gitlab-stage-image.sh xdrive-media-worker dist/media-worker-image xdrive/media-worker:test
  artifacts:
    name: "xdrive-media-worker-image-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - dist/media-worker-image/image.ref
      - dist/media-worker-image/image.digest
      - dist/media-worker-image/image.id
      - dist/media-worker-image/image.commit

photo-face-image:
  # Master builds can be superseded; only active publication is noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      interruptible: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      changes:
        - services/photo-face-analyzer/**/*
        - scripts/ci/test-photo-face-image.sh
        - scripts/ci/photo-face-runtime-cache-key.sh
        - scripts/ci/gitlab-registry-utils.sh
        - scripts/ci/gitlab-stage-image.sh
        - scripts/ci/gitlab-fetch-staged-image.sh
        - scripts/ci/gitlab-server-images.sh
        - scripts/ci/gitlab-promote-images.sh
        - .gitlab-ci.yml
        - infra/ci/gitlab-release.yml
      interruptible: true
      allow_failure: true
    - when: never
  image: $XDRIVE_CI_GO_IMAGE
  stage: package
  variables:
    XDRIVE_PHOTO_FACE_RUNTIME_CACHE_ARCHIVE: "0"
  timeout: 2h
  needs: []
  tags:
    - linux
  cache:
    key: "xdrive-photo-face-runtime-v2-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/ci-tools/
      - .cache/photo-face-models/
    policy: pull-push
    when: always
  before_script:
    - *install_docker_cli_only
  script:
    # Leave time below the 2h job limit for cache:when:always to save
    # compatible model .part files even if every source is too slow.
    - timeout --signal=TERM --kill-after=30s 105m env XDRIVE_GITLAB_PACKAGE_ONLY=1 XDRIVE_GITLAB_STAGING_ONLY=1 bash scripts/ci/test-photo-face-image.sh dist/photo-face-image
    - bash scripts/ci/gitlab-stage-image.sh xdrive-photo-face dist/photo-face-image xdrive/photo-face:test
  artifacts:
    name: "xdrive-photo-face-image-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - dist/photo-face-image/image.ref
      - dist/photo-face-image/image.digest
      - dist/photo-face-image/image.id
      - dist/photo-face-image/image.commit

