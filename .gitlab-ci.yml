file-explorer-trash-permanent-100k-performance:
  image: $XDRIVE_CI_GO_IMAGE
  extends: .go-linux-cache
  stage: test
  needs: []
  tags:
    - linux
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: "xdrive"
    POSTGRES_PASSWORD: "xdrive"
    POSTGRES_DB: "xdrive_test"
    XD_TEST_DATABASE_URL: "postgres://xdrive:xdrive@postgres:5432/xdrive_test?sslmode=disable"
    XD_TRASH_PERMANENT_HTTP_PERF: "1"
    GIT_DEPTH: "5"
  before_script:
    - *ensure_linux_fetch_tools
    - *install_postgres_client
  rules:
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "perf/file-explorer-trash-permanent-100k"'
    - if: '$CI_COMMIT_BRANCH == "perf/file-explorer-trash-permanent-100k"'
  script:
    - |
      set -euo pipefail
      mkdir -p performance-results
      results_dir="$PWD/performance-results"
      after_dir="$PWD"
      before_dir="$(mktemp -d)"
      git archive HEAD^ | tar -x -C "$before_dir"
      cp internal/api/trash_permanent_real_http_100k_performance_integration_test.go "$before_dir/internal/api/"
      for count in 10000 100000; do
        for sample in 1 2 3; do
          order="before after"
          if [ "$sample" -eq 2 ]; then order="after before"; fi
          for arm in $order; do
            target="$after_dir"
            expected=1
            if [ "$arm" = before ]; then target="$before_dir"; expected=0; fi
            (
              cd "$target"
              XD_TRASH_PERMANENT_HTTP_COUNT="$count" XD_TRASH_PERMANENT_HTTP_EXPECT_FIXED="$expected" \
                go test -run '^TestTrashPermanentDeleteRealHTTPPerformance10K100K$' -count=1 -timeout=8m -v ./internal/api
            ) | tee "$results_dir/$count-$sample-$arm.log"
          done
        done
        test "$(grep -l TRASH_PERMANENT_REAL_HTTP_PERF "performance-results/$count"-*-*.log | wc -l)" -eq 6
      done
      git rev-parse HEAD > performance-results/after-sha.txt
      git rev-parse HEAD^ > performance-results/before-sha.txt
      sha256sum internal/api/trash_permanent_real_http_100k_performance_integration_test.go > performance-results/harness-sha256.txt
      rm -rf -- "$before_dir"
  artifacts:
    name: "file-explorer-trash-permanent-100k-paired-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    paths:
      - performance-results/

