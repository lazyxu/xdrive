web:
  # Preserve only master snapshot publication prerequisites across frequent pushes.
  # Other tests remain interruptible; MR and stable behavior is unchanged.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
      variables:
        XDRIVE_GITLAB_PACKAGE_ONLY: "1"
    - when: on_success
  image: $XDRIVE_CI_NODE_IMAGE
  stage: test
  needs: []
  cache:
    key: "xdrive-web-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/npm/
    policy: pull-push
    when: always
  tags:
    - linux
  script:
    - |
      set -euo pipefail
      node_major="$(node -p 'process.versions.node.split(".")[0]')"
      if [[ "$node_major" != "22" ]]; then
        echo "Node.js 22 is required; found $(node --version)." >&2
        exit 1
      fi
      cd web
      npm ci --no-audit --no-fund
      if [[ "${XDRIVE_GITLAB_PACKAGE_ONLY:-0}" != "1" ]]; then
        npm run lint
      fi
      npm run build
  artifacts:
    name: "xdrive-web-dist-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - web/dist/

final-gate:
  # Formal v* and MR still require full tests. Rolling master does not.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      when: never
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  stage: verify
  needs:
    - job: desktop-tests
      artifacts: false
