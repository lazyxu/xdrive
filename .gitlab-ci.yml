package-windows-client:
  # Master builds can be superseded; only active publication is noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      interruptible: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: true
    - when: on_success
  stage: package
  needs:
    - job: desktop-windows
      artifacts: true
    - job: build-client-core
      artifacts: true
  tags:
    - windows
  script:
    - bash scripts/ci/gitlab-package-windows-client.sh
  artifacts:
    name: "xdrive-windows-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xDriveSetup-amd64.exe

web:
  # Master builds can be superseded; only active publication is noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      interruptible: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: true
      variables:
        XDRIVE_GITLAB_PACKAGE_ONLY: "1"
    - when: on_success
  image: $XDRIVE_CI_NODE_IMAGE
  stage: build
  needs: []
  cache:
    key: "xdrive-web-v2-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/npm/
    policy: pull-push
    when: always
  tags:
    - linux
  script:
    - |
      set -euo pipefail
      node_major="$(node -p 'process.versions.node.split(".")[0]')"
      if [[ "$node_major" != "22" ]]; then
        echo "Node.js 22 is required; found $(node --version)." >&2
        exit 1
      fi
      cd web
      npm ci --no-audit --no-fund
      npm run build
      npm run build:synology
      node scripts/verify-synology-ui.mjs
  artifacts:
    name: "xdrive-web-dist-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - web/dist/
      - web/dist-synology/

