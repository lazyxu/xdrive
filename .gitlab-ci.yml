include:
  - local: /infra/ci/images.yml
  - local: /infra/ci/gitlab-release.yml

stages:
  - gate
  - build
  - artifact
  - test
  - verify
  - package
  - promote
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

default:
  interruptible: true
  hooks:
    pre_get_sources_script:
      - |
        set -euo pipefail
        if command -v powershell.exe >/dev/null 2>&1; then
          cache_path="$CI_PROJECT_DIR/.cache/go-mod"
          echo "[ci] clearing stale Windows Go module cache before Git source cleanup: $cache_path"
          if command -v go >/dev/null 2>&1; then
            GOMODCACHE="$cache_path" GOFLAGS= go clean -modcache || true
          fi
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '$path = Join-Path $env:CI_PROJECT_DIR ".cache\go-mod"; if (Test-Path -LiteralPath $path) { Write-Host "[ci] forcing removal of stale Go module cache: $path"; Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop }'
        fi

variables:
  GIT_DEPTH: "0"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

.ci-linux-helpers:
  before_script:
    - &ensure_linux_fetch_tools |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl xz-utils
        rm -rf /var/lib/apt/lists/*
    - &install_node22 bash scripts/ci/install-node22.sh
    - &install_docker_cli bash scripts/ci/install-docker-cli.sh
    - &install_postgres_client |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends postgresql-client
        rm -rf /var/lib/apt/lists/*

.electron-linux-cache:
  variables:
    XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  cache:
    key: "xdrive-electron-linux-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/electron/
      - .cache/electron-builder/
      - .cache/ci-tools/
      - .cache/npm/
    policy: pull-push
    when: always

.go-linux-cache:
  cache:
    key: "xdrive-go-linux-v1-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/go-mod/
    policy: pull-push
    when: always

.ci-tools-cache:
  cache:
    key: "xdrive-ci-tools-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/ci-tools/
    policy: pull-push
    when: always

single-commit:
  image: $XDRIVE_CI_GO_IMAGE
  stage: gate
  tags:
    - linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - |
      set -euo pipefail
      target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-master}"
      source_sha="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
      git fetch --no-tags origin "$target"
      count="$(git rev-list --count "origin/$target..$source_sha")"
      if [[ "$count" != "1" ]]; then
        echo "MR must contain exactly one commit before merge; found $count." >&2
        echo "Fetch/rebase origin/$target, squash the work branch to one commit, push it, and rerun CI." >&2
        exit 1
      fi

desktop-linux:
  image: $XDRIVE_CI_NODE_IMAGE
  extends: .electron-linux-cache
  stage: build
  tags:
    - linux
  script:
    - |
      set -euo pipefail
      node_major="$(node -p 'process.versions.node.split(".")[0]')"
      if [[ "$node_major" != "22" ]]; then
        echo "Node.js 22 is required; found $(node --version)." >&2
        exit 1
      fi
      source scripts/ci/client-artifact-version.sh
      cd desktop
      npm install --no-audit --no-fund
      node scripts/set-version.mjs "$XDRIVE_DESKTOP_VERSION"
      npm run runtime:linux
      test -x release/linux-unpacked/xdrive-desktop
      cd ..
      mkdir -p dist
      tar -C desktop/release -czf dist/desktop-runtime-linux-amd64.tar.gz linux-unpacked
  artifacts:
    name: "xdrive-desktop-runtime-linux-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - dist/desktop-runtime-linux-amd64.tar.gz

desktop-windows:
  stage: build
  variables:
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  tags:
    - windows
  cache:
    key: "xdrive-desktop-windows-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/npm/
      - .cache/electron/
      - .cache/electron-builder/
    policy: pull-push
    when: always
  script:
    - bash scripts/ci/gitlab-desktop-windows.sh
  artifacts:
    name: "xdrive-desktop-runtime-windows-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - desktop/release/win-unpacked/

desktop-tests:
  image: $XDRIVE_CI_NODE_IMAGE
  extends: .electron-linux-cache
  stage: test
  needs: []
  tags:
    - linux
  script:
    - |
      set -euo pipefail
      cd desktop
      npm install --no-audit --no-fund
      npm run test:main

go-linux:
  image: $XDRIVE_CI_GO_IMAGE
  extends: .go-linux-cache
  stage: test
  needs: []
  tags:
    - linux
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: "xdrive"
    POSTGRES_PASSWORD: "xdrive"
    POSTGRES_DB: "xdrive_test"
    XD_TEST_DATABASE_URL: "postgres://xdrive:xdrive@postgres:5432/xdrive_test?sslmode=disable"
  before_script:
    - *ensure_linux_fetch_tools
    - *install_postgres_client
  script:
    - bash scripts/ci/gitlab-go-linux.sh

build-source-agent:
  image: $XDRIVE_CI_GO_IMAGE
  extends: .go-linux-cache
  stage: artifact
  needs: []
  tags:
    - linux
  script:
    - bash scripts/ci/gitlab-source-agent.sh
  artifacts:
    name: "xdrive-source-agent-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/source-agent/xdrive-source-agent-linux-amd64
      - release/source-agent/xdrive-source-agent-linux-arm64

build-linux-client:
  image: $XDRIVE_CI_GO_IMAGE
  extends: .go-linux-cache
  stage: artifact
  needs:
    - job: desktop-linux
      artifacts: true
  tags:
    - linux
  script:
    - bash scripts/ci/gitlab-package-linux-client.sh
  artifacts:
    name: "xdrive-linux-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xdrive-linux-amd64.deb

server-validation:
  image: $XDRIVE_CI_GO_IMAGE
  extends: .ci-tools-cache
  stage: test
  needs: []
  resource_group: xdrive-go-linux-docker
  tags:
    - linux
  before_script:
    - *ensure_linux_fetch_tools
    - *install_docker_cli
  script:
    - bash scripts/ci/gitlab-server-validation.sh

go-windows:
  stage: test
  needs: []
  resource_group: xdrive-go-windows-tests
  tags:
    - windows
  cache:
    key: "xdrive-go-windows-test-v3-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/go-mod/cache/download/
    policy: pull-push
    when: always
  script:
    - bash scripts/ci/gitlab-go-windows.sh

build-windows-client:
  stage: artifact
  needs:
    - job: desktop-windows
      artifacts: true
  resource_group: xdrive-build-windows-client
  tags:
    - windows
  cache:
    key: "xdrive-package-windows-v1-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/go-mod/cache/download/
    policy: pull-push
    when: always
  script:
    - bash scripts/ci/gitlab-package-windows-client.sh
  artifacts:
    name: "xdrive-windows-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xDriveSetup-amd64.exe

test-linux-artifact:
  image: $XDRIVE_CI_GO_IMAGE
  stage: test
  needs:
    - job: build-linux-client
      artifacts: true
  tags:
    - linux
  script:
    - bash scripts/ci/gitlab-test-linux-artifact.sh

test-source-agent-artifact:
  image: $XDRIVE_CI_GO_IMAGE
  stage: test
  needs:
    - job: build-source-agent
      artifacts: true
  tags:
    - linux
  script:
    - bash scripts/ci/gitlab-test-source-agent-artifact.sh

test-windows-artifact:
  stage: test
  needs:
    - job: build-windows-client
      artifacts: true
  resource_group: xdrive-test-windows-artifact
  tags:
    - windows
  script:
    - bash scripts/ci/gitlab-test-windows-artifact.sh

web:
  image: $XDRIVE_CI_NODE_IMAGE
  stage: test
  cache:
    key: "xdrive-ci-tools-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/ci-tools/
      - .cache/npm/
    policy: pull-push
    when: always
  tags:
    - linux
  before_script:
    - *ensure_linux_fetch_tools
    - *install_docker_cli
  script:
    - |
      set -euo pipefail
      node_major="$(node -p 'process.versions.node.split(".")[0]')"
      if [[ "$node_major" != "22" ]]; then
        echo "Node.js 22 is required; found $(node --version)." >&2
        exit 1
      fi
      command -v docker >/dev/null
      docker info >/dev/null
      cd web
      npm ci --no-audit --no-fund
      npm run lint
      npm run build
      docker build -f Dockerfile -t xdrive/web:test ..

final-gate:
  image: $XDRIVE_CI_GO_IMAGE
  stage: verify
  needs:
    - job: desktop-tests
      artifacts: false
    - job: go-linux
      artifacts: false
    - job: go-windows
      artifacts: false
    - job: server-validation
      artifacts: false
    - job: web
      artifacts: false
    - job: test-linux-artifact
      artifacts: false
    - job: test-source-agent-artifact
      artifacts: false
    - job: test-windows-artifact
      artifacts: false
  tags:
    - linux
  script:
    - echo "All source, server, web, and exact-artifact tests passed."
