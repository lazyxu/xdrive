include:
  - local: /infra/ci/images.yml
  - local: /infra/ci/gitlab-release.yml

# GitLab is a build/package/publish pipeline only. All automated tests and
# Final Gate run on GitHub Actions for the exact accepted commit.
stages:
  - build
  - package
  - release-build
  - promote
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
    - when: never

default:
  interruptible: true
  hooks:
    pre_get_sources_script:
      - |
        set -euo pipefail
        if command -v powershell.exe >/dev/null 2>&1; then
          cache_path="$CI_PROJECT_DIR/.cache/go-mod"
          echo "[ci] clearing stale Windows Go module cache before Git source cleanup: $cache_path"
          if command -v go >/dev/null 2>&1; then
            GOMODCACHE="$cache_path" GOFLAGS= go clean -modcache || true
          fi
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '$path = Join-Path $env:CI_PROJECT_DIR ".cache\go-mod"; if (Test-Path -LiteralPath $path) { Write-Host "[ci] forcing removal of stale Go module cache: $path"; Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop }'
        fi

variables:
  GIT_DEPTH: "0"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  # All GitLab master and stable-tag image builders package without running
  # test suites; exact-HEAD tests and Final Gate are owned by GitHub Actions.
  XDRIVE_GITLAB_PACKAGE_ONLY: "1"

.ci-linux-helpers:
  before_script:
    # Only use APT in jobs that actually need jq/xz. The Go image already
    # provides curl/CA/tar for cached Docker CLI installation in image builds.
    - &ensure_linux_fetch_tools |
        bash scripts/ci/install-linux-fetch-tools.sh
    - &install_node22 bash scripts/ci/install-node22.sh
    - &install_docker_cli bash scripts/ci/install-docker-cli.sh
    - &install_docker_cli_only bash scripts/ci/install-docker-cli.sh --docker-only
    - &install_postgres_client |
        set -euo pipefail
        bash scripts/ci/install-linux-fetch-tools.sh postgresql-client
        rm -rf /var/lib/apt/lists/*

.electron-linux-cache:
  variables:
    XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  cache:
    key: "xdrive-electron-linux-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/electron/
      - .cache/electron-builder/
      - .cache/ci-tools/
      - .cache/npm/
    policy: pull-push
    when: always

.go-linux-cache:
  cache:
    key: "xdrive-go-linux-v1-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/go-mod/
    policy: pull-push
    when: always

.ci-tools-cache:
  cache:
    key: "xdrive-ci-tools-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/ci-tools/
    policy: pull-push
    when: always

desktop-linux:
  # Keep in-flight master publication inputs noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
    - when: on_success
  image: $XDRIVE_CI_NODE_IMAGE
  extends: .electron-linux-cache
  stage: build
  needs: []
  tags:
    - linux
  script:
    - |
      set -euo pipefail
      source scripts/ci/build-metadata.sh
      cd desktop
      npm install --no-audit --no-fund
      node scripts/set-version.mjs "$XDRIVE_DESKTOP_VERSION"
      npm run runtime:linux
      test -x release/linux-unpacked/xdrive-desktop
      cd ..
      mkdir -p dist
      tar -C desktop/release -czf dist/desktop-runtime-linux-amd64.tar.gz linux-unpacked
  artifacts:
    name: "xdrive-desktop-runtime-linux-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - dist/desktop-runtime-linux-amd64.tar.gz

desktop-windows:
  # Keep in-flight master publication inputs noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
    - when: on_success
  stage: build
  needs: []
  variables:
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  tags:
    - windows
  cache:
    key: "xdrive-desktop-windows-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/npm/
      - .cache/electron/
      - .cache/electron-builder/
    policy: pull-push
    when: always
  script:
    - bash scripts/ci/gitlab-desktop-windows.sh
  artifacts:
    name: "xdrive-desktop-runtime-windows-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - desktop/release/win-unpacked/

# The published DSM SPK must include the isolated common MUI bundle,
# not just the CLI-only ARMv7 agent payload.
build-synology-ui:
  image: $XDRIVE_CI_NODE_IMAGE
  stage: build
  needs: []
  tags:
    - linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
    - when: on_success
  script:
    - |
      set -euo pipefail
      npm ci --prefix web --no-audit --no-fund
      npm run build:synology --prefix web
      node web/scripts/verify-synology-ui.mjs
  artifacts:
    name: "xdrive-synology-ui-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - web/dist-synology/

build-client-core:
  variables:
    GIT_DEPTH: "0"
  # Keep in-flight master publication inputs noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  extends: .go-linux-cache
  stage: build
  needs:
    - job: build-synology-ui
      artifacts: true
  tags:
    - linux
  # Unlike GitHub's Ubuntu runner, the Go image has neither XZ nor Node.
  # XZ is also required to unpack the pinned Node distribution itself.
  before_script:
    - *ensure_linux_fetch_tools
    - *install_node22
  script:
    - |
      set -euo pipefail
      source scripts/ci/client-artifact-version.sh
      bash scripts/build-client-core.sh "$XDRIVE_RELEASE_VERSION" release/core
      # Same immutable core binaries as Desktop; never build a second uploader.
      if ! command -v python3 >/dev/null 2>&1; then
        bash scripts/ci/install-linux-fetch-tools.sh python3
      fi
      bash scripts/package-backup-cli.sh release/core release/backup-cli
      source scripts/ci/synology-spk-version.sh
      source scripts/ci/build-metadata.sh
      bash scripts/build-synology-spk.sh "$XDRIVE_SPK_VERSION" release/synology-cli
      bash scripts/build-synology-spk.sh "$XDRIVE_SPK_VERSION" \
        release/synology release/synology-cli/core web/dist-synology
      bash scripts/ci/verify-synology-spk-release.sh release/synology --require-mui
  artifacts:
    name: "xdrive-client-core-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - release/core/
      - release/backup-cli/
      - release/synology/*.spk
      - release/synology/*.spk.sha256

package-linux-client:
  # Keep in-flight master publication inputs noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  stage: package
  needs:
    - job: desktop-linux
      artifacts: true
    - job: build-client-core
      artifacts: true
  tags:
    - linux
  script:
    - bash scripts/ci/gitlab-package-linux-client.sh
  artifacts:
    name: "xdrive-linux-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xdrive-linux-amd64.deb

server-image:
  # Keep in-flight master publication inputs noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
      variables:
        XDRIVE_GITLAB_PACKAGE_ONLY: "1"
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  extends: .ci-tools-cache
  stage: package
  needs: []
  resource_group: xdrive-server-image
  tags:
    - linux
  before_script:
    - *install_docker_cli_only
  script:
    - XDRIVE_GITLAB_PACKAGE_ONLY=1 bash scripts/ci/gitlab-server-image.sh
  artifacts:
    name: "xdrive-server-image-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - dist/server-image/

media-worker-image:
  # Keep in-flight master publication inputs noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
      variables:
        XDRIVE_GITLAB_PACKAGE_ONLY: "1"
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  extends: .ci-tools-cache
  stage: package
  needs: []
  resource_group: xdrive-media-worker-image
  tags:
    - linux
  before_script:
    - *install_docker_cli_only
  script:
    - XDRIVE_GITLAB_PACKAGE_ONLY=1 bash scripts/ci/test-media-worker-image.sh dist/media-worker-image
  artifacts:
    name: "xdrive-media-worker-image-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - dist/media-worker-image/

photo-face-image:
  # Keep in-flight master publication inputs noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
      variables:
        XDRIVE_GITLAB_PACKAGE_ONLY: "1"
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  stage: package
  timeout: 2h
  needs: []
  resource_group: xdrive-photo-face-image
  tags:
    - linux
  cache:
    key: "xdrive-photo-face-runtime-v2-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/ci-tools/
      - .cache/photo-face-runtime/
      - .cache/photo-face-models/
    policy: pull-push
    when: always
  before_script:
    - *install_docker_cli_only
  script:
    # Leave time below the 2h job limit for cache:when:always to save
    # compatible model .part files even if every source is too slow.
    - timeout --signal=TERM --kill-after=30s 105m env XDRIVE_GITLAB_PACKAGE_ONLY=1 bash scripts/ci/test-photo-face-image.sh dist/photo-face-image
  artifacts:
    name: "xdrive-photo-face-image-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - dist/photo-face-image/

caddy-image:
  # Keep in-flight master publication inputs noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
      variables:
        XDRIVE_GITLAB_PACKAGE_ONLY: "1"
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  extends: .ci-tools-cache
  stage: package
  needs:
    - job: web
      artifacts: true
  resource_group: xdrive-caddy-image
  tags:
    - linux
  before_script:
    - *install_docker_cli_only
  script:
    - XDRIVE_GITLAB_PACKAGE_ONLY=1 bash scripts/ci/gitlab-caddy-image.sh
  artifacts:
    name: "xdrive-caddy-image-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - dist/caddy-image/

package-windows-client:
  # Keep in-flight master publication inputs noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
    - when: on_success
  stage: package
  needs:
    - job: desktop-windows
      artifacts: true
    - job: build-client-core
      artifacts: true
  resource_group: xdrive-package-windows-client
  tags:
    - windows
  script:
    - bash scripts/ci/gitlab-package-windows-client.sh
  artifacts:
    name: "xdrive-windows-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xDriveSetup-amd64.exe

web:
  # Keep in-flight master publication inputs noninterruptible.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
      variables:
        XDRIVE_GITLAB_PACKAGE_ONLY: "1"
    - when: on_success
  image: $XDRIVE_CI_NODE_IMAGE
  stage: build
  needs: []
  cache:
    key: "xdrive-web-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/npm/
    policy: pull-push
    when: always
  tags:
    - linux
  script:
    - |
      set -euo pipefail
      node_major="$(node -p 'process.versions.node.split(".")[0]')"
      if [[ "$node_major" != "22" ]]; then
        echo "Node.js 22 is required; found $(node --version)." >&2
        exit 1
      fi
      cd web
      npm ci --no-audit --no-fund
      npm run build
  artifacts:
    name: "xdrive-web-dist-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - web/dist/

