build-client-core:
  variables:
    GIT_DEPTH: "0"
  # Preserve only master snapshot publication prerequisites across frequent pushes.
  # Other tests remain interruptible; MR and stable behavior is unchanged.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: false
    - when: on_success
  image: $XDRIVE_CI_GO_IMAGE
  extends: .go-linux-cache
  stage: build
  needs: []
  tags:
    - linux
  script:
    - |
      set -euo pipefail
      source scripts/ci/client-artifact-version.sh
      bash scripts/build-client-core.sh "$XDRIVE_RELEASE_VERSION" release/core
      # Same immutable core binaries as Desktop; never build a second uploader.
      if ! command -v python3 >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends python3
      fi
      bash scripts/package-backup-cli.sh release/core release/backup-cli
      bash scripts/ci/test-backup-cli-archives.sh "$XDRIVE_RELEASE_VERSION" release/backup-cli release/core
      bash scripts/ci/test-synology-spk-version.sh
      bash scripts/ci/test-synology-release.sh
      source scripts/ci/synology-spk-version.sh
      source scripts/ci/build-metadata.sh
      bash scripts/build-synology-spk.sh "$XDRIVE_SPK_VERSION" release/synology
      python3 scripts/ci/test-synology-spk.py \
        "release/synology/xdrivenas-armada38x-$XDRIVE_SPK_VERSION.spk" \
        release/synology/core "$XDRIVE_SPK_VERSION"
      bash scripts/ci/verify-synology-spk-release.sh release/synology
  artifacts:
    name: "xdrive-client-core-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 days
    when: on_success
    paths:
      - release/core/
      - release/backup-cli/
      - release/synology/*.spk
      - release/synology/*.spk.sha256

