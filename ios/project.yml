name: xDriveIOS
options:
  bundleIdPrefix: com.lazyxu
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  xDriveIOS:
    type: application
    platform: iOS
    sources:
      - path: XDriveIOS
    info:
      path: XDriveIOS/Info.plist
      properties:
        CFBundleDisplayName: xDrive
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: 用于连接你局域网内的 xDrive 服务器。
        NSPhotoLibraryUsageDescription: 仅在你授权并主动点击查看或备份时读取已授权的照片及原件；点击备份后会将所选原件上传至你的 xDrive 云端，不会在后台自动上传。
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.lazyxu.xdrive.ios.photos.backup
        UIBackgroundModes:
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazyxu.xdrive.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
