name: xDriveIOS
options:
  bundleIdPrefix: com.lazyxu
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  xDriveIOS:
    type: application
    platform: iOS
    sources:
      - path: XDriveIOS
    # XcodeGen generates this file. A signed APNs build must explicitly pass
    # XDRIVE_APNS_ENVIRONMENT=development|production, matching the Apple profile.
    # Unsigned IPA builds do not claim push delivery.
    entitlements:
      path: XDriveIOS/XDriveIOS.entitlements
      properties:
        aps-environment: $(XDRIVE_APNS_ENVIRONMENT)
    info:
      path: XDriveIOS/Info.plist
      properties:
        # Rotation is an App entitlement of the generated Info.plist, not
        # something SwiftUI size classes can enable on their own.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: xDrive
        XDriveSourceCommit: $(XDRIVE_SOURCE_COMMIT)
        # Must match signed provisioning; the unsigned build does not
        # claim that silent push has been delivered.
        XDriveAPNSEnvironment: $(XDRIVE_APNS_ENVIRONMENT)
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: 用于连接你局域网内的 xDrive 服务器。
        NSLocationWhenInUseUsageDescription: 仅在你主动点击相册地图“我的位置”时使用定位并移动地图。云端地图会向当前 xDrive 服务器查询该位置周围的地图视窗；应用不会单独保存设备定位记录。
        NSPhotoLibraryUsageDescription: 仅在你允许后读取有权限访问的照片、视频和实况原件以展示或备份；手动备份由你主动启动。只有你另外开启自动备份并明确批准后台授权后，iOS 允许时才可能在前台或后台读取并向当前账户的 xDrive 服务器上传原件；你可以随时停止。 仅当你主动使用“释放空间”并完成云端物理原件保护核验及再次确认时，才会请求 iOS 删除所选原件；使用 iCloud Photos 时删除会同步到所有设备。
        NSPhotoLibraryAddUsageDescription: 仅在你点击云端原件的“保存到 iOS 照片”后，将指定的照片、视频或 Live Photo 原件添加到系统相册；不会自动恢复或删除云端文件。
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.lazyxu.xdrive.ios.photos.backup
        UIBackgroundModes:
          - processing
          # Requires an Apple-signed aps-environment entitlement and an
          # Owner-bound APNs sender before any real wake can be received.
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazyxu.xdrive.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: xDriveClipboardShare
        embed: true
  xDriveClipboardShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ClipboardShareExtension
    info:
      path: ClipboardShareExtension/Info.plist
      properties:
        CFBundleDisplayName: xDrive Clipboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazyxu.xdrive.ios.ClipboardShare
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
