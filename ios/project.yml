name: xDriveIOS
options:
  bundleIdPrefix: com.lazyxu
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  xDriveIOS:
    type: application
    platform: iOS
    sources:
      - path: XDriveIOS
    info:
      path: XDriveIOS/Info.plist
      properties:
        CFBundleDisplayName: xDrive
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: 用于连接你局域网内的 xDrive 服务器。
        NSPhotoLibraryUsageDescription: 仅在明确授权后读取你允许访问的照片与原件，并在你启用自动增量备份后尝试系统允许的后台任务；上传前仍验证当前账户和服务器，随时可关闭。
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.lazyxu.xdrive.ios.photos.incremental
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazyxu.xdrive.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
