<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680">
  <rect width="1120" height="680" rx="22" fill="#eef3f8"/>
  <rect x="42" y="36" width="1036" height="608" rx="18" fill="#fff" stroke="#cad5e3"/>
  <rect x="42" y="36" width="1036" height="58" rx="18" fill="#f5f8fb"/>
  <text x="78" y="72" font-family="Arial, sans-serif" font-size="21" fill="#24364b">创建任务 · 任务设置</text>
  <rect x="84" y="124" width="952" height="62" rx="10" fill="#f8fafc"/>
  <rect x="100" y="140" width="110" height="34" rx="8" fill="#edf2f7"/><text x="126" y="163" font-family="Arial" font-size="15" fill="#6c7d90">常规</text>
  <rect x="224" y="140" width="110" height="34" rx="8" fill="#edf2f7"/><text x="250" y="163" font-family="Arial" font-size="15" fill="#6c7d90">计划</text>
  <rect x="348" y="140" width="120" height="34" rx="8" fill="#dceafb"/><text x="370" y="163" font-family="Arial" font-size="15" fill="#2165b5">任务设置</text>
  <text x="104" y="240" font-family="Arial" font-size="17" fill="#32465b">用户定义的脚本</text>
  <rect x="104" y="262" width="884" height="232" rx="10" fill="#172033"/>
  <text x="130" y="304" font-family="monospace" font-size="15" fill="#dfe7f2">export XD_SOURCE_AGENT_CONFIG_DIR=/volume1/@appdata/xdrive-source-agent</text>
  <text x="130" y="340" font-family="monospace" font-size="15" fill="#dfe7f2">/volume1/tools/xdrive-source-agent run --due --interval 6h </text>
  <text x="130" y="376" font-family="monospace" font-size="15" fill="#dfe7f2">  &gt;&gt; /volume1/@appdata/xdrive-source-agent/task.log 2&gt;&amp;1</text>
  <rect x="660" y="516" width="328" height="74" rx="12" fill="#eaf6ee" stroke="#9bc9aa"/>
  <text x="684" y="546" font-family="Arial" font-size="16" fill="#267447">保存后可点击“运行”测试</text>
  <text x="684" y="571" font-family="Arial" font-size="13" fill="#587a63">随后用 source-agent status 检查状态。</text>
  <text x="104" y="574" font-family="Arial" font-size="14" fill="#8391a2">脚本中不要写 xDrive 密码；登录凭据由 source-agent 私有凭据存储维护。</text>
</svg>