<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">xDrive master app icon</title>
  <desc id="desc">Rounded blue square with an interwoven white and icy-blue x/infinity symbol.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EA7FF"/>
      <stop offset="0.48" stop-color="#1787FA"/>
      <stop offset="1" stop-color="#0E67F2"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="34%" cy="18%" r="88%">
