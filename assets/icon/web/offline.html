<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F7FB" />
    <title>连接不可用 · xDrive</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #f5f7fb; color: #1d2837; }
      main { width: min(100%, 420px); text-align: center; }
      .symbol { width: 60px; height: 60px; display: grid; place-items: center; margin: 0 auto 24px;
        background: #e2eafa; border-radius: 18px; font-weight: 700; font-size: 23px; color: #2563eb; }
      h1 { margin: 0 0 12px; font-size: 23px; line-height: 1.3; }
      p { margin: 0 0 24px; line-height: 1.7; color: #526174; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 22px;
        background: #2563eb; color: #fff; border-radius: 12px; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #111827; outline-offset: 4px; }
      small { display: block; margin-top: 24px; line-height: 1.6; color: #526174; }
      @media (prefers-color-scheme: dark) {
        body { background: #111419; color: #f7f8fb; }
        .symbol { background: #1c3457; color: #8bbcff; }
        p, small { color: #acb6c5; }
        a { background: #83b2ff; color: #081425; }
        a:focus-visible { outline-color: #fff; }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <div class="symbol" aria-hidden="true">xD</div>
      <h1 id="offline-title">暂时无法连接 xDrive</h1>
      <p>网络可能已断开，或者 xDrive 服务暂时不可用。请检查网络和服务器状态，然后重试。</p>
      <a href="">重新尝试</a>
      <small>此页面不包含账号信息、云端文件或照片，也不会在后台启动传输。</small>
    </main>
  </body>
</html>
