name: xdrive

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${XD_LOG_MAX_SIZE:-10m}"
    max-file: "${XD_LOG_MAX_FILES:-5}"

services:
  postgres:
    container_name: xdrive-postgres
    image: ${XD_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: xdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ~/.xd/config/.env}
      POSTGRES_DB: xdrive
    volumes:
      - "${XD_POSTGRES_DATA_DIR:-../data/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U xdrive -d xdrive"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${XD_POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: ${XD_POSTGRES_PIDS_LIMIT:-256}

  storage-init:
    image: ${XD_SERVER_IMAGE:-ghcr.io/lazyxu/xdrive-server:latest}
    user: "0:0"
    environment:
      XD_STORAGE_ROOT: /data
    volumes:
      - "${XD_FILES_DATA_DIR:-../data/files}:/data"
    command:
      - "storage"
      - "prepare"
      - "--uid"
      - "${XD_SERVER_UID:-65532}"
      - "--gid"
      - "${XD_SERVER_GID:-65532}"
    restart: "no"
    logging: *default-logging
    mem_limit: ${XD_STORAGE_INIT_MEMORY_LIMIT:-256m}
    cpus: ${XD_STORAGE_INIT_CPU_LIMIT:-0.25}
    pids_limit: ${XD_STORAGE_INIT_PIDS_LIMIT:-64}

  server:
    container_name: xdrive-server
    image: ${XD_SERVER_IMAGE:-ghcr.io/lazyxu/xdrive-server:latest}
    user: "${XD_SERVER_UID:-65532}:${XD_SERVER_GID:-65532}"
    environment:
      XD_LISTEN_ADDR: :8080
      XD_DATABASE_URL: postgres://xdrive:${POSTGRES_PASSWORD}@postgres:5432/xdrive?sslmode=disable
      XD_JWT_SECRET: ${XD_JWT_SECRET:?set XD_JWT_SECRET in ~/.xd/.env}
      XD_CONNECTOR_SECRET_ACTIVE_VERSION: ${XD_CONNECTOR_SECRET_ACTIVE_VERSION:-}
      XD_CONNECTOR_SECRET_KEYS: ${XD_CONNECTOR_SECRET_KEYS:-}
      XD_CONNECTOR_SECRET_KEY: ${XD_CONNECTOR_SECRET_KEY:-}
      XD_ACCESS_TOKEN_TTL: ${XD_ACCESS_TOKEN_TTL:-15m}
      XD_REFRESH_TOKEN_TTL: ${XD_REFRESH_TOKEN_TTL:-720h}
      XD_STORAGE_ROOT: /data
      XD_HOST_CONTROL_DIR: /host-control
      XD_FILES_DATA_HOST_PATH: ${XD_FILES_DATA_DIR:-}
      XD_POSTGRES_DATA_HOST_PATH: ${XD_POSTGRES_DATA_DIR:-}
      XD_BACKUP_ROOT_HOST_PATH: ${XD_BACKUP_ROOT_HOST_DIR:-}
      XD_HOME_HOST_PATH: ${XD_HOME_HOST_DIR:-}
      XD_CADDY_DATA_HOST_PATH: ${XD_CADDY_DATA_DIR:-}
      XD_CADDY_CONFIG_HOST_PATH: ${XD_CADDY_CONFIG_DIR:-}
      XD_ALLOWED_ORIGIN: ${XD_ALLOWED_ORIGIN:-http://localhost:3000}
      # Read-only operator LAN IP intent; Server never controls Caddy/Docker.
      XD_LAN_HTTPS_IP: ${XD_LAN_HTTPS_IP:-}
      XD_MAX_UPLOAD_BYTES: ${XD_MAX_UPLOAD_BYTES:-21474836480}
      XD_PHOTO_PLACE_GEONAMES_DIR: ${XD_PHOTO_PLACE_GEONAMES_DIR:-}
      XD_GEONAMES_SNAPSHOT_DIR: ${XD_GEONAMES_SNAPSHOT_DIR:-}
      XD_PHOTO_PLACE_MAX_DISTANCE_KM: ${XD_PHOTO_PLACE_MAX_DISTANCE_KM:-100}
      XD_BAIDU_MAP_ENABLED: "${XD_BAIDU_MAP_ENABLED:-false}"
      XD_BAIDU_MAP_AK: "${XD_BAIDU_MAP_AK:-}"
      XD_PHOTO_FACE_ANALYZER_SOCKET: ${XD_PHOTO_FACE_ANALYZER_SOCKET:-}
      XD_MEDIA_WORKER_SOCKET: ${XD_MEDIA_WORKER_SOCKET:-}
      XD_PHOTO_FACE_ANALYZER_TOKEN: ${XD_PHOTO_FACE_ANALYZER_TOKEN:-}
      XD_PHOTO_FACE_PREVIEW_BASE_URL: ${XD_PHOTO_FACE_PREVIEW_BASE_URL:-http://server:8080}
    volumes:
      - "${XD_FILES_DATA_DIR:-../data/files}:/data"
      - "${XD_HOST_CONTROL_HOST_DIR:-../state/control}:/host-control"
      - "${XD_PHOTO_FACE_RUNTIME_DIR:-../state/photo-face}:/run/xdrive-photo-face"
      - "${XD_MEDIA_WORKER_RUNTIME_DIR:-../state/media-worker}:/run/xdrive-media-worker:ro"
      - "${XD_GEONAMES_HOST_DIR:-../data/geonames}:/geonames:ro"
    networks:
      - default
      - photo-intelligence
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/xdrive-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_SERVER_MEMORY_LIMIT:-1g}
    cpus: ${XD_SERVER_CPU_LIMIT:-1.0}
    pids_limit: ${XD_SERVER_PIDS_LIMIT:-256}

  worker:
    container_name: xdrive-worker
    image: ${XD_SERVER_IMAGE:-ghcr.io/lazyxu/xdrive-server:latest}
    user: "${XD_SERVER_UID:-65532}:${XD_SERVER_GID:-65532}"
    command: ["worker"]
    environment:
      XD_DATABASE_URL: postgres://xdrive:${POSTGRES_PASSWORD}@postgres:5432/xdrive?sslmode=disable
      XD_JWT_SECRET: ${XD_JWT_SECRET:?set XD_JWT_SECRET in ~/.xd/.env}
      XD_CONNECTOR_SECRET_ACTIVE_VERSION: ${XD_CONNECTOR_SECRET_ACTIVE_VERSION:-}
      XD_CONNECTOR_SECRET_KEYS: ${XD_CONNECTOR_SECRET_KEYS:-}
      XD_CONNECTOR_SECRET_KEY: ${XD_CONNECTOR_SECRET_KEY:-}
      XD_INTERNAL_SERVER_URL: ${XD_INTERNAL_SERVER_URL:-http://server:8080}
      XD_SOURCE_PULL_INTERVAL: ${XD_SOURCE_PULL_INTERVAL:-6h}
      XD_SOURCE_WORKER_POLL_INTERVAL: ${XD_SOURCE_WORKER_POLL_INTERVAL:-1m}
      XD_HEALTHCHECK_URL: http://server:8080/api/v1/readyz
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_WORKER_MEMORY_LIMIT:-512m}
    cpus: ${XD_WORKER_CPU_LIMIT:-0.50}
    pids_limit: ${XD_WORKER_PIDS_LIMIT:-128}

  # Optional isolated runtime; no network access and no xDrive media mount.
  # Runtime health is real; job submission is intentionally unsupported.
  media-worker:
    profiles: ["media-worker"]
    container_name: xdrive-media-worker
    image: ${XD_MEDIA_WORKER_IMAGE:-ghcr.io/lazyxu/xdrive-media-worker:latest}
    user: "${XD_SERVER_UID:-65532}:${XD_SERVER_GID:-65532}"
    environment:
      XD_MEDIA_WORKER_SOCKET: /run/xdrive-media-worker/media-worker.sock
    volumes:
      - "${XD_MEDIA_WORKER_RUNTIME_DIR:-../state/media-worker}:/run/xdrive-media-worker"
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/xdrive-server", "media-worker", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_MEDIA_WORKER_MEMORY_LIMIT:-768m}
    cpus: ${XD_MEDIA_WORKER_CPU_LIMIT:-0.75}
    pids_limit: ${XD_MEDIA_WORKER_PIDS_LIMIT:-128}

  photo-face:
    profiles: ["photo-intelligence"]
    container_name: xdrive-photo-face
    image: ${XD_PHOTO_FACE_IMAGE:-ghcr.io/lazyxu/xdrive-photo-face:latest}
    user: "${XD_SERVER_UID:-65532}:${XD_SERVER_GID:-65532}"
    environment:
      XD_FACE_SOCKET: /run/xdrive-photo-face/photo-face.sock
      XD_FACE_ANALYZER_TOKEN: ${XD_PHOTO_FACE_ANALYZER_TOKEN:-}
      # Operator opt-in only; legacy keeps tokenless deployments unchanged.
      XD_PHOTO_PRIVATE_INGRESS_POLICY: ${XD_PHOTO_PRIVATE_INGRESS_POLICY:-legacy}
      # Operator-only model-side receipt capability, not given to Server.
      XD_PHOTO_HOST_APPLY_TOKEN: ${XD_PHOTO_HOST_APPLY_TOKEN:-}
      XD_FACE_PREVIEW_ORIGIN: ${XD_PHOTO_FACE_PREVIEW_BASE_URL:-http://server:8080}
    volumes:
      - "${XD_PHOTO_FACE_RUNTIME_DIR:-../state/photo-face}:/run/xdrive-photo-face"
    networks:
      - photo-intelligence
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "/app/analyzer.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_PHOTO_FACE_MEMORY_LIMIT:-1g}
    cpus: ${XD_PHOTO_FACE_CPU_LIMIT:-1.0}
    pids_limit: ${XD_PHOTO_FACE_PIDS_LIMIT:-128}

  caddy:
    container_name: xdrive-caddy
    image: ${XD_CADDY_IMAGE:-ghcr.io/lazyxu/xdrive-caddy:latest}
    environment:
      XD_DOMAIN: ${XD_DOMAIN:-}
      # Opt-in private IP HTTPS identity, served on the existing 8443:443
      # listener. Never exposes XD_WEB_PORT or enables plaintext IP login.
      XD_LAN_HTTPS_IP: ${XD_LAN_HTTPS_IP:-}
      XD_LEGACY_HTTP_ONLY: ${XD_LEGACY_HTTP_ONLY:-0}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
    command:
      - /bin/sh
      - /usr/local/bin/xdrive-caddy-start
    ports:
      - "${XD_WEB_BIND:-127.0.0.1}:${XD_WEB_PORT:-3000}:80/tcp"
      - "${XD_HTTPS_BIND:-0.0.0.0}:${XD_HTTPS_PORT:-8443}:443/tcp"
    volumes:
      - "${XD_CADDY_DATA_DIR:-../data/caddy/data}:/data"
      - "${XD_CADDY_CONFIG_DIR:-../data/caddy/config}:/config"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_CADDY_MEMORY_LIMIT:-256m}
    cpus: ${XD_CADDY_CPU_LIMIT:-0.50}
    pids_limit: ${XD_CADDY_PIDS_LIMIT:-128}

  # Explicit operator-only recovery candidate. Disabled unless the operator
  # enables the caddy-rescue profile; NEVER counts as verified safe ingress
  # merely because this Compose definition exists.
  # 127.0.0.1 on the host only; remote operators must use an SSH tunnel.
  # Separate process, no AliDNS env, no main Caddy volumes and no Docker API.
  caddy-rescue:
    profiles: ["caddy-rescue"]
    container_name: xdrive-caddy-rescue
    # May be pinned to a separately known-good immutable image digest.
    image: ${XD_CADDY_RESCUE_IMAGE:-ghcr.io/lazyxu/xdrive-caddy:latest}
    user: "${XD_SERVER_UID:-65532}:${XD_SERVER_GID:-65532}"
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile.rescue
      - --adapter
      - caddyfile
    environment:
      XDG_CONFIG_HOME: /tmp/caddy-rescue-config
      XDG_DATA_HOME: /tmp/caddy-rescue-data
    ports:
      - "127.0.0.1:${XD_CADDY_RESCUE_PORT:-3080}:8080/tcp"
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_CADDY_RESCUE_MEMORY_LIMIT:-128m}
    cpus: ${XD_CADDY_RESCUE_CPU_LIMIT:-0.25}
    pids_limit: ${XD_CADDY_RESCUE_PIDS_LIMIT:-64}

networks:
  default:
  photo-intelligence:
    internal: true
