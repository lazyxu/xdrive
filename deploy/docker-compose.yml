name: xdrive

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${XD_LOG_MAX_SIZE:-10m}"
    max-file: "${XD_LOG_MAX_FILES:-5}"

services:
  postgres:
    image: ${XD_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: xdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ~/.xd/.env}
      POSTGRES_DB: xdrive
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U xdrive -d xdrive"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${XD_POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: ${XD_POSTGRES_PIDS_LIMIT:-256}

  storage-init:
    image: ${XD_SERVER_IMAGE:-ghcr.io/lazyxu/xdrive-server:latest}
    user: "0:0"
    environment:
      XD_STORAGE_ROOT: /data
    volumes:
      - file-data:/data
    command: ["storage", "prepare", "--uid", "65532", "--gid", "65532"]
    restart: "no"
    logging: *default-logging
    mem_limit: ${XD_STORAGE_INIT_MEMORY_LIMIT:-256m}
    cpus: ${XD_STORAGE_INIT_CPU_LIMIT:-0.25}
    pids_limit: ${XD_STORAGE_INIT_PIDS_LIMIT:-64}

  server:
    image: ${XD_SERVER_IMAGE:-ghcr.io/lazyxu/xdrive-server:latest}
    environment:
      XD_LISTEN_ADDR: :8080
      XD_DATABASE_URL: postgres://xdrive:${POSTGRES_PASSWORD}@postgres:5432/xdrive?sslmode=disable
      XD_JWT_SECRET: ${XD_JWT_SECRET:?set XD_JWT_SECRET in ~/.xd/.env}
      XD_CONNECTOR_SECRET_ACTIVE_VERSION: ${XD_CONNECTOR_SECRET_ACTIVE_VERSION:-}
      XD_CONNECTOR_SECRET_KEYS: ${XD_CONNECTOR_SECRET_KEYS:-}
      XD_CONNECTOR_SECRET_KEY: ${XD_CONNECTOR_SECRET_KEY:-}
      XD_ACCESS_TOKEN_TTL: ${XD_ACCESS_TOKEN_TTL:-15m}
      XD_REFRESH_TOKEN_TTL: ${XD_REFRESH_TOKEN_TTL:-720h}
      XD_STORAGE_ROOT: /data
      XD_ALLOWED_ORIGIN: ${XD_ALLOWED_ORIGIN:-http://localhost:3000}
      XD_MAX_UPLOAD_BYTES: ${XD_MAX_UPLOAD_BYTES:-21474836480}
    volumes:
      - file-data:/data
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/xdrive-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_SERVER_MEMORY_LIMIT:-1g}
    cpus: ${XD_SERVER_CPU_LIMIT:-1.0}
    pids_limit: ${XD_SERVER_PIDS_LIMIT:-256}

  worker:
    image: ${XD_SERVER_IMAGE:-ghcr.io/lazyxu/xdrive-server:latest}
    command: ["worker"]
    environment:
      XD_DATABASE_URL: postgres://xdrive:${POSTGRES_PASSWORD}@postgres:5432/xdrive?sslmode=disable
      XD_JWT_SECRET: ${XD_JWT_SECRET:?set XD_JWT_SECRET in ~/.xd/.env}
      XD_CONNECTOR_SECRET_ACTIVE_VERSION: ${XD_CONNECTOR_SECRET_ACTIVE_VERSION:-}
      XD_CONNECTOR_SECRET_KEYS: ${XD_CONNECTOR_SECRET_KEYS:-}
      XD_CONNECTOR_SECRET_KEY: ${XD_CONNECTOR_SECRET_KEY:-}
      XD_INTERNAL_SERVER_URL: ${XD_INTERNAL_SERVER_URL:-http://server:8080}
      XD_SOURCE_PULL_INTERVAL: ${XD_SOURCE_PULL_INTERVAL:-6h}
      XD_SOURCE_WORKER_POLL_INTERVAL: ${XD_SOURCE_WORKER_POLL_INTERVAL:-1m}
      XD_HEALTHCHECK_URL: http://server:8080/api/v1/readyz
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_WORKER_MEMORY_LIMIT:-512m}
    cpus: ${XD_WORKER_CPU_LIMIT:-0.50}
    pids_limit: ${XD_WORKER_PIDS_LIMIT:-128}

  web:
    image: ${XD_WEB_IMAGE:-ghcr.io/lazyxu/xdrive-web:latest}
    ports:
      - "${XD_WEB_BIND:-127.0.0.1}:${XD_WEB_PORT:-3000}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_WEB_MEMORY_LIMIT:-256m}
    cpus: ${XD_WEB_CPU_LIMIT:-0.50}
    pids_limit: ${XD_WEB_PIDS_LIMIT:-128}

  caddy:
    image: ${XD_CADDY_IMAGE:-ghcr.io/lazyxu/xdrive-caddy:latest}
    profiles: ["https"]
    environment:
      XD_DOMAIN: ${XD_DOMAIN:-localhost}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
    ports:
      - "${XD_HTTPS_BIND:-0.0.0.0}:${XD_HTTPS_PORT:-8443}:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${XD_CADDY_MEMORY_LIMIT:-256m}
    cpus: ${XD_CADDY_CPU_LIMIT:-0.50}
    pids_limit: ${XD_CADDY_PIDS_LIMIT:-128}

volumes:
  postgres-data:
  file-data:
  caddy-data:
  caddy-config:
