.publish-only:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - when: never

.release-linux-docker:
  image: $XDRIVE_CI_GO_IMAGE
  tags:
    - linux
  cache:
    key: "xdrive-ci-tools-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/ci-tools/
    policy: pull-push
    when: always
  before_script:
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl
      rm -rf /var/lib/apt/lists/*
    - bash scripts/ci/install-docker-cli.sh
    - docker info >/dev/null

release-assets:
  extends: .publish-only
  image: $XDRIVE_CI_GO_IMAGE
  tags:
    - linux
  stage: release-build
  needs:
    - job: build-source-agent
      artifacts: true
    - job: final-gate
      artifacts: false
  script:
    - bash scripts/ci/gitlab-release-assets.sh
  artifacts:
    name: "xdrive-release-assets-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xdrive-source-agent-linux-amd64
      - release/xdrive-source-agent-linux-arm64
      - release/xdrive-server-install.sh
      - release/server-backup.sh
      - release/server-backup-scheduled.sh
      - release/server-restore.sh
      - release/server-verify.sh
      - release/server-doctor.sh
      - release/xdrive-server
      - release/docker-compose.yml
      - release/Caddyfile
      - release/xdrive.env.example

build-server-images:
  extends:
    - .publish-only
    - .release-linux-docker
  stage: release-build
  resource_group: xdrive-gitlab-server-images
  needs:
    - job: final-gate
      artifacts: false
  script:
    - bash scripts/ci/gitlab-server-images.sh

promote-server-images:
  extends:
    - .publish-only
    - .release-linux-docker
  stage: promote
  resource_group: xdrive-gitlab-server-images
  needs:
    - job: release-assets
      artifacts: false
    - job: build-server-images
      artifacts: false
  script:
    - bash scripts/ci/gitlab-promote-images.sh

publish-release:
  extends: .publish-only
  image: $XDRIVE_CI_GLAB_IMAGE
  stage: release
  tags:
    - linux
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: package-linux-client
      artifacts: true
    - job: package-windows-client
      artifacts: true
    - job: release-assets
      artifacts: true
    - job: promote-server-images
      artifacts: false
  script:
    - sh scripts/ci/gitlab-publish-release.sh
  artifacts:
    name: "xdrive-release-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/
