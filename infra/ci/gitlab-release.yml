.publish-only:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
    - when: never

.release-linux-docker:
  image: $XDRIVE_CI_GO_IMAGE
  tags:
    - linux
  cache:
    key: "xdrive-ci-tools-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/ci-tools/
    policy: pull-push
    when: always
  before_script:
    # Go bookworm already includes curl and CA certs. Required image
    # publication must not depend on Debian APT network reachability.
    - bash scripts/ci/install-docker-cli.sh
    - docker info >/dev/null

release-assets:
  # Immutable source asset collection is safe to cancel on superseded master.
  interruptible: true
  extends: .publish-only
  image: $XDRIVE_CI_GO_IMAGE
  tags:
    - linux
  stage: release-build
  needs: []  # Source-only: do not wait for Photo Face / Media Worker builds.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      interruptible: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      interruptible: true
      when: on_success
    - when: never
  script:
    - bash scripts/ci/gitlab-release-assets.sh
  artifacts:
    name: "xdrive-release-assets-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xdrive-server-install.sh
      - release/server-backup.sh
      - release/server-backup-scheduled.sh
      - release/server-restore.sh
      - release/server-verify.sh
      - release/server-doctor.sh
      - release/server-migrate-user.sh
      - release/server-control.sh
      - release/release_bundle.py
      - release/caddy-env-config.py
      - release/caddy-admission.py
      - release/xdrive-share-update.py
      - release/xdrive-server
      - release/docker-compose.yml
      - release/xdrive.env.example

publish-server-images:
  # The image/asset publisher must finish once its master pipeline starts.
  interruptible: false
  extends:
    - .publish-only
    - .release-linux-docker
  stage: release-build
  resource_group: xdrive-gitlab-server-images
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      needs:
        - job: server-image
          artifacts: true
        - job: caddy-image
          artifacts: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      when: on_success
      needs:
        - job: server-image
          artifacts: true
        - job: caddy-image
          artifacts: true
    - when: never
  script:
    - bash scripts/ci/gitlab-server-images.sh
  artifacts:
    name: "xdrive-core-image-manifest-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - dist/release-image/image-manifest.tsv

publish-photo-face-image:
  # Optional service images do not block rolling core Snapshots.
  # Stable v* releases retain the complete exact-Commit image gate.
  extends:
    - .publish-only
    - .release-linux-docker
  stage: release-build
  interruptible: false
  resource_group: xdrive-gitlab-photo-face-publish
  needs:
    - job: photo-face-image
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      changes:
        - services/photo-face-analyzer/**/*
        - scripts/ci/test-photo-face-image.sh
        - scripts/ci/photo-face-runtime-cache-key.sh
        - scripts/ci/gitlab-registry-utils.sh
        - scripts/ci/gitlab-stage-image.sh
        - scripts/ci/gitlab-fetch-staged-image.sh
        - scripts/ci/gitlab-server-images.sh
        - scripts/ci/gitlab-promote-images.sh
        - .gitlab-ci.yml
        - infra/ci/gitlab-release.yml
      allow_failure: true
      when: on_success
    - when: never
  script:
    - bash scripts/ci/gitlab-server-images.sh xdrive-photo-face dist/photo-face-image xdrive/photo-face:test
    - bash scripts/ci/gitlab-promote-images.sh xdrive-photo-face

publish-media-worker-image:
  # Optional service images do not block rolling core Snapshots.
  # Stable v* releases retain the complete exact-Commit image gate.
  extends:
    - .publish-only
    - .release-linux-docker
  stage: release-build
  interruptible: false
  resource_group: xdrive-gitlab-media-worker-publish
  needs:
    - job: media-worker-image
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      changes:
        - cmd/server/**/*
        - internal/**/*
        - go.mod
        - go.sum
        - deploy/MediaWorker.Dockerfile
        - deploy/install-media-worker-ffmpeg.sh
        - scripts/ci/test-media-worker-image.sh
        - scripts/ci/gitlab-registry-utils.sh
        - scripts/ci/gitlab-stage-image.sh
        - scripts/ci/gitlab-fetch-staged-image.sh
        - scripts/ci/gitlab-server-images.sh
        - scripts/ci/gitlab-promote-images.sh
        - .gitlab-ci.yml
        - infra/ci/gitlab-release.yml
      allow_failure: true
      when: on_success
    - when: never
  script:
    - bash scripts/ci/gitlab-server-images.sh xdrive-media-worker dist/media-worker-image xdrive/media-worker:test
    - bash scripts/ci/gitlab-promote-images.sh xdrive-media-worker

promote-server-images:
  # The image/asset publisher must finish once its master pipeline starts.
  interruptible: false
  extends:
    - .publish-only
    - .release-linux-docker
  stage: promote
  resource_group: xdrive-gitlab-server-images
  needs:
    - job: release-assets
      artifacts: false
    - job: publish-server-images
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      when: on_success
    - when: never
  script:
    - bash scripts/ci/gitlab-promote-images.sh

publish-release:
  extends: .publish-only
  # A newer master pipeline cannot kill or interleave an in-flight link promotion.
  interruptible: false
  resource_group: xdrive-gitlab-release-publish
  image: $XDRIVE_CI_GLAB_IMAGE
  stage: release
  tags:
    - linux
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  before_script:
    - sh scripts/ci/install-gitlab-release-tools.sh
  # A Snapshot with complete artifacts may publish even if unrelated tests fail.
  # A missing image/client artifact must still fail closed.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      needs:
        - job: build-client-core
          artifacts: true
        - job: package-linux-client
          artifacts: true
        - job: package-windows-client
          artifacts: true
        - job: release-assets
          artifacts: true
        - job: publish-server-images
          artifacts: true
        - job: promote-server-images
          artifacts: false
        - job: publish-photo-face-image
          artifacts: false
        - job: publish-media-worker-image
          artifacts: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      when: on_success
    - when: never
  needs:
    - job: build-client-core
      artifacts: true
    - job: package-linux-client
      artifacts: true
    - job: package-windows-client
      artifacts: true
    - job: release-assets
      artifacts: true
    - job: promote-server-images
      artifacts: false
    - job: publish-server-images
      artifacts: true
  script:
    - |
      set -eu
      # Preserve the exact binary archives already verified and built by CI.
      cp release/backup-cli/xdrive-backup-linux-amd64.tar.gz release/
      cp release/backup-cli/xdrive-backup-windows-amd64.zip release/
      # Publish the exact CI-built ARMv7 package; never recompile inside the publisher.
      set -- release/synology/xdrivenas-armada38x-*.spk
      [ "$#" = 1 ] && [ -s "$1" ] && [ -s "$1.sha256" ] || {
        echo "missing or ambiguous CI-built Synology SPK" >&2; exit 1;
      }
      cp "$1" "$1.sha256" release/
      bash scripts/ci/verify-synology-spk-release.sh release --require-mui
      # Validate both exact named Server+Caddy image refs, channel and SHA256
      # digests, not merely the number of "image" records.
      python3 scripts/ci/verify-gitlab-core-manifest.py dist/release-image/image-manifest.tsv
      cp dist/release-image/image-manifest.tsv release/image-manifest.tsv
      # Stable glab release create expands release/*; never pass build/core
      # directories as Release assets or upload them by mistake.
      rm -rf release/core release/backup-cli release/synology
      sh scripts/ci/gitlab-publish-release.sh
  artifacts:
    name: "xdrive-release-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/

