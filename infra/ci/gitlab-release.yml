.publish-only:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
    - when: never

.release-linux-docker:
  image: $XDRIVE_CI_GO_IMAGE
  tags:
    - linux
  cache:
    key: "xdrive-ci-tools-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/ci-tools/
    policy: pull-push
    when: always
  before_script:
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl
      rm -rf /var/lib/apt/lists/*
    - bash scripts/ci/install-docker-cli.sh
    - docker info >/dev/null

release-assets:
  # The image/asset publisher must finish once its master pipeline starts.
  interruptible: false
  extends: .publish-only
  image: $XDRIVE_CI_GO_IMAGE
  tags:
    - linux
  stage: release-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      needs:
        - job: build-source-agent
          artifacts: true
        - job: final-gate
          artifacts: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      when: on_success
      needs:
        - job: build-source-agent
          artifacts: true
    - when: never
  script:
    - bash scripts/ci/gitlab-release-assets.sh
  artifacts:
    name: "xdrive-release-assets-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xdrive-source-agent-linux-amd64
      - release/xdrive-source-agent-linux-arm64
      - release/xdrive-server-install.sh
      - release/server-backup.sh
      - release/server-backup-scheduled.sh
      - release/server-restore.sh
      - release/server-verify.sh
      - release/server-doctor.sh
      - release/server-migrate-user.sh
      - release/xdrive-server
      - release/docker-compose.yml
      - release/xdrive.env.example

publish-server-images:
  # The image/asset publisher must finish once its master pipeline starts.
  interruptible: false
  extends:
    - .publish-only
    - .release-linux-docker
  stage: release-build
  resource_group: xdrive-gitlab-server-images
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
      needs:
        - job: final-gate
          artifacts: false
        - job: server-image
          artifacts: true
        - job: caddy-image
          artifacts: true
        - job: photo-face-image
          artifacts: true
        - job: media-worker-image
          artifacts: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      when: on_success
      needs:
        - job: server-image
          artifacts: true
        - job: caddy-image
          artifacts: true
        - job: photo-face-image
          artifacts: true
        - job: media-worker-image
          artifacts: true
    - when: never
  script:
    - bash scripts/ci/gitlab-server-images.sh

promote-server-images:
  # The image/asset publisher must finish once its master pipeline starts.
  interruptible: false
  extends:
    - .publish-only
    - .release-linux-docker
  stage: promote
  resource_group: xdrive-gitlab-server-images
  needs:
    - job: release-assets
      artifacts: false
    - job: publish-server-images
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      when: on_success
    - when: never
  script:
    - bash scripts/ci/gitlab-promote-images.sh

publish-release:
  extends: .publish-only
  # A newer master pipeline cannot kill or interleave an in-flight link promotion.
  interruptible: false
  resource_group: xdrive-gitlab-release-publish
  image: $XDRIVE_CI_GLAB_IMAGE
  stage: release
  tags:
    - linux
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  # A Snapshot with complete artifacts may publish even if unrelated tests fail.
  # A missing image/client artifact must still fail closed.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      when: on_success
    - when: never
  needs:
    - job: build-client-core
      artifacts: true
    - job: package-linux-client
      artifacts: true
    - job: package-windows-client
      artifacts: true
    - job: release-assets
      artifacts: true
    - job: promote-server-images
      artifacts: false
  script:
    - |
      set -eu
      # Preserve the exact binary archives already verified and built by CI.
      cp release/backup-cli/xdrive-backup-linux-amd64.tar.gz release/
      cp release/backup-cli/xdrive-backup-windows-amd64.zip release/
      # Stable glab release create expands release/*; never pass build/core
      # directories as Release assets or upload them by mistake.
      rm -rf release/core release/backup-cli
      sh scripts/ci/gitlab-publish-release.sh
  artifacts:
    name: "xdrive-release-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/

# Diagnostic smoke runs after master publication. The official GitHub CI gates
# snapshot correctness; local GitLab infrastructure failures stay visible.
master-release-image-smoke:
  extends: .release-linux-docker
  stage: post-release-test
  needs:
    - job: publish-release
      artifacts: false
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      allow_failure: true
    - when: never
  script:
    - bash scripts/ci/gitlab-post-release-smoke.sh

master-release-web-lint:
  image: $XDRIVE_CI_NODE_IMAGE
  stage: post-release-test
  tags:
    - linux
  needs:
    - job: publish-release
      artifacts: false
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_REGISTRY_IMAGE'
      allow_failure: true
    - when: never
  script:
    - cd web && npm ci --no-audit --no-fund && npm run lint
