.publish-only:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.+/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - when: never

.release-linux-go-node:
  image: $XDRIVE_CI_GO_IMAGE
  tags:
    - linux
  variables:
    XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  cache:
    key: "xdrive-release-electron-linux-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/electron/
      - .cache/electron-builder/
    policy: pull-push
  before_script:
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl xz-utils
      rm -rf /var/lib/apt/lists/*
      case "$(uname -m)" in
        x86_64) node_arch="x64" ;;
        *) echo "unsupported GitLab Linux release architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      tmp="$(mktemp -d)"
      node_file="node-v${XDRIVE_CI_NODE_VERSION}-linux-${node_arch}.tar.xz"
      curl -fsSL "https://nodejs.org/dist/v${XDRIVE_CI_NODE_VERSION}/${node_file}" -o "$tmp/$node_file"
      curl -fsSL "https://nodejs.org/dist/v${XDRIVE_CI_NODE_VERSION}/SHASUMS256.txt" -o "$tmp/SHASUMS256.txt"
      (cd "$tmp" && grep " ${node_file}$" SHASUMS256.txt | sha256sum -c -)
      tar -xJf "$tmp/$node_file" -C /usr/local --strip-components=1
      rm -rf "$tmp"
      test "$(node -p 'process.versions.node')" = "$XDRIVE_CI_NODE_VERSION"

.release-linux-docker:
  image: $XDRIVE_CI_GO_IMAGE
  tags:
    - linux
  before_script:
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl
      rm -rf /var/lib/apt/lists/*
      case "$(uname -m)" in
        x86_64) docker_arch="x86_64"; compose_arch="x86_64" ;;
        *) echo "unsupported GitLab Linux release architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      tmp="$(mktemp -d)"
      curl -fsSL "https://download.docker.com/linux/static/stable/${docker_arch}/docker-${XDRIVE_CI_DOCKER_VERSION}.tgz" -o "$tmp/docker.tgz"
      tar -xzf "$tmp/docker.tgz" -C "$tmp"
      install -m 0755 "$tmp/docker/docker" /usr/local/bin/docker
      install -d /usr/local/lib/docker/cli-plugins
      curl -fsSL "https://github.com/docker/compose/releases/download/${XDRIVE_CI_COMPOSE_VERSION}/docker-compose-linux-${compose_arch}" -o /usr/local/lib/docker/cli-plugins/docker-compose
      chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
      rm -rf "$tmp"
      docker --version
      docker compose version
      docker info >/dev/null

package-linux-amd64:
  extends:
    - .publish-only
    - .release-linux-go-node
  stage: package
  script:
    - bash scripts/ci/gitlab-package-linux.sh
  artifacts:
    name: "xdrive-linux-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xdrive-client-linux-amd64.deb
      - release/xdrive-desktop-linux-amd64.deb
      - release/xdrive-server-install.sh
      - release/server-backup.sh
      - release/server-backup-scheduled.sh
      - release/server-restore.sh
      - release/server-verify.sh
      - release/server-doctor.sh
      - release/xdrive-server
      - release/docker-compose.yml
      - release/Caddyfile
      - release/xdrive.env.example

package-windows-amd64:
  extends: .publish-only
  stage: package
  resource_group: xdrive-package-windows
  tags:
    - windows
  script:
    - bash scripts/ci/gitlab-package-windows.sh
  artifacts:
    name: "xdrive-windows-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/xDriveSetup-amd64.exe
      - release/xDriveDesktopSetup-amd64.exe

package-server-images:
  extends:
    - .publish-only
    - .release-linux-docker
  stage: package
  resource_group: xdrive-gitlab-server-images
  script:
    - bash scripts/ci/gitlab-server-images.sh

promote-server-images:
  extends:
    - .publish-only
    - .release-linux-docker
  stage: promote
  resource_group: xdrive-gitlab-server-images
  needs:
    - job: package-linux-amd64
      artifacts: false
    - job: package-windows-amd64
      artifacts: false
    - job: package-server-images
      artifacts: false
  script:
    - bash scripts/ci/gitlab-promote-images.sh

publish-release:
  extends: .publish-only
  image: $XDRIVE_CI_GLAB_IMAGE
  stage: release
  tags:
    - linux
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: package-linux-amd64
      artifacts: true
    - job: package-windows-amd64
      artifacts: true
    - job: promote-server-images
      artifacts: false
  script:
    - sh scripts/ci/gitlab-publish-release.sh
  artifacts:
    name: "xdrive-release-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: on_success
    paths:
      - release/
