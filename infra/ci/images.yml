variables:
  # Linux GitLab jobs run inside these images; runner tags only select the host.
  XDRIVE_CI_GO_IMAGE: "golang:1.25-bookworm"
  XDRIVE_CI_NODE_IMAGE: "node:22-bookworm"
  XDRIVE_CI_GLAB_IMAGE: "registry.gitlab.com/gitlab-org/cli:latest"

  # go-linux needs Node for the unified Electron package and Docker CLI/Compose
  # for deployment/container regression tests. Keep these pinned and install
  # them inside the job image instead of relying on the runner host.
  XDRIVE_CI_NODE_VERSION: "22.23.3"
  XDRIVE_CI_DOCKER_VERSION: "27.5.1"
  XDRIVE_CI_COMPOSE_VERSION: "v2.32.4"

  # GitLab runners can be bandwidth-constrained when fetching GitHub release
  # assets. These can be overridden by project/group CI/CD variables when an
  # internal mirror is available.
  ELECTRON_MIRROR: "https://cdn.npmmirror.com/binaries/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://cdn.npmmirror.com/binaries/electron-builder-binaries/"
