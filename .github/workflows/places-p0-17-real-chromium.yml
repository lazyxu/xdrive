name: Places P0-17 Chromium Child Isolation and Dual Host Parity

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/places-p0-17-real-chromium.yml'
      - 'deploy/baidu-isolated-child/**'
      - 'desktop/scripts/baidu-isolated-child-chromium.cjs'
      - 'desktop/scripts/gallery-places-dual-host-chromium.*'
      - 'internal/api/baidu_map_scope_browser_gin_fixture_linux_test.go'
      - 'ui/shared/src/mui/MediaGalleryBaiduIsolatedPhotoSurface.tsx'
      - 'ui/shared/src/media-gallery-baidu-inline-map-host.ts'
      - 'desktop/src/main/baidu_map_*.cts'
      - 'desktop/src/main/index.cts'
      - 'desktop/src/preload/baidu_map_secure.cts'
      - 'ui/shared/src/media-gallery-baidu-isolated-*.ts'
  push:
    branches: [master]
    paths:
      - '.github/workflows/places-p0-17-real-chromium.yml'
      - 'deploy/baidu-isolated-child/**'
      - 'desktop/scripts/baidu-isolated-child-chromium.cjs'
      - 'desktop/scripts/gallery-places-dual-host-chromium.*'
      - 'internal/api/baidu_map_scope_browser_gin_fixture_linux_test.go'
      - 'ui/shared/src/mui/MediaGalleryBaiduIsolatedPhotoSurface.tsx'
      - 'ui/shared/src/media-gallery-baidu-inline-map-host.ts'
      - 'desktop/src/main/baidu_map_*.cts'
      - 'desktop/src/main/index.cts'
      - 'desktop/src/preload/baidu_map_secure.cts'
      - 'ui/shared/src/media-gallery-baidu-isolated-*.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: places-p0-17-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  malicious-sdk-controlled-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source checkout, browser, and local certificate fixture tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --version
          command -v openssl
          if command -v google-chrome-stable >/dev/null 2>&1; then
            echo "XDRIVE_MAP_CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "XDRIVE_MAP_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            command -v chromium
            echo "XDRIVE_MAP_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          fi
          node --check desktop/scripts/baidu-isolated-child-chromium.cjs
      - name: Real controlled HTTPS Chromium hostile SDK / CSP / origin / Cookie isolation
        shell: bash
        run: |
          set -euo pipefail
          # Uses synthetic gallery.example.net and map-isolated.example.org
          # looped to 127.0.0.1 with a temporary test-only self-signed CA.
          # The script itself asserts no private Parent data or navigation
          # crosses origins. It never accesses the real Provider or user media.
          XDRIVE_BROWSER_EXECUTABLE="$XDRIVE_MAP_CHROME" \
            node desktop/scripts/baidu-isolated-child-chromium.cjs

  mounted-shared-gallery-dual-host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual shared Gallery and native browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix desktop install --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/xdrive-places-dual-chromium"
          npm install --prefix "$RUNNER_TEMP/xdrive-places-dual-chromium" \
            --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          if command -v google-chrome-stable >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          fi
          echo "XDRIVE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/xdrive-places-dual-chromium/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: Actual mounted Gallery Parent in inline and independent HTTPS Child
        shell: bash
        env:
          XDRIVE_PLACES_DUAL_HOST_RESULT_DIR: ${{ github.workspace }}/desktop/places-dual-host-results
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --check desktop/scripts/gallery-places-dual-host-chromium.cjs
          export XD_PR_HEAD="$(git rev-parse HEAD)"
          node desktop/scripts/gallery-places-dual-host-chromium.cjs
          node -e "const s=require('./desktop/places-dual-host-results/summary.json');if(!s.passed||s.checks.length<18||s.checks.some(c=>!c.passed)||!s.realChromium||!s.realReactParent||s.realGin||s.realBaiduProvider)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: places-dual-sdk-host-chromium-summary
          path: desktop/places-dual-host-results/summary.json
          if-no-files-found: warn
          retention-days: 14


  mounted-dual-host-authenticated-real-gin:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile existing real Gin Router test and mounted Chromium driver
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          npm --prefix desktop install --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/places-p04-gin-driver"
          npm install --prefix "$RUNNER_TEMP/places-p04-gin-driver" \
            --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          go test -c -o "$RUNNER_TEMP/places-p04-real-gin.test" ./internal/api
          echo "XD_PLACES_P04_GO_BINARY=$RUNNER_TEMP/places-p04-real-gin.test" >> "$GITHUB_ENV"
          echo "XDRIVE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/places-p04-gin-driver/node_modules/playwright-core" >> "$GITHUB_ENV"
          if command -v google-chrome-stable >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          fi
      - name: Chromium Gallery SDK Hosts call actual Gin Owner issue/redeem and PostgreSQL
        shell: bash
        env:
          XDRIVE_PLACES_DUAL_HOST_RESULT_DIR: ${{ github.workspace }}/desktop/places-p04-real-gin-chromium-results
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --check desktop/scripts/gallery-places-dual-host-chromium.cjs
          export XD_PR_HEAD="$(git rev-parse HEAD)"
          node desktop/scripts/gallery-places-dual-host-chromium.cjs
          node -e "const s=require('./desktop/places-p04-real-gin-chromium-results/summary.json');if(!s.passed||!s.realGin||s.realBaiduProvider||!s.realReactParent||s.checks.length<36||s.checks.some(c=>!c.passed)||s.errors.length)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: places-p04-real-gin-browser-sanitized
          # The private Go readiness file, JWTs, browser profile, and DB
          # credentials must NEVER be archived.
          path: desktop/places-p04-real-gin-chromium-results/summary.json
          if-no-files-found: warn
          retention-days: 14
