name: Prune verified integrated branches

# Trusted default-branch code only. Never execute a PR's checkout or script.
# Daily/manual sweep only: merged PR events use the separate guarded cleanup workflow.
# Avoid creating a redundant queued scan on every master push.
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report safe candidates without deleting'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: xdrive-verified-branch-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Delete only merged or verified superseded branch tips
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const repository = owner + '/' + repo;
            const defaultBranch = 'master';
            const dryRun = context.eventName === 'workflow_dispatch' &&
              String(context.payload.inputs?.dry_run) === 'true';

            // Open PR head/base and exact-tip evidence guard all remaining work.
            // #2524 is closed after a semantic audit; its immutable source tip
            // may be retired only by the explicitly reviewed entry below.
            // Retain these development integration heads. Their ancestors are
            // reviewed for cleanup below, but neither head is merged to master.
            const preserved = new Set([
              'fix/files-owner-read-admission-consolidated-20261030',
              'refactor/files-shared-location-ancestors-20261030',
            ]);

            // Closed unmerged source PR -> accepted consolidated PR.
            // Only retire the source when the target is actually merged to master
            // AND the current branch tip is still the source PR's exact head.
            const supersededBy = new Map([
              // Verified integrated exact source tips: DSM #3313, native MapKit #3334.
              [3286, 3313], [3305, 3313], [3336, 3334],
              [2670, 2667], [2677, 2667],
              [2669, 2682], [2679, 2682],
              [2697, 2705], [2699, 2705], [2702, 2705],
              [2707, 2661], [2711, 2661],
              [2714, 2709], [2726, 2709],
              [2692, 2728], [2696, 2728],
              [2722, 2721],
              [2729, 2721], [2730, 2721], [2731, 2721],
              [3330, 3331], // iOS native direct-entry duplicate superseded by merged WebKit retirement
              [3382, 3384], // closed mobile-only login draft source subsumed in cross-host PR
            ]);

            // Deliberately retired historical heads: all values are immutable
            // source tips and independently reviewed accepted-master evidence.
            // No branch-name-only or closed-PR-only deletion is permitted.
            const exactRetirements = new Map([
              // Four SHA-pinned source commits wholly retained in two active dev heads.
              ['fix/files-owner-root-quota-admission-20261030@284b086560a9b489aff6d34cf013d08a5dea0876', {
                retainedDevBranch: 'fix/files-owner-read-admission-consolidated-20261030',
                retainedDevSha: '0ed94690a3e9eaea0aa415ef92c0c1deef3dee5a',
                why: 'source SHA retained by exact development integration head; not master acceptance',
              }],
              ['fix/files-owner-search-sources-admission-20261030@940128fd536d6b2869bde56c88a8f373bb306e76', {
                retainedDevBranch: 'fix/files-owner-read-admission-consolidated-20261030',
                retainedDevSha: '0ed94690a3e9eaea0aa415ef92c0c1deef3dee5a',
                why: 'source SHA retained by exact development integration head; not master acceptance',
              }],
              ['fix/files-exact-reanchor-row-identity-20261030@e8d073cc184f84398cd4599d3e0b7e584d1702f8', {
                retainedDevBranch: 'refactor/files-shared-location-ancestors-20261030',
                retainedDevSha: '81448e43567d9949e14fdb7d514b8f411a3d9571',
                why: 'source SHA retained by exact development integration head; not master acceptance',
              }],
              ['refactor/files-shared-reveal-lifecycle-20261030@e33567770ff7c517f8f1cb707a4b72f016b0948a', {
                retainedDevBranch: 'refactor/files-shared-location-ancestors-20261030',
                retainedDevSha: '81448e43567d9949e14fdb7d514b8f411a3d9571',
                why: 'source SHA retained by exact development integration head; not master acceptance',
              }],
              // Source tips with proven commit ancestry to already-merged consolidation PRs.
              ['fix/files-cursor-cycle-guard-20261030@0acf1e8df5a815a5b7001e17766c1d3f22fe120d', {
                mergedPullAncestor: 3230,
                mergedPullHeadSha: '14e3292057c3bc21f8a31e5b1d0173bdf1a0014a',
                why: 'exact source tip is an ancestor of merged master PR #3230 head',
              }],
              ['fix/files-readonly-abort-boundary-20261030@4a2fc96ed6a698cd7e47355e1f86ecd5cff0f02d', {
                mergedPullAncestor: 3230,
                mergedPullHeadSha: '14e3292057c3bc21f8a31e5b1d0173bdf1a0014a',
                why: 'exact source tip is an ancestor of merged master PR #3230 head',
              }],
              ['fix/shared-virtual-range-window-integrity-20261030@9071552f4cf88817e2d517a8f9c83248a164546c', {
                mergedPullAncestor: 3240,
                mergedPullHeadSha: '257b1b47aed27a87040fbac2e18b9ae0954e9de2',
                why: 'exact source tip is an ancestor of merged master PR #3240 head',
              }],
              ['fix/shared-virtual-snapshot-admission-20261030@a3f4fed6cf972f731eecfe29a82581d72112bd4f', {
                mergedPullAncestor: 3240,
                mergedPullHeadSha: '257b1b47aed27a87040fbac2e18b9ae0954e9de2',
                why: 'exact source tip is an ancestor of merged master PR #3240 head',
              }],
              ['fix/files-preview-canonical-read-id-20261030@6ba93902c6ad9b90965567626f4050cd13f52eec', {
                mergedPullAncestor: 3246,
                mergedPullHeadSha: '7496e170f72411f79b05c2a9043142dbbd89d118',
                why: 'exact source tip is an ancestor of merged master PR #3246 head',
              }],
              // Identical alternate refs of current Android PR heads. Wait for
              // exact PR head merge, then retire aliases without touching PR refs.
              ['fix/android-local-viewer-touch-focus-20261031@af37b139d2a6efc133c854081ec930d3ea7bb46f', {
                mergedPullAncestor: 3391,
                mergedPullHeadSha: 'af37b139d2a6efc133c854081ec930d3ea7bb46f',
                why: 'duplicate branch tip identical to merged Android local Viewer PR #3391',
              }],
              ['fix/android-cloud-viewer-touch-focus-20261031@869abc93b248eb45b8c3e13e80049a05d20fcea6', {
                mergedPullAncestor: 3392,
                mergedPullHeadSha: '869abc93b248eb45b8c3e13e80049a05d20fcea6',
                why: 'duplicate branch tip identical to merged Android cloud Viewer PR #3392',
              }],
              ['feat/sync-run-outcome-telemetry-p0-p2-20261016@d2d9e87c7f1597ab0412c101806218a9c1acf17d', {
                closedIssue: 2524,
                requiredMergedPulls: [2800],
                why: 'closed #2524 audit: v1 retains verified CAS/resume totals and Owner detail; permanent category histogram and obsolete old part accounting explicitly rejected',
              }],
              ['fix/ci-storage-verify-summary-gofmt-20261025@1410eadf89875aa234a9468fa05e3e0a2b37ce8a', {
                closedPull: 2701,
                acceptedAncestor: '9f8d03431eb4f63d9d1c676d53b7db07ae9c6a12',
                why: 'closed duplicate; master has stronger directory metadata test and gofmt',
              }],
              ['fix/storage-verify-summary-gofmt-20261026@74249e40eddab1eddb202dfd6b3985430661dd47', {
                closedPull: 2703,
                acceptedAncestor: '9f8d03431eb4f63d9d1c676d53b7db07ae9c6a12',
                why: 'closed formatting duplicate already present on master',
              }],
              ['feat/caddy-collector-preflight-systemd-sandbox-20261024@93c466a29de49e965ecc78e607ce5a2dec071503', {
                closedPull: 2545,
                closedIssue: 2075,
                decisionComment: 6385024974,
                why: 'user-scoped Caddy MVP explicitly retired unused Collector systemd sandbox',
              }],
              ['fix/places-ios27-shared-photo-map-pin-badge-20261026@48c0887371343704b76d9a47ead6bb6697fe4aaf', {
                requiredMergedPulls: [2661],
                why: 'closed #2711 superseded by accepted #2661; matching production badge and map UI regression on master',
              }],
              ['codex/server-cpu-backup-diagnostic-2723@235f505fcb559cf371919f9335a417d6c72041ad', {
                requiredMergedPulls: [2721, 2723],
                why: 'temporary red CI reproduction superseded by merged verifier and CPU fixes',
              }],
            ]);

            const [branches, openPulls] = await Promise.all([
              github.paginate(github.rest.repos.listBranches,
                {owner, repo, per_page: 100}),
              github.paginate(github.rest.pulls.list,
                {owner, repo, state: 'open', per_page: 100}),
            ]);
            // An open stacked PR may rely on another branch as its BASE.
            // Protect both sides of every still-open same-repository PR.
            const inOpenPR = new Set();
            for (const pr of openPulls) {
              if (pr.head?.repo?.full_name === repository) {
                inOpenPR.add(pr.head.ref);
              }
              if (pr.base?.repo?.full_name === repository) {
                inOpenPR.add(pr.base.ref);
              }
            }

            // Also recover old merged PR branches the repository did not delete.
            const mergedHeads = new Map();
            for (let page = 1; page <= 4; page++) {
              const {data} = await github.rest.pulls.list({
                owner, repo, state: 'closed', sort: 'updated',
                direction: 'desc', per_page: 100, page,
              });
              for (const pr of data) {
                if (pr.merged_at && pr.base?.ref === defaultBranch &&
                    pr.head?.repo?.full_name === repository) {
                  mergedHeads.set(pr.head.ref + '@' + pr.head.sha, pr.number);
                }
              }
              if (data.length < 100) break;
            }

            const snapshotNumbers = new Set([
              ...supersededBy.keys(), ...supersededBy.values(),
            ]);
            const snapshots = new Map();
            await Promise.all([...snapshotNumbers].map(async number => {
              const {data} = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              snapshots.set(number, data);
            }));
            const supersededTips = new Map();
            for (const [sourceNumber, targetNumber] of supersededBy) {
              const source = snapshots.get(sourceNumber);
              const target = snapshots.get(targetNumber);
              if (source?.state !== 'closed' || source.merged_at ||
                  source.head?.repo?.full_name !== repository ||
                  !target?.merged_at || target.base?.ref !== defaultBranch) {
                continue;
              }
              supersededTips.set(
                source.head.ref + '@' + source.head.sha,
                {sourceNumber, targetNumber},
              );
            }

            const retiredTips = new Map();
            const isAcceptedAncestor = async sha => {
              const {data} = await github.rest.repos.compareCommits({
                owner, repo, base: sha, head: defaultBranch,
              });
              return data.behind_by === 0 &&
                (data.status === 'ahead' || data.status === 'identical');
            };
            for (const [tip, policy] of exactRetirements) {
              const at = tip.lastIndexOf('@');
              const branchName = tip.slice(0, at);
              const expectedSHA = tip.slice(at + 1);
              if (!branchName || !/^[0-9a-f]{40}$/.test(expectedSHA)) continue;
              let accepted = true;
              // Require an exact merged integration PR head containing this source
              // and a reachable master merge commit (not merely matching filenames).
              if (accepted && policy.mergedPullAncestor) {
                const {data: integrated} = await github.rest.pulls.get({
                  owner, repo, pull_number: policy.mergedPullAncestor,
                });
                accepted = Boolean(integrated.merged_at && integrated.merge_commit_sha &&
                  integrated.base?.ref === defaultBranch &&
                  integrated.head?.repo?.full_name === repository &&
                  integrated.head?.sha === policy.mergedPullHeadSha &&
                  await isAcceptedAncestor(integrated.merge_commit_sha));
                if (accepted) {
                  const {data: ancestry} = await github.rest.repos.compareCommits({
                    owner, repo, base: expectedSHA, head: policy.mergedPullHeadSha,
                  });
                  accepted = ancestry.behind_by === 0 &&
                    (ancestry.status === 'ahead' || ancestry.status === 'identical');
                }
              }
              if (accepted && policy.closedPull) {
                const {data: source} = await github.rest.pulls.get({
                  owner, repo, pull_number: policy.closedPull,
                });
                accepted = source.state === 'closed' && !source.merged_at &&
                  source.head?.repo?.full_name === repository &&
                  source.head.ref === branchName &&
                  source.head.sha === expectedSHA &&
                  (!policy.acceptedAncestor ||
                    await isAcceptedAncestor(policy.acceptedAncestor));
              }
              if (accepted && policy.closedIssue) {
                const {data: issue} = await github.rest.issues.get({
                  owner, repo, issue_number: policy.closedIssue,
                });
                accepted = issue.state === 'closed';
              }
              if (accepted && policy.decisionComment) {
                const {data: decision} = await github.rest.issues.getComment({
                  owner, repo, comment_id: policy.decisionComment,
                });
                accepted = decision.body?.includes(
                  '不必要的 Collector systemd 沙盒 Draft 已关闭、未合并'
                ) === true;
              }
              if (accepted && policy.requiredMergedPulls) {
                for (const number of policy.requiredMergedPulls) {
                  const {data: merged} = await github.rest.pulls.get({
                    owner, repo, pull_number: number,
                  });
                  if (!merged.merged_at || !merged.merge_commit_sha ||
                      merged.base?.ref !== defaultBranch ||
                      !(await isAcceptedAncestor(merged.merge_commit_sha))) {
                    accepted = false;
                    break;
                  }
                }
              }
              // Development-only retirement: prove the exact source commit is
              // still an ancestor of an unchanged, retained development branch.
              if (accepted && policy.retainedDevBranch) {
                accepted = policy.retainedDevBranch !== branchName &&
                  /^[0-9a-f]{40}$/.test(policy.retainedDevSha);
                if (accepted) {
                  try {
                    const {data: target} = await github.rest.repos.getBranch({
                      owner, repo, branch: policy.retainedDevBranch,
                    });
                    accepted = target.commit.sha === policy.retainedDevSha;
                    if (accepted) {
                      const {data: cmp} = await github.rest.repos.compareCommits({
                        owner, repo, base: expectedSHA, head: policy.retainedDevSha,
                      });
                      accepted = cmp.behind_by === 0 &&
                        (cmp.status === 'ahead' || cmp.status === 'identical');
                    }
                  } catch (error) {
                    if (error.status !== 404) throw error;
                    accepted = false;
                  }
                }
              }
              if (accepted) retiredTips.set(tip, policy.why);
            }

            let removed = 0;
            let skipped = 0;
            const report = [['Branch', 'Decision', 'Evidence']];
            for (const branch of branches) {
              const name = branch.name;
              if (name === defaultBranch || branch.protected ||
                  preserved.has(name) || inOpenPR.has(name)) {
                skipped++;
                continue;
              }

              const tip = name + '@' + branch.commit.sha;
              let evidence = '';
              if (mergedHeads.has(tip)) {
                evidence = 'Merged PR #' + mergedHeads.get(tip);
              } else if (supersededTips.has(tip)) {
                const {sourceNumber, targetNumber} = supersededTips.get(tip);
                evidence = 'Closed PR #' + sourceNumber +
                  ' superseded by merged PR #' + targetNumber;
              } else if (retiredTips.has(tip)) {
                evidence = 'Audited retired exact tip: ' + retiredTips.get(tip);
              } else {
                // A branch with zero unique commits is fully integrated.
                // Do not delete branch tips with any unmerged commits.
                let comparison;
                try {
                  const response = await github.rest.repos.compareCommits({
                    owner, repo, base: defaultBranch, head: name,
                  });
                  comparison = response.data;
                } catch (error) {
                  // Another trusted master job may delete this exact ref
                  // between listBranches and compareCommits.
                  if (error.status !== 404) throw error;
                  report.push([name, 'GONE: concurrently removed', 'compare returned 404']);
                  skipped++;
                  continue;
                }
                if (comparison.ahead_by === 0) {
                  evidence = 'No commits ahead of master';
                }
              }

              if (!evidence) {
                skipped++;
                continue;
              }
              // Re-read the actual ref immediately before a destructive call.
              let latest;
              try {
                const response = await github.rest.repos.getBranch({
                  owner, repo, branch: name,
                });
                latest = response.data;
              } catch (error) {
                // A concurrently deleted branch is already at the desired
                // result. Other errors (e.g. 403) still abort the run.
                if (error.status !== 404) throw error;
                report.push([name, 'GONE: concurrently removed', 'head check returned 404']);
                skipped++;
                continue;
              }
              if (latest.protected || latest.commit.sha !== branch.commit.sha) {
                report.push([name, 'KEEP: head changed/protected', evidence]);
                skipped++;
                continue;
              }
              // Re-read retained HEAD and ancestry just before deleting this
              // source ref; stale cross-branch evidence never authorizes deletion.
              const devPolicy = exactRetirements.get(tip);
              if (devPolicy?.retainedDevBranch && retiredTips.has(tip)) {
                let retained = false;
                try {
                  const {data: currentTarget} = await github.rest.repos.getBranch({
                    owner, repo, branch: devPolicy.retainedDevBranch,
                  });
                  if (currentTarget.commit.sha === devPolicy.retainedDevSha) {
                    const {data: cmp} = await github.rest.repos.compareCommits({
                      owner, repo, base: branch.commit.sha,
                      head: currentTarget.commit.sha,
                    });
                    retained = cmp.behind_by === 0 &&
                      (cmp.status === 'ahead' || cmp.status === 'identical');
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                if (!retained) {
                  report.push([name, 'KEEP: retained development tip changed or absent',
                    devPolicy.retainedDevBranch]);
                  skipped++;
                  continue;
                }
              }
              // Repeat source-to-merged-PR ancestry checks just before deletion.
              if (devPolicy?.mergedPullAncestor && retiredTips.has(tip)) {
                let verified = false;
                try {
                  const {data: integrated} = await github.rest.pulls.get({
                    owner, repo, pull_number: devPolicy.mergedPullAncestor,
                  });
                  if (integrated.merged_at && integrated.merge_commit_sha &&
                      integrated.base?.ref === defaultBranch &&
                      integrated.head?.repo?.full_name === repository &&
                      integrated.head?.sha === devPolicy.mergedPullHeadSha &&
                      await isAcceptedAncestor(integrated.merge_commit_sha)) {
                    const {data: cmp} = await github.rest.repos.compareCommits({
                      owner, repo, base: branch.commit.sha,
                      head: devPolicy.mergedPullHeadSha,
                    });
                    verified = cmp.behind_by === 0 &&
                      (cmp.status === 'ahead' || cmp.status === 'identical');
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                if (!verified) {
                  report.push([name, 'KEEP: merged consolidation provenance changed',
                    'PR #' + devPolicy.mergedPullAncestor]);
                  skipped++;
                  continue;
                }
              }
              if (removed >= 50) {
                report.push([name, 'KEEP: deletion budget reached', evidence]);
                skipped++;
                continue;
              }
              if (!dryRun) {
                try {
                  await github.rest.git.deleteRef({
                    owner, repo, ref: 'heads/' + name,
                  });
                } catch (error) {
                  if (error.status === 404) {
                    report.push([name, 'GONE: concurrently removed', evidence]);
                  } else {
                    report.push([name, 'KEEP: deletion rejected', String(error.status || error.message)]);
                  }
                  skipped++;
                  continue;
                }
              }
              removed++;
              report.push([name, dryRun ? 'WOULD DELETE' : 'DELETED', evidence]);
            }
            core.info('verified branch prune: deleted=' +
              (dryRun ? 0 : removed) + ', eligible=' + removed +
              ', kept=' + skipped);
            await core.summary
              .addHeading('Verified branch cleanup')
              .addRaw('Exact HEAD and merge evidence required; open PRs, protected branches and preserved work are excluded.')
              .addTable(report)
              .write();
