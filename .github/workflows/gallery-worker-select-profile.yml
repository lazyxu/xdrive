name: Gallery 100k Worker SELECT SQL attribution

on:
  push:
    branches: ["perf/gallery-worker-select-profile-100k"]
  pull_request:
    branches: ["master", "perf/gallery-100k-enqueue-array-unnest"]

permissions:
  contents: read

jobs:
  gallery-worker-select-profile-100k:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/perf/gallery-worker-select-profile-100k') ||
      (github.event_name == 'pull_request' && github.head_ref == 'perf/gallery-worker-select-profile-100k')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size=256m
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_GALLERY_SELECTION_JOB_PERF: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Check test-only profiling source formatting and worker stage unit test
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/api/gallery_selection_worker_sql_detail_test.go internal/api/media_selection_jobs_performance_integration_test.go)"
          go test -mod=readonly -run '^TestGalleryWorkerSelectStage$' -count=1 ./internal/api
      - name: Record three independent real 10k/100k SQL Worker SELECT profiles
        run: |
          set -euo pipefail
          mkdir -p perf-results/gallery-worker-select-n3
          for sample in 1 2 3; do
            /usr/bin/time -f 'maxrss_kib=%M\nuser_cpu_seconds=%U\nsystem_cpu_seconds=%S' \
              -o "perf-results/gallery-worker-select-n3/sample-$sample.time" \
              go test -mod=readonly -run '^TestGallerySelectionJobsReal10k100k$' \
              -timeout=12m -count=1 -v ./internal/api \
              | tee "perf-results/gallery-worker-select-n3/sample-$sample.log"
          done
          python3 scripts/ci/parse-gallery-selection-enqueue-n3.py perf-results/gallery-worker-select-n3
          python3 scripts/ci/parse-gallery-worker-select-n3.py perf-results/gallery-worker-select-n3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-worker-select-sql-100k-profile-n3
          path: perf-results/gallery-worker-select-n3/
          if-no-files-found: warn
          retention-days: 14
