name: Gallery Mobile Web Real 100k Go Cancellation P048
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  gallery-mobile-web-go-cancel-100k:
    if: github.head_ref == 'perf/gallery-mobile-web-go-cancel-100k-p048-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-exact native mobile benchmark contract
        run: |
          set -euo pipefail
          node --check desktop/scripts/gallery-mobile-web-go-cancel-100k-main.cjs
          node --test desktop/tests/gallery-mobile-web-go-cancel-100k-source.cjs
      - name: Install real Chromium and build production shared Web Gallery
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          (cd web && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
          VITE_XDRIVE_GALLERY_REAL_COLD_PERF=1 npm --prefix web run build -- --config vite.config.ts
      - name: P048 real native 390px Gallery 100k Go Context.Done n3
        run: |
          set -euo pipefail
          mkdir -p desktop/gallery-mobile-web-go-cancel-100k-results
          printf 'HEAD=%s\nRUN=%s\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > desktop/gallery-mobile-web-go-cancel-100k-results/source.txt
          mkdir -p desktop/gallery-mobile-web-go-cancel-100k-api
          go test -c -o desktop/gallery-mobile-web-go-cancel-100k-api/api.test ./internal/api
          export XD_GALLERY_MOBILE_NATIVE_GO_BINARY="$GITHUB_WORKSPACE/desktop/gallery-mobile-web-go-cancel-100k-api/api.test"
          test -x "$XD_GALLERY_MOBILE_NATIVE_GO_BINARY"
          xvfb-run -a --server-args="-screen 0 1920x1200x24" ./desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/gallery-mobile-web-go-cancel-100k-main.cjs
          for i in 1 2 3; do
            test -f "desktop/gallery-mobile-web-go-cancel-100k-results/sample-$i.json"
          done
          node -e "const s=require('./desktop/gallery-mobile-web-go-cancel-100k-results/summary.json');if(!s.passed||!s.mobileCancelMode||s.cssWindowWidth!==390||s.sampleCount!==3||s.worstGoContextMaxMs>160)process.exit(1);console.log(JSON.stringify({passed:s.passed,n:s.sampleCount,worst:s.worstGoContextMaxMs}))"
          cat desktop/gallery-mobile-web-go-cancel-100k-results/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-mobile-web-390px-100k-Go-context-cancel-n3
          path: desktop/gallery-mobile-web-go-cancel-100k-results/
          if-no-files-found: warn
          retention-days: 14
