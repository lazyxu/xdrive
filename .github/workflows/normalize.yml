name: Normalize MVP

on:
  push:
    branches: ["feat/mvp-cfapi"]
    paths:
      - ".github/workflows/normalize.yml"

permissions:
  contents: write

jobs:
  normalize-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Pin Go 1.23 module graph
        shell: bash
        run: |
          sed -i 's/^go 1\.25$/go 1.23.0/' go.mod
          sed -i 's#github.com/rogpeppe/go-internal v1.16.0 // indirect#github.com/rogpeppe/go-internal v1.13.1 // indirect#' go.mod
          rm -rf .bootstrap

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tidy Go modules
        run: go mod tidy -compat=1.23
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          test -z "$files" || (echo "$files" && exit 1)
      - name: Test Go
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Build Linux
        run: go build ./cmd/server ./cmd/xd
      - name: Compile Windows CfAPI
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 go test -c -o /tmp/xdrive-mount.test.exe ./internal/mount
          GOOS=windows GOARCH=amd64 go build -o /tmp/xd.exe ./cmd/xd
      - name: Build web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Commit normalized source
        shell: bash
        run: |
          git rm .github/workflows/normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize Go 1.23 module graph"
          git push origin HEAD:feat/mvp-cfapi
