name: Places native-linked browser Owner Cells revoke PostgreSQL

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/places-native-linked-cells-revoke.yml'
      - 'internal/api/desktop_map_native_linked_cells_revocation_linux_test.go'
      - 'internal/api/baidu_jsapi_map_access.go'
      - 'internal/auth/map_access*.go'
      - 'internal/api/auth_desktop_map_*.go'
      - 'internal/api/baidu_photo_map_*.go'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-linked-cells-revocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Exact HEAD, Go formatting and real PostgreSQL protected Owner range tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          files=(internal/auth/map_access.go internal/auth/map_access_test.go internal/api/baidu_jsapi_map_access.go internal/api/desktop_map_native_linked_cells_revocation_linux_test.go)
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go sources:\n%s\n' "$unformatted"
            while IFS= read -r file; do
              test -n "$file" && gofmt -d "$file"
            done <<< "$unformatted"
            exit 1
          fi
          go test ./internal/auth -run '^TestMapAccessStrictSignedIssuedAt$' -count=1
          go test ./internal/api -run '^TestDesktopMapNativeLinkedOwnerCellsRevokedWithAgentLogout$' -count=1 -timeout=12m
