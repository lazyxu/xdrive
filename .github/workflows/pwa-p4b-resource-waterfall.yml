name: PWA P4B Native Owner 100k Resource Timing Stage Attribution
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  pwa-p4b-resource-waterfall:
    if: github.head_ref == 'test/pwa-p4b-resource-waterfall-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_GALLERY_WEB_PHYSICAL_GO_BINARY: ${{ github.workspace }}/desktop/gallery-physical-web-go/api.test
      XD_PWA_P4A_BEFORE: '1'
      XD_PWA_P4B_RESOURCE_WATERFALL: '1'
      XD_PWA_P4A_RESULTS: ${{ github.workspace }}/desktop/pwa-p4a-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Native Chrome, exact-source P2-A2 and P1/P2-A negative source contracts
        run: |
          set -euo pipefail
          export XD_PR_HEAD="$(git rev-parse HEAD)"
          test "$XD_PR_HEAD" = "${{ github.event.pull_request.head.sha }}"
          node --check desktop/scripts/pwa-p4a-100k-phase-attribution.cjs
          node --check desktop/scripts/pwa-p4b-resource-waterfall.cjs
          node --test desktop/tests/pwa-p4b-resource-waterfall.cjs
          node --test desktop/tests/pwa-p4a-phase-attribution-contract.cjs desktop/tests/pwa-p2a-before-contract.cjs
          npm --prefix web ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/xdrive-p2a2-playwright"
          npm install --prefix "$RUNNER_TEMP/xdrive-p2a2-playwright" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          echo "XDRIVE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/xdrive-p2a2-playwright/node_modules/playwright-core" >> "$GITHUB_ENV"
          if command -v google-chrome-stable >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "real Chrome/Chromium binary required" >&2
            exit 1
          fi
      - name: Build production Vite Gallery and genuine Gin PostgreSQL17 LocalCAS fixture
        run: |
          set -euo pipefail
          VITE_XDRIVE_GALLERY_REAL_COLD_PERF=1 npm --prefix web run build
          mkdir -p desktop/gallery-physical-web-go
          go test -c -o desktop/gallery-physical-web-go/api.test ./internal/api
      - name: Three independent physical 100k/115k Go/CAS fixtures, Chrome process A/B, CDP phase attribution
        run: |
          set -euo pipefail
          export XD_PR_HEAD="$(git rev-parse HEAD)"
          test "$XD_PR_HEAD" = "${{ github.event.pull_request.head.sha }}"
          mkdir -p "$XD_PWA_P4A_RESULTS"
          printf 'SHA=%s\nRUN=%s\nBROWSER=%s\n' "$XD_PR_HEAD" "$GITHUB_RUN_ID" "$XDRIVE_BROWSER_EXECUTABLE" > "$XD_PWA_P4A_RESULTS/source.txt"
          node desktop/scripts/pwa-p4a-100k-phase-attribution.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict')
          const x=require(process.env.XD_PWA_P4A_RESULTS+'/summary.json')
          assert(x.accepted&&x.sha===process.env.XD_PR_HEAD&&x.n===3&&x.pairs===9)
          assert(x.resourceWaterfallMeasurement?.schema==='xdrive-pwa-p4b-resource-waterfall-v1')
          assert.equal(x.resourceWaterfallMeasurement.deepViewportCount,12)
          for(const s of x.samples) {
            assert(s.profilePersisted&&s.pidA!==s.pidB&&s.pairs.length===3)
            for(const p of s.pairs.filter(p=>p.fraction>0)){
              for(const t of [p.firstPhases.resourceWaterfall,p.restartPhases.resourceWaterfall]){
                assert(t&&t.apiRequestsStarted>=1&&t.apiResponsesCompletedBeforeVisible>=1)
                assert(t.scrollToFirstObservedApiStartMs>=0)
                assert(t.scrollToLastObservedApiStartMs>=t.scrollToFirstObservedApiStartMs)
                assert(t.observedApiInitiationSpreadMs>=0)
                assert(t.browserTtfbP95Ms>=0&&t.browserTtfbMaxMs>=t.browserTtfbP95Ms)
                assert(t.categoryTail.thumbnail.requests>=1)
                assert(t.categoryTail['media-range'].requests>=1)
                assert(t.categoryTail.thumbnail.scrollToLastStartMs>=0)
                assert(t.categoryTail['media-range'].scrollToLastStartMs>=0)
                assert(t.afterLastObservedApiToVisibleMs>=0)
                assert.deepEqual(Object.keys(t.categoryCounts).sort(),
                  ['api-other','media-range','thumbnail'])
              }
            }
          }
          assert.equal(x.after,null)
          assert.equal(x.optimizationImplemented,false)
          assert.equal(x.privatePersistentCache,false)
          console.log('PWA_P4B_ANONYMOUS_RESOURCE_PHASES '+JSON.stringify({
            sha:x.sha,views:x.resourceWaterfallMeasurement.deepViewportCount,
            firstRequestP50Ms:x.resourceWaterfallMeasurement.firstRequestFromScrollP50Ms,
            browserTtfbP50Ms:x.resourceWaterfallMeasurement.browserApiTtfbP50Ms,
            browserTransferP50Ms:x.resourceWaterfallMeasurement.browserApiTransferP50Ms,
            afterApiToVisibleP50Ms:x.resourceWaterfallMeasurement.postObservedApiToVisibleP50Ms,
            latestApiStartP50Ms:x.resourceWaterfallMeasurement.latestApiStartP50Ms,
            latestNetworkDispatchP50Ms:x.resourceWaterfallMeasurement.latestNetworkDispatchP50Ms,
            viewportTtfbP95MedianMs:x.resourceWaterfallMeasurement.medianViewportTtfbP95Ms,
            viewportTtfbMaxMedianMs:x.resourceWaterfallMeasurement.medianViewportTtfbMaxMs,
            latestThumbnailStartP50Ms:x.resourceWaterfallMeasurement.latestThumbnailStartP50Ms,
            latestMediaRangeStartP50Ms:x.resourceWaterfallMeasurement.latestMediaRangeStartP50Ms,
            optimizationImplemented:false,physicalIOS:false
          }))
          NODE
          test "$(find "$XD_PWA_P4A_RESULTS" -maxdepth 1 -name 'sample-*.json' | wc -l)" -eq 3
          node -e "const x=require(process.env.XD_PWA_P4A_RESULTS+'/summary.json');if(!x.accepted||x.sha!==process.env.XD_PR_HEAD||!x.nativeChromium||x.physicalIOS||x.privatePersistentCache||x.optimizationImplemented||x.n!==3||x.pairs!==9||x.after!==null||!x.phaseAttribution||!x.privateCacheUnchanged||!x.samples.every(s=>s.profilePersisted&&s.pidA!==s.pidB&&s.pairs.length===3&&s.pairs.every(p=>p.ids.length===4&&p.restartPhases.cpu.TaskDuration>=0&&Number.isFinite(p.restartPhases.lateDecodeAwaitMs)&&Number.isFinite(p.restartPhases.postDecodeTwoRafMs))))process.exit(1);console.log(JSON.stringify({sha:x.sha,firstP50:x.firstP50,restartP50:x.restartedP50,firstRequests:x.firstRequests,restartRequests:x.restartRequests,firstBodyBytes:x.firstBodyBytes,restartBodyBytes:x.restartBodyBytes}))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-p4b-real-100k-resource-waterfall-before-n3
          path: |
            desktop/pwa-p4a-results/summary.json
            desktop/pwa-p4a-results/sample-*.json
            desktop/pwa-p4a-results/source.txt
          if-no-files-found: warn
          retention-days: 14
