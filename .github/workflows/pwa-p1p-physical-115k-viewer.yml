name: PWA P1P Real Owner 115k Physical CAS JPEG H264 Live Viewer
on:
  pull_request:
    branches: [master]
    paths:
      - 'desktop/scripts/gallery-mobile-web-go-cancel-100k-main.cjs'
      - 'internal/api/gallery_real_web_cold_performance_integration_test.go'
      - 'desktop/tests/pwa-p1p-physical-115k-viewer-source.cjs'
      - '.github/workflows/pwa-p1p-physical-115k-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-p1p-physical-115k-viewer:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/pwa-p1p-physical-115k-viewer-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_PWA_P0C2_SPA_BEFORE: '1'
      XD_PWA_P1_100K_VIEWER_BACK: '1'
      XD_PWA_P1_H264_VIEWER_FRAME: '1'
      XD_PWA_P1_LIVE_MOTION_HOLD: '1'
      XD_PWA_P1_PHYSICAL_115K_VIEWER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check opt-in source-only fixture and original shared Viewer contracts
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/api/gallery_real_web_cold_performance_integration_test.go)"
          node --check desktop/scripts/gallery-mobile-web-go-cancel-100k-main.cjs
          node --test desktop/tests/pwa-p1p-physical-115k-viewer-source.cjs desktop/tests/pwa-p1-owner-100k-viewer-back-source.cjs
      - name: Build production Web and real Gin PG17 CAS fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          npm --prefix web ci --no-audit --no-fund
          npm --prefix desktop install --no-audit --no-fund
          VITE_XDRIVE_GALLERY_REAL_COLD_PERF=1 npm --prefix web run build -- --config vite.config.ts
          mkdir -p desktop/pwa-p1p-physical-go
          go test -c -o desktop/pwa-p1p-physical-go/api.test ./internal/api
      - name: Measure three independent authenticated Owner 115k distinct physical CAS Viewer sessions
        run: |
          set -euo pipefail
          export XD_GALLERY_MOBILE_NATIVE_GO_BINARY="$GITHUB_WORKSPACE/desktop/pwa-p1p-physical-go/api.test"
          mkdir -p desktop/pwa-p1p-physical-115k-viewer-results
          printf 'HEAD=%s\nRUN=%s\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > desktop/pwa-p1p-physical-115k-viewer-results/source.txt
          xvfb-run -a --server-args="-screen 0 1920x1200x24" ./desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/gallery-mobile-web-go-cancel-100k-main.cjs
          test "$(find desktop/pwa-p1p-physical-115k-viewer-results -maxdepth 1 -name 'sample-*.json' | wc -l)" -eq 3
          node -e 'const s=require("./desktop/pwa-p1p-physical-115k-viewer-results/summary.json");if(!(s.accepted && s.n===3 && s.physicalOriginals===115000 && s.causalConclusion==="NOT_ESTABLISHED" && s.samples.every(x=>x.passed && x.physicalReadbacks===12 && x.jpeg.returned.scrollDelta<=2 && x.h264.restoredScrollDelta<=2 && x.live.restoredScrollDelta<=2)))process.exit(1);console.log(JSON.stringify({accepted:s.accepted,n:s.n,physicalOriginals:s.physicalOriginals,p50Jpeg:s.p50JpegOriginalMs,p50H264:s.p50H264PresentedMs,p50Live:s.p50LiveHeldMs}))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-p1p-owner-115k-physical-cas-routed-viewer-n3
          path: desktop/pwa-p1p-physical-115k-viewer-results/
          if-no-files-found: warn
          retention-days: 14
