name: FileExplorer 100k Physical MP4 H264 Poster Benchmark

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  file-explorer-physical-h264-100k:
    if: github.head_ref == 'perf/file-explorer-physical-h264-100k-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_FILEEXPLORER_REAL_H264_PHYSICAL_100K_PERF: '1'
      XD_FILEEXPLORER_H264_TEST_BINARY: ${{ github.workspace }}/desktop/real-physical-h264-bin/api.test
      XD_FILEEXPLORER_REAL_H264_RESULTS: ${{ github.workspace }}/desktop/real-physical-h264-100k-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify test-only 100k source shape and script syntax
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/api/file_explorer_real_h264_100k_performance_integration_test.go)"
          node --check desktop/scripts/file-explorer-real-h264-100k-main.cjs
          node --test desktop/tests/file-explorer-physical-h264-100k.cjs
      - name: Build isolated real Chromium and native Go/Gin/CAS fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          (cd desktop && npm install --no-audit --no-fund)
          mkdir -p desktop/real-physical-h264-bin
          go test -c -o desktop/real-physical-h264-bin/api.test ./internal/api
      - name: Measure 3 independent 100k distinct physical MP4 CAS fixtures with real H264 Chromium decoder
        run: |
          set -euo pipefail
          mkdir -p "$XD_FILEEXPLORER_REAL_H264_RESULTS"
          xvfb-run -a --server-args="-screen 0 1920x1200x24" ./desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/file-explorer-real-h264-100k-main.cjs
          test "$(find "$XD_FILEEXPLORER_REAL_H264_RESULTS" -maxdepth 1 -name 'sample-*.json' | wc -l)" -eq 3
          node -e "const s=require(process.env.XD_FILEEXPLORER_REAL_H264_RESULTS+'/summary.json');if (!s.accepted || !s.physicalMode || s.sampleCount!==3) process.exit(1); console.log(JSON.stringify(s,null,2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-explorer-100k-distinct-physical-h264-current-n3
          path: desktop/real-physical-h264-100k-results/
          if-no-files-found: warn
          retention-days: 14
