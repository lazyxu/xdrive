name: Clipboard one-shot branch gofmt
on:
  push:
    branches:
      - feat/clipboard-sse-dsm-chunk-20261111
    paths:
      - .github/workflows/clipboard-gofmt-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Canonical gofmt and remove temporary workflow
        run: |
          gofmt -w internal/client/clipboard_events.go internal/client/clipboard_events_test.go cmd/xdrive-agent/cloud_clipboard_events.go cmd/xdrive-agent/cloud_owner_large_upload.go \
            cmd/xdrive-agent/desktop_ipc_owner_chunk_upload.go internal/localbackupipc/owner_chunk_upload.go internal/synologyui/owner_upload_session.go internal/synologyui/owner_upload_session_test.go \
            cmd/xdrive-agent/desktop_ipc.go cmd/xdrive-agent/desktop_ipc_clipboard.go cmd/xdrive-agent/desktop_ipc_runtime_mode.go internal/localbackupipc/owner_clipboard.go \
            internal/synologyui/owner_clipboard.go internal/synologyui/gateway.go internal/synologyui/cgi.go
          git rm .github/workflows/clipboard-gofmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/client/clipboard_events.go internal/client/clipboard_events_test.go cmd/xdrive-agent/cloud_clipboard_events.go cmd/xdrive-agent/cloud_owner_large_upload.go cmd/xdrive-agent/desktop_ipc_owner_chunk_upload.go internal/localbackupipc/owner_chunk_upload.go internal/synologyui/owner_upload_session.go internal/synologyui/owner_upload_session_test.go cmd/xdrive-agent/desktop_ipc.go cmd/xdrive-agent/desktop_ipc_clipboard.go cmd/xdrive-agent/desktop_ipc_runtime_mode.go internal/localbackupipc/owner_clipboard.go internal/synologyui/owner_clipboard.go internal/synologyui/gateway.go internal/synologyui/cgi.go
          git diff --cached --quiet || git commit -m "style(clipboard): canonical gofmt and retire one-shot workflow"
          git push origin HEAD:feat/clipboard-sse-dsm-chunk-20261111
