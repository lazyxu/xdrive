name: Desktop Gallery cold first Range stage probe (real 100k)

on:
  pull_request:
    branches: [master]
    paths:
      - 'desktop/src/main/index.cts'
      - 'desktop/src/main/gallery_first_range_timing.cts'
      - 'desktop/tests/gallery-desktop-first-range-timing.cjs'
      - 'desktop/scripts/gallery-desktop-real-cold-electron-main.cjs'
      - 'desktop/scripts/gallery-desktop-real-cold-runner.cjs'
      - '.github/workflows/gallery-desktop-cold-first-range.yml'

permissions:
  contents: read

jobs:
  gallery-desktop-cold-first-range:
    if: github.head_ref == 'test/desktop-gallery-first-range-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_GALLERY_AGENT_BINARY: ${{ github.workspace }}/desktop/gallery-desktop-first-range-bin/xdrive-agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual production Electron Main/preload/renderer, Web fixture and Go Agent
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          (cd web && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
          npm --prefix web run build -- --config vite.config.ts
          npm --prefix desktop run build
          mkdir -p desktop/gallery-desktop-first-range-bin
          go build -o desktop/gallery-desktop-first-range-bin/xdrive-agent ./cmd/xdrive-agent
      - name: Test instrumentation correctness, no personal information, and source wiring
        run: |
          set -euo pipefail
          node --test desktop/tests/gallery-desktop-first-range-timing.cjs
          node --check desktop/scripts/gallery-desktop-real-cold-electron-main.cjs
          node --check desktop/scripts/gallery-desktop-real-cold-runner.cjs
      - name: Reproduce three independent real Desktop Gallery 100k cold activations
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1920x1200x24" node desktop/scripts/gallery-desktop-real-cold-runner.cjs
          test "$(find desktop/gallery-desktop-real-cold-results -maxdepth 1 -type f -name 'electron-*.log' | wc -l)" -eq 3
          cat desktop/gallery-desktop-real-cold-results/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-desktop-cold-first-range-100k
          path: desktop/gallery-desktop-real-cold-results/
          if-no-files-found: warn
          retention-days: 14
