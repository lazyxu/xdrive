name: Authentic Web and Desktop 4 GiB PostgreSQL CAS Performance

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  real-web-4gib-postgres-cas:
    if: github.head_ref == 'perf/real-web-desktop-postgres-cas-4gib-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_REAL_CAS_SIZE_GIB: "4"
      XD_REAL_WEB_CAS_RESULTS: ${{ github.workspace }}/desktop/real-web-cas-results-4gib
      XD_REAL_WEB_CAS_TEST_BINARY: ${{ github.workspace }}/desktop/real-web-cas-bin/api.test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual Web browser to Go Gin/Postgres/CAS fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          (cd web && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
          VITE_XDRIVE_LARGE_TRANSFER_PERF=1 npm --prefix web run build -- --config vite.config.ts
          test -z "$(gofmt -l internal/api/real_web_cas_transfer_fixture_performance_integration_test.go)"
          node --check desktop/scripts/large-transfer-real-web-cas-main.cjs
          node --check desktop/scripts/real-web-cas-transfer-runner.cjs
          mkdir -p desktop/real-web-cas-bin
          go test -c -o desktop/real-web-cas-bin/api.test ./internal/api
      - name: Three independent authentic 4GiB browser upload and OPFS download
        run: |
          set -euo pipefail
          mkdir -p "$XD_REAL_WEB_CAS_RESULTS"
          xvfb-run -a --server-args='-screen 0 1920x1200x24' node desktop/scripts/real-web-cas-transfer-runner.cjs
          test "$(find "$XD_REAL_WEB_CAS_RESULTS" -maxdepth 1 -type f -name 'sample-*.json' | wc -l)" -eq 3
          cat "$XD_REAL_WEB_CAS_RESULTS/summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-web-postgres-cas-4gib-n3
          path: desktop/real-web-cas-results-4gib/
          if-no-files-found: warn
          retention-days: 14

  real-desktop-4gib-postgres-cas:
    if: github.head_ref == 'perf/real-web-desktop-postgres-cas-4gib-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_REAL_CAS_SIZE_GIB: "4"
      XD_REAL_DESKTOP_CAS_RESULTS: ${{ github.workspace }}/desktop/real-desktop-cas-results-4gib
      XD_REAL_DESKTOP_AGENT_BINARY: ${{ github.workspace }}/desktop/real-desktop-cas-bin/xdrive-agent
      XD_REAL_DESKTOP_CAS_TEST_BINARY: ${{ github.workspace }}/desktop/real-desktop-cas-bin/api.test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual Desktop Renderer, Preload, Main, Go Agent, Gin and PostgreSQL fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          (cd web && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
          npm --prefix web run build -- --config vite.config.ts
          npm --prefix desktop run build
          mkdir -p desktop/real-desktop-cas-bin
          go build -o desktop/real-desktop-cas-bin/xdrive-agent ./cmd/xdrive-agent
          go test -c -o desktop/real-desktop-cas-bin/api.test ./internal/api
          node --check desktop/scripts/real-desktop-cas-electron-main.cjs
          node --check desktop/scripts/real-desktop-cas-runner.cjs
      - name: Three independent authentic 4GiB Desktop Agent IPC upload and full-SHA download
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1920x1200x24' node desktop/scripts/real-desktop-cas-runner.cjs
          test "$(find "$XD_REAL_DESKTOP_CAS_RESULTS" -maxdepth 1 -type f -name 'sample-*.json' | wc -l)" -eq 3
          cat "$XD_REAL_DESKTOP_CAS_RESULTS/summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-desktop-agent-postgres-cas-4gib-n3
          path: desktop/real-desktop-cas-results-4gib/
          if-no-files-found: warn
          retention-days: 14
