name: PWA S2B2 Authenticated Deep Link Chrome

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-s2b2-auth:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/pwa-auth-deeplink-s2b2-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install built Web and isolated Chromium driver
        run: |
          set -euo pipefail
          npm --prefix web ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/xdrive-pwa-s2b2-driver"
          npm install --prefix "$RUNNER_TEMP/xdrive-pwa-s2b2-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          if command -v google-chrome-stable >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Native Chrome missing" >&2
            exit 1
          fi
      - name: Check authenticated deep-link fixture source contract
        run: node --test desktop/tests/pwa-auth-deeplink-contract.cjs
      - name: Build exact production Web bundle
        run: npm --prefix web run build
      - name: Real Chrome login and restored Files route in desktop and Android emulation
        env:
          XD_PWA_S2B_AUTH: '1'
          XD_PWA_S2B_RESULT_DIR: ${{ github.workspace }}/desktop/pwa-s2b2-results
          XDRIVE_BROWSER_EXECUTABLE: ${{ env.XD_PWA_BROWSER }}
          XDRIVE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/xdrive-pwa-s2b2-driver/node_modules/playwright-core
        run: |
          set -euo pipefail
          export XD_PR_HEAD="$(git rev-parse HEAD)"
          node desktop/scripts/pwa-browser-install-offline.cjs
          node -e "const r=require(process.env.XD_PWA_S2B_RESULT_DIR+'/summary.json'); if(!r.passed||r.cases.length!==2||r.cases.some(x=>!x.authenticatedDeepLink||!x.authenticatedColdReload))process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-s2b2-chromium-fixture-only
          path: desktop/pwa-s2b2-results/summary.json
          if-no-files-found: warn
          retention-days: 14
