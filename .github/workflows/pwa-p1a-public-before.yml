name: PWA P1A Normal Web Real Chromium Public Bundle BEFORE
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  pwa-p1a-before:
    if: github.head_ref == 'test/pwa-p1a-web-bundle-before-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify exact source and build normal production Web
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node --check desktop/scripts/pwa-p1a-public-before.cjs
          npm --prefix web ci --no-audit --no-fund
          node --test desktop/tests/pwa-p1a-public-before-contract.cjs
          npm --prefix web run lint
          npm --prefix web run build
          mkdir -p "$RUNNER_TEMP/pwa-p1a-driver"
          npm install --prefix "$RUNNER_TEMP/pwa-p1a-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          echo "XDRIVE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/pwa-p1a-driver/node_modules/playwright-core" >> "$GITHUB_ENV"
          if command -v google-chrome-stable >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Native Chrome required" >&2; exit 1
          fi
      - name: Normal production Web public Shell native Chromium five widths n3
        env:
          XD_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          XD_PWA_P1A_OUT: ${{ github.workspace }}/desktop/pwa-p1a-results/summary.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XD_PR_HEAD"
          node desktop/scripts/pwa-p1a-public-before.cjs
          node - <<'NODE'
          const s=require('./desktop/pwa-p1a-results/summary.json')
          if(s.sha!==process.env.XD_PR_HEAD||s.samples.length!==15||s.n!==3||s.after!==null||s.pairedAfter||s.authenticated100k||s.initialGzipBytes<=0||s.viewports.join(',')!=='390,430,899,900,1280')process.exit(1)
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-normal-web-public-bundle-before-n3
          path: desktop/pwa-p1a-results/summary.json
          if-no-files-found: warn
          retention-days: 14
