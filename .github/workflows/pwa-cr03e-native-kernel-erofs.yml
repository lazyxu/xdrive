name: PWA CR03e Native Linux Kernel EROFS IndexedDB
on:
  pull_request:
    branches: [master]
    # Limit branch-specific evidence to its dedicated source/fixture paths.
    paths:
      - 'desktop/tests/pwa-cr03e-native-kernel-erofs-contract.cjs'
      - 'desktop/scripts/pwa-cr03e-native-kernel-erofs.cjs'
      - 'web/scripts/test-pwa-offline-directory.cjs'
permissions:
  contents: read
jobs:
  pwa-cr03e-kernel-erofs:
    if: github.head_ref == 'test/pwa-cr03e-real-kernel-erofs-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Exact-head P1 source contracts and normal production Web build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          npm --prefix web ci --no-audit --no-fund
          node --check desktop/scripts/pwa-cr03e-native-kernel-erofs.cjs
          node --test desktop/tests/pwa-cr03e-native-kernel-erofs-contract.cjs
          node web/scripts/test-pwa-offline-directory.cjs
          node web/scripts/test-pwa-offline-readonly.cjs
          npm --prefix web run build
          mkdir -p "$RUNNER_TEMP/pwa-cr03e-driver"
          npm install --prefix "$RUNNER_TEMP/pwa-cr03e-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          echo "XDRIVE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/pwa-cr03e-driver/node_modules/playwright-core" >> "$GITHUB_ENV"
          if command -v google-chrome-stable >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "native Chromium unavailable" >&2; exit 1
          fi
      - name: Kernel EROFS from genuine readonly tmpfs, Chrome P1 fail closed and peer purge
        env:
          XD_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          XD_PWA_CR03E_NATIVE_EROFS: '1'
          XD_PWA_CR03E_OUTPUT: ${{ github.workspace }}/desktop/pwa-cr03e-results
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XD_PR_HEAD"
          PROFILE="$RUNNER_TEMP/pwa-cr03e-private-profile"
          test "$PROFILE" = "$RUNNER_TEMP/pwa-cr03e-private-profile"
          test ! -e "$PROFILE"
          MOUNT="$PROFILE/Default/IndexedDB"
          mkdir -p "$MOUNT"
          sudo mount -t tmpfs -o size=128m,mode=0700,nodev,nosuid tmpfs "$MOUNT"
          sudo chown "$(id -u):$(id -g)" "$MOUNT"
          cleanup() {
            sudo mount -o remount,rw "$MOUNT" || true
            sudo umount "$MOUNT" || true
            rm -rf -- "$PROFILE"
          }
          trap cleanup EXIT
          mountpoint -q "$MOUNT"
          node desktop/scripts/pwa-cr03e-native-kernel-erofs.cjs
          node - <<'NODE'
          const fs=require('node:fs')
          const s=JSON.parse(fs.readFileSync('./desktop/pwa-cr03e-results/summary.json'))
          const required=['passed','nativeChromium','isolatedMount','kernelEROFS',
            'mountRestored','originalConsent','originalDirectory','originalAlbum',
            'readOnlyUIHistoricalOrEmpty','productWriteRejected','durablePurgeRejected',
            'peerPurgeNotified','postRestoreNoNewRow','postRestoreNotAuthorized','publicSWOnly']
          if(s.sha!==process.env.XD_PR_HEAD || required.some(k=>s[k]!==true) ||
            s.physicalIOS||s.physicalDiskEIO||s.productionCodeModified)process.exit(1)
          console.log('PWA_CR03E_NATIVE_KERNEL_EROFS_PASS '+s.sha.slice(0,12))
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-cr03e-sanitized-native-kernel-erofs
          path: desktop/pwa-cr03e-results/summary.json
          if-no-files-found: warn
          retention-days: 14
