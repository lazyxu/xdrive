name: PWA P0-B2b1 Two Independent Web Build Upgrade

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-two-release-web:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/pwa-two-release-web-p0b2b1-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout immutable prior real release A
        uses: actions/checkout@v4
        with:
          path: release-a
          ref: e6018a4c260d1d7fff5e1718421cfb2a21f9dbd4
      - name: Checkout exact proposed real release B
        uses: actions/checkout@v4
        with:
          path: release-b
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install both independent Vite builds and real Chrome driver
        run: |
          set -euo pipefail
          test "$(git -C release-a rev-parse HEAD)" = e6018a4c260d1d7fff5e1718421cfb2a21f9dbd4
          test "$(git -C release-a rev-parse HEAD)" != "$(git -C release-b rev-parse HEAD)"
          npm --prefix release-a/web ci --no-audit --no-fund
          npm --prefix release-b/web ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/xdrive-pwa-b2b1-driver"
          npm install --prefix "$RUNNER_TEMP/xdrive-pwa-b2b1-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          if command -v google-chrome-stable >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No installed real Chrome/Chromium" >&2
            exit 1
          fi
      - name: Check exact real browser script syntax before building
        run: |
          node --check release-b/desktop/scripts/pwa-two-release-web-p0b2b1.cjs
          node --check release-b/desktop/tests/pwa-two-release-web-p0b2b1.cjs
      - name: Run source security and real-build-only contracts
        run: node --test release-b/desktop/tests/pwa-two-release-web-p0b2b1.cjs
      - name: Build historic real release A
        run: npm --prefix release-a/web run build
      - name: Independently build current real release B
        run: npm --prefix release-b/web run build
      - name: Genuine compiled lazy ESM upgrade and rollback in Chrome
        env:
          XD_PWA_B2B_A_DIST: ${{ github.workspace }}/release-a/web/dist
          XD_PWA_B2B_B_DIST: ${{ github.workspace }}/release-b/web/dist
          XD_PWA_B2B_RESULT_DIR: ${{ github.workspace }}/release-b/desktop/pwa-b2b1-results
          XDRIVE_BROWSER_EXECUTABLE: ${{ env.XD_PWA_BROWSER }}
          XDRIVE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/xdrive-pwa-b2b1-driver/node_modules/playwright-core
        run: |
          set -euo pipefail
          export XD_PWA_B2B_A_SHA="$(git -C release-a rev-parse HEAD)"
          export XD_PWA_B2B_B_SHA="$(git -C release-b rev-parse HEAD)"
          node release-b/desktop/scripts/pwa-two-release-web-p0b2b1.cjs
          node -e "const s=require(process.env.XD_PWA_B2B_RESULT_DIR + '/summary.json');if(!s.passed||!s.independentProductionWebBuilds||s.actualGoServerVersions!==false||s.actualCaddyBinary!==false||s.physicalIOS!==false||s.cases.length!==2||s.cases.some(x=>!x.realManifestLazyESM||!x.liveOldSWWaiting||!x.missingAsset404||!x.privateNetworkOnly))process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-two-real-web-release-public-summary
          path: release-b/desktop/pwa-b2b1-results/summary.json
          if-no-files-found: warn
          retention-days: 14
