name: Web Real PostgreSQL CAS Incompressible 1 GiB Upload Download P042

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  web-physical-incompressible-1gib:
    if: github.head_ref == 'perf/real-web-incompressible-cas-1gib-p042-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_REAL_CAS_INCOMPRESSIBLE_PERF: '1'
      XD_REAL_CAS_SIZE_GIB: '1'
      XD_REAL_WEB_CAS_RESULTS: ${{ github.workspace }}/desktop/real-web-incompressible-cas-1gib-results
      XD_REAL_WEB_CAS_TEST_BINARY: ${{ github.workspace }}/desktop/real-web-cas-bin/api.test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove physical high-entropy source and bounded deterministic WebCrypto SHA/CAS/OPFS contract
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/api/real_web_cas_transfer_fixture_performance_integration_test.go)"
          node --check desktop/scripts/large-transfer-real-web-cas-main.cjs
          node --check desktop/scripts/real-web-cas-transfer-runner.cjs
          node --test desktop/tests/real-web-incompressible-cas-1gib-source.cjs
          df -h .
      - name: Build production Web XDriveApi OPFS and native Go Gin PostgreSQL17 physical Local CAS
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          (cd web && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
          VITE_XDRIVE_LARGE_TRANSFER_PERF=1 npm --prefix web run build -- --config vite.config.ts
          mkdir -p desktop/real-web-cas-bin
          go test -c -o desktop/real-web-cas-bin/api.test ./internal/api
      - name: Measure three independent real 1GiB non-sparse high-entropy browser PUT and full-byte OPFS GET
        run: |
          set -euo pipefail
          mkdir -p "$XD_REAL_WEB_CAS_RESULTS"
          printf 'EXACT_SOURCE_HEAD=%s\nRUN=%s\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > "$XD_REAL_WEB_CAS_RESULTS/source.txt"
          xvfb-run -a --server-args='-screen 0 1920x1200x24' node desktop/scripts/real-web-cas-transfer-runner.cjs
          test "$(find "$XD_REAL_WEB_CAS_RESULTS" -maxdepth 1 -type f -name 'sample-*.json' | wc -l)" -eq 3
          node -e "const s=require(process.env.XD_REAL_WEB_CAS_RESULTS+'/summary.json');if(!s.passed||!s.highEntropyIncompressible||s.n!==3||s.bytesPerDirection!==1073741824||!s.each.every(x=>x.upload.uploadSeedSHA256===x.upload.uploadedSHA256&&x.download.downloadDeterministicVerifiedBytes===1073741824&&x.nativeServer.cas_valid))process.exit(1);console.log(JSON.stringify({passed:s.passed,upMs:s.uploadElapsedP50Ms,downMs:s.downloadElapsedP50Ms}))"
          cat "$XD_REAL_WEB_CAS_RESULTS/summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-web-postgres-cas-high-entropy-1gib-n3
          path: desktop/real-web-incompressible-cas-1gib-results/
          if-no-files-found: warn
          retention-days: 14
