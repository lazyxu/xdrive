name: Desktop Gallery real cold observer Long Task A/B (100k)

on:
  pull_request:
    branches: [master]
    paths:
      - 'desktop/scripts/gallery-desktop-real-cold-electron-main.cjs'
      - 'desktop/scripts/gallery-desktop-cold-observer-compare.cjs'
      - 'desktop/tests/gallery-real-cold-observer-queue.cjs'
      - '.github/workflows/gallery-desktop-observer-cost.yml'

permissions:
  contents: read

jobs:
  gallery-real-cold-observer-ab:
    if: github.head_ref == 'test/desktop-gallery-cold-longtask-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_GALLERY_AGENT_BINARY: ${{ github.workspace }}/desktop/gallery-observer-100k-bin/xdrive-agent
      XD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable baseline and benchmark-only change
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$RUNNER_TEMP/xdrive-gallery-observer-before"
          git fetch origin "$XD_BASE_SHA" --depth=1
          git worktree add --detach "$BEFORE" "$XD_BASE_SHA"
          test "$(git -C "$BEFORE" rev-parse HEAD)" = "$XD_BASE_SHA"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --quiet "$XD_BASE_SHA" HEAD -- ui/shared/src desktop/src internal cmd web/src
          if git diff --name-only "$XD_BASE_SHA" HEAD |
            grep -Ev '^(desktop/scripts/gallery-desktop-real-cold-electron-main\.cjs|desktop/scripts/gallery-desktop-cold-observer-compare\.cjs|desktop/tests/gallery-real-cold-observer-queue\.cjs|\.github/workflows/gallery-desktop-observer-cost\.yml|docs/performance-test-registry\.md)$'; then
            echo "This A/B may only change the test observer, comparator, workflow and documentation"
            exit 1
          fi
      - name: Build same real production Desktop + Web and unchanged Agent
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          BEFORE="$RUNNER_TEMP/xdrive-gallery-observer-before"
          (cd "$BEFORE/web" && npm install --no-audit --no-fund)
          (cd "$BEFORE/desktop" && npm install --no-audit --no-fund)
          (cd web && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
          npm --prefix "$BEFORE/web" run build -- --config vite.config.ts
          npm --prefix "$BEFORE/desktop" run build
          npm --prefix web run build -- --config vite.config.ts
          npm --prefix desktop run build
          mkdir -p desktop/gallery-observer-100k-bin
          go build -o desktop/gallery-observer-100k-bin/xdrive-agent ./cmd/xdrive-agent
          node --test desktop/tests/gallery-real-cold-observer-queue.cjs
          node --check desktop/scripts/gallery-desktop-real-cold-electron-main.cjs
          node --check desktop/scripts/gallery-desktop-cold-observer-compare.cjs
      - name: BEFORE - original synchronous observer, n=3 real sessions
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$RUNNER_TEMP/xdrive-gallery-observer-before"
          xvfb-run -a --server-args="-screen 0 1920x1200x24" node "$BEFORE/desktop/scripts/gallery-desktop-real-cold-runner.cjs"
          mkdir -p desktop/gallery-observer-100k-ab
          cp "$BEFORE/desktop/gallery-desktop-real-cold-results/summary.json" desktop/gallery-observer-100k-ab/before.json
          test -s desktop/gallery-observer-100k-ab/before.json
      - name: AFTER - rAF-coalesced observer, n=3 real sessions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1920x1200x24" node desktop/scripts/gallery-desktop-real-cold-runner.cjs
          cp desktop/gallery-desktop-real-cold-results/summary.json desktop/gallery-observer-100k-ab/after.json
          test -s desktop/gallery-observer-100k-ab/after.json
      - name: Compare real n3/n3 Long Task with unchanged production
        shell: bash
        run: |
          set -euo pipefail
          node desktop/scripts/gallery-desktop-cold-observer-compare.cjs \
            desktop/gallery-observer-100k-ab/before.json \
            desktop/gallery-observer-100k-ab/after.json \
            desktop/gallery-observer-100k-ab/comparison.json
          cat desktop/gallery-observer-100k-ab/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-observer-100k-n3-ab
          path: desktop/gallery-observer-100k-ab/
          if-no-files-found: warn
          retention-days: 14
