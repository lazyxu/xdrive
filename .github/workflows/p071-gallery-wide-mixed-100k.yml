name: P071 Current 100k Gallery Wide 1440px Mixed CAS

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gallery-web-real-physical-100k:
    if: github.head_ref == 'perf/p071-gallery-100k-current-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_GALLERY_WEB_PHYSICAL_GO_BINARY: ${{ github.workspace }}/desktop/gallery-physical-web-go/api.test
      XD_GALLERY_WEB_PHYSICAL_VIEWPORT_RESULTS: ${{ github.workspace }}/desktop/gallery-web-physical-mixed-100k-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check native test-only fixture and real viewport source contracts
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/api/gallery_real_web_cold_performance_integration_test.go)"
          node --check desktop/scripts/gallery-web-physical-mixed-100k-viewports.cjs
          node --test desktop/tests/gallery-web-physical-100k-source.cjs
      - name: Build actual native Go Gin PostgreSQL CAS fixture and Web Gallery
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          (cd web && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
          VITE_XDRIVE_GALLERY_REAL_COLD_PERF=1 npm --prefix web run build -- --config vite.config.ts
          mkdir -p desktop/gallery-physical-web-go
          go test -c -o desktop/gallery-physical-web-go/api.test ./internal/api
      - name: Measure 3 independent 115k physical CAS native Gallery five-position Chromium sessions
        run: |
          set -euo pipefail
          mkdir -p "$XD_GALLERY_WEB_PHYSICAL_VIEWPORT_RESULTS"
          printf 'CHECKED_OUT_HEAD=%s\nEVENT_SHA=%s\nRUN=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$XD_GALLERY_WEB_PHYSICAL_VIEWPORT_RESULTS/source.txt"
          xvfb-run -a --server-args="-screen 0 1920x1200x24" \
            ./desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/gallery-web-physical-mixed-100k-viewports.cjs
          test "$(find "$XD_GALLERY_WEB_PHYSICAL_VIEWPORT_RESULTS" -maxdepth 1 -name 'sample-*.json' | wc -l)" -eq 3
          node -e "const x=require(process.env.XD_GALLERY_WEB_PHYSICAL_VIEWPORT_RESULTS+'/summary.json');if(!x.accepted||x.n!==3)process.exit(1);console.log(JSON.stringify({accepted:x.accepted,p50:x.medianOfFixtureFiveViewportP50Ms,peakGo:x.maxNativeGoRSSGrowthBytes,peakRenderer:x.maxRendererWorkingSetGrowthBytes}))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p071-gallery-wide-mixed-115k-n3
          path: desktop/gallery-web-physical-mixed-100k-results/
          if-no-files-found: warn
          retention-days: 14
