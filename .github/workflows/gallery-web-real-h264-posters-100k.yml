name: Gallery Real Web H264 Video Posters 100k Physical CAS

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gallery-real-web-h264-posters-100k:
    if: github.head_ref == 'perf/gallery-web-h264-posters-100k-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_GALLERY_H264_POSTERS_GO_BINARY: ${{ github.workspace }}/desktop/gallery-h264-web-go/api.test
      XD_GALLERY_H264_POSTERS_RESULTS: ${{ github.workspace }}/desktop/gallery-h264-real-posters-100k-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate test-only Gallery H264 poster source and frozen gates
        run: |
          set -euo pipefail
          node --check desktop/scripts/gallery-web-real-h264-posters-100k.cjs
          node --test desktop/tests/gallery-web-real-h264-posters-100k-source.cjs
      - name: Build actual shared Web Gallery and native Go CAS PostgreSQL fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          (cd web && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
          VITE_XDRIVE_GALLERY_REAL_COLD_PERF=1 npm --prefix web run build -- --config vite.config.ts
          mkdir -p desktop/gallery-h264-web-go
          go test -c -o desktop/gallery-h264-web-go/api.test ./internal/api
      - name: Measure three independent 100k real Gallery Web H264 poster capture/PUT/warm-cache cohorts
        run: |
          set -euo pipefail
          mkdir -p "$XD_GALLERY_H264_POSTERS_RESULTS"
          printf 'EXACT_SOURCE_HEAD=%s\nEVENT_SHA=%s\nRUN=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$XD_GALLERY_H264_POSTERS_RESULTS/source.txt"
          xvfb-run -a --server-args="-screen 0 1920x1200x24" \
            ./desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/gallery-web-real-h264-posters-100k.cjs
          test "$(find "$XD_GALLERY_H264_POSTERS_RESULTS" -maxdepth 1 -name 'sample-*.json' | wc -l)" -eq 3
          node -e "const j=require(process.env.XD_GALLERY_H264_POSTERS_RESULTS+'/summary.json');if(!j.accepted||j.n!==3||j.nRealViewports!==15)process.exit(1);console.log(JSON.stringify({accepted:j.accepted,p50:j.medianOfFixtureP50Ms,worst:j.worstMs}))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-real-web-h264-poster-100k-n3
          path: desktop/gallery-h264-real-posters-100k-results/
          if-no-files-found: warn
          retention-days: 14
