name: Real Electron Desktop to PostgreSQL CAS 1 GiB Transfers

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  desktop-renderer-go-agent-gin-cas-1gib:
    if: github.head_ref == 'perf/real-desktop-postgres-cas-1gib'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_REAL_DESKTOP_CAS_RESULTS: ${{ github.workspace }}/desktop/real-desktop-cas-results
      XD_REAL_DESKTOP_AGENT_BINARY: ${{ github.workspace }}/desktop/real-desktop-cas-bin/xdrive-agent
      XD_REAL_DESKTOP_CAS_TEST_BINARY: ${{ github.workspace }}/desktop/real-desktop-cas-bin/api.test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build authentic Desktop Renderer Main and Preload, Go Agent, real Gin CAS/PG17 fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          (cd web && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
          npm --prefix web run build -- --config vite.config.ts
          npm --prefix desktop run build
          mkdir -p desktop/real-desktop-cas-bin
          go build -o desktop/real-desktop-cas-bin/xdrive-agent ./cmd/xdrive-agent
          go test -c -o desktop/real-desktop-cas-bin/api.test ./internal/api
          node --check desktop/scripts/real-desktop-cas-electron-main.cjs
          node --check desktop/scripts/real-desktop-cas-runner.cjs
      - name: Measure n=3 authentic Electron Renderer to real Go Agent IPC to Gin CAS 1GiB native transfers
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1920x1200x24' node desktop/scripts/real-desktop-cas-runner.cjs
          test "$(find desktop/real-desktop-cas-results -maxdepth 1 -type f -name 'sample-*.json' | wc -l)" -eq 3
          cat desktop/real-desktop-cas-results/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-real-renderer-go-agent-postgres-cas-1gib
          path: desktop/real-desktop-cas-results/
          if-no-files-found: warn
          retention-days: 14
