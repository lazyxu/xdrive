name: Places real production Desktop Main and Web map restart E2E

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/places-desktop-production-web-restart.yml'
      - 'internal/api/desktop_places_production_web_restart_linux_test.go'
      - 'desktop/scripts/places-desktop-production-web-*.cjs'
      - 'desktop/src/main/index.cts'
      - 'desktop/src/preload/places_embed.cts'
      - 'desktop/src/renderer/App.tsx'
      - 'web/src/App.tsx'
      - 'ui/shared/src/mui/MediaGalleryPlacesMap.tsx'
      - 'ui/shared/src/desktop-places-embed-admission.ts'
      - 'desktop/tests/gallery-places-webview-dom-ready-probe.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-main-preload-renderer-real-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_DESKTOP_PLACES_AGENT_BINARY: ${{ github.workspace }}/desktop/places-production-e2e-agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real Go Agent, Web, Desktop Main/preload/Renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb iproute2 openssl xdotool
          npm --prefix web install --no-audit --no-fund
          npm --prefix web run build
          npm --prefix desktop install --no-audit --no-fund
          npm --prefix desktop run build
          node --test desktop/tests/gallery-places-webview-dom-ready-probe.cjs
          go build -o "$XD_DESKTOP_PLACES_AGENT_BINARY" ./cmd/xdrive-agent
          node --check desktop/scripts/places-desktop-production-web-electron-main.cjs
          node --check desktop/scripts/places-desktop-production-web-runner.cjs
      - name: Real production Desktop + real Web Gallery, two restarts, same Agent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          sudo ip addr add 10.233.15.19/32 dev lo
          trap 'sudo ip addr del 10.233.15.19/32 dev lo || true' EXIT
          xvfb-run -a --server-args='-screen 0 1600x1000x24' \
            node desktop/scripts/places-desktop-production-web-runner.cjs
