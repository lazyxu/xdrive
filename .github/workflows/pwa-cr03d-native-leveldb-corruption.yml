name: PWA CR03d Native Chromium LevelDB Corrupted Metadata Recovery
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  pwa-cr03d-native-corruption:
    if: github.head_ref == 'test/pwa-cr03d-native-leveldb-corrupt-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build exact normal public PWA and test source contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          npm --prefix web ci --no-audit --no-fund
          node --check desktop/scripts/pwa-cr03d-native-leveldb-corruption.cjs
          node --test desktop/tests/pwa-cr03d-native-leveldb-corruption-contract.cjs
          npm --prefix web run build
          mkdir -p "$RUNNER_TEMP/pwa-cr03d-driver"
          npm install --prefix "$RUNNER_TEMP/pwa-cr03d-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          echo "XDRIVE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/pwa-cr03d-driver/node_modules/playwright-core" >> "$GITHUB_ENV"
          if command -v google-chrome-stable >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Native Chrome mandatory" >&2; exit 1
          fi
      - name: Genuine closed Chrome LevelDB OS-file corruption and third/fourth process recovery
        env:
          XD_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          XD_PWA_CR03D_NATIVE_CORRUPTION: '1'
          XD_PWA_CR03D_OUTPUT: ${{ github.workspace }}/desktop/pwa-cr03d-results
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XD_PR_HEAD"
          node desktop/scripts/pwa-cr03d-native-leveldb-corruption.cjs
          node - <<'NODE'
          const s=require('./desktop/pwa-cr03d-results/summary.json')
          const required=['nativeChromium','profileIsDisposable',
            'originalPersisted','positiveColdRestart','realLevelDBCurrentCorrupted',
            'allProcessesClosedDuringCorruption','corruptColdLaunched',
            'historicalWarning','offlineHistoryNeverAuthorized',
            'publicSWPrivateBytesAbsent','secondCorruptColdLaunch','passed']
          if(s.sha!==process.env.XD_PR_HEAD||required.some(x=>s[x]!==true)||
             !['historical','empty'].includes(s.corruptionOutcome)||
             s.kernelEROFS||s.kernelEIO||s.physicalIOS)process.exit(1)
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-cr03d-sanitized-real-chromium-leveldb-corruption
          path: desktop/pwa-cr03d-results/summary.json
          if-no-files-found: warn
          retention-days: 14
