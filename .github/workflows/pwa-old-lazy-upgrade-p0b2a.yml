name: PWA P0-B2a Actual Chromium Old Lazy Upgrade

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-old-lazy-upgrade:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/pwa-old-lazy-browser-p0b2a-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install production Web dependencies and isolated Chromium driver
        run: |
          set -euo pipefail
          npm --prefix web ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/xdrive-pwa-old-lazy-driver"
          npm install --prefix "$RUNNER_TEMP/xdrive-pwa-old-lazy-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          if command -v google-chrome-stable >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Native Chromium/Chrome unavailable" >&2
            exit 1
          fi
      - name: Validate source, privacy and waiting lifecycle contracts
        run: node --test desktop/tests/pwa-old-lazy-upgrade-p0b2a.cjs
      - name: Build actual Web production bundle with manifest and SW
        run: npm --prefix web run build
      - name: Actual Chromium old lazy import, waiting update and rollback
        env:
          XD_PWA_P0B2_RESULT_DIR: ${{ github.workspace }}/desktop/pwa-p0b2-results
          XDRIVE_BROWSER_EXECUTABLE: ${{ env.XD_PWA_BROWSER }}
          XDRIVE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/xdrive-pwa-old-lazy-driver/node_modules/playwright-core
        run: |
          set -euo pipefail
          export XD_PR_HEAD="$(git rev-parse HEAD)"
          node desktop/scripts/pwa-old-lazy-upgrade-p0b2a.cjs
          node -e "const x=require(process.env.XD_PWA_P0B2_RESULT_DIR+'/summary.json');if(!x.passed||x.physicalDevice!==false||x.twoIndependentBuilds!==false||x.cases.length!==2||x.cases.some(z=>!z.realViteLazyChunkTransport||!z.oldLazyAfterUpgrade||!z.waitingNoForcedReload||!z.rollbackOldLazy||!z.missingChunk404||!z.privateNetworkOnly))process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-p0b2a-public-browser-summary
          path: desktop/pwa-p0b2-results/summary.json
          if-no-files-found: warn
          retention-days: 14
