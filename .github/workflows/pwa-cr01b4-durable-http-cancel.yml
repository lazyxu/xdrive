name: PWA CR01b4 Native Chromium Go Context Cancellation vs Durable Worker
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  pwa-cr01b4-durable-vs-short-read:
    if: github.head_ref == 'test/pwa-cr01b4-http-cancel-durable-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build real Gin production Web and source contracts
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/api/pwa_s2b3_real_gin_auth_integration_test.go internal/api/pwa_cr01b4_request_cancel_fixture_linux_test.go)"
          node --check desktop/scripts/pwa-cr01b4-durable-http-cancel.cjs
          node --test desktop/tests/pwa-cr01b4-durable-http-cancel.cjs
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          go test -c -o "$RUNNER_TEMP/pwa-cr01b4-gin-api.test" ./internal/api
          mkdir -p "$RUNNER_TEMP/pwa-cr01b4-driver"
          npm install --prefix "$RUNNER_TEMP/pwa-cr01b4-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          if command -v google-chrome-stable >/dev/null; then
            echo "XD_CR01B4_CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XD_CR01B4_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XD_CR01B4_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Native Chrome required" >&2
            exit 1
          fi
      - name: Authentic Browser abort and SQL durable worker postflight
        env:
          XD_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XD_PR_HEAD"
          READY="$RUNNER_TEMP/pwa-cr01b4-ready-private.json"
          OUT="$GITHUB_WORKSPACE/desktop/pwa-cr01b4-results"
          mkdir -p "$OUT"
          XD_PWA_S2B3_REAL_GIN=1 XD_PWA_S4D3_DURABLE=1 XD_PWA_CR01B4_CANCEL_DURABLE=1 \
          XD_PWA_S2B3_READY_FILE="$READY" XD_PWA_S2B3_DIST="$GITHUB_WORKSPACE/web/dist" \
             "$RUNNER_TEMP/pwa-cr01b4-gin-api.test" \
               -test.run='^TestPWAS2B3RealGinAuthFixture$' -test.count=1 -test.v -test.timeout=5m \
               > "$RUNNER_TEMP/pwa-cr01b4-private-gin.log" 2>&1 &
          FIXTURE_PID=$!
          cleanup() {
            if kill -0 "$FIXTURE_PID" 2>/dev/null; then kill "$FIXTURE_PID" || true; wait "$FIXTURE_PID" || true; fi
            rm -f "$READY"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if [ -s "$READY" ]; then break; fi
            if ! kill -0 "$FIXTURE_PID" 2>/dev/null; then echo "real Gin fixture exited early"; exit 1; fi
            sleep 1
          done
          test -s "$READY" || exit 1
          XDRIVE_BROWSER_EXECUTABLE="$XD_CR01B4_CHROME" \
          XDRIVE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/pwa-cr01b4-driver/node_modules/playwright-core" \
           node desktop/scripts/pwa-cr01b4-durable-http-cancel.cjs --ready="$READY" --output-dir="$OUT"
          wait "$FIXTURE_PID" || { echo "CR01b4 Go Context/SQL postflight failed"; exit 1; }
          node - <<'NODE'
          const s=require('./desktop/pwa-cr01b4-results/summary.json')
          const needed=['passed','authOwnerReady','readPhysicalBytes','readActualContextCancelled',
          'readGoHandlerExited','queuedDurableUnaffected','durableWorkerStartedBeforeReadAbort','serverWorkerCompleted',
          'ownerScopedTaskPersisted','publicSWOnly']
          if(s.sha!==process.env.XD_PR_HEAD || needed.some(k=>s[k]!==true))process.exit(1)
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-cr01b4-anonymous-context-durable-proof
          path: desktop/pwa-cr01b4-results/summary.json
          if-no-files-found: warn
          retention-days: 14
