name: Build Packages

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  client-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build Linux client installer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="snapshot-${GITHUB_SHA::7}"
          fi
          bash scripts/build-linux-deb.sh "$version" release
      - uses: actions/upload-artifact@v4
        with:
          name: client-linux-amd64
          path: release/xdrive-client-linux-amd64.deb
          if-no-files-found: error
          retention-days: 14

  client-windows-amd64:
    runs-on: windows-latest
    env:
      XD_WINDOWS_SIGN_PFX_B64: ${{ secrets.XD_WINDOWS_SIGN_PFX_B64 }}
      XD_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.XD_WINDOWS_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Test Windows CfAPI packages
        run: go test ./internal/...
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Prepare Windows code-signing certificate
        if: env.XD_WINDOWS_SIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "xdrive-codesign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:XD_WINDOWS_SIGN_PFX_B64))
          "XD_WINDOWS_SIGN_PFX_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows client installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "snapshot-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and [string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_PATH)) {
            throw "Stable Windows releases require XD_WINDOWS_SIGN_PFX_B64 and XD_WINDOWS_SIGN_PFX_PASSWORD secrets."
          }
          ./scripts/build-windows-installer.ps1 -Version $version -OutputDir release
      - name: Verify Windows Authenticode signatures
        if: env.XD_WINDOWS_SIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          $targets = @(
            "./release/windows-build/xd.exe",
            "./release/windows-build/xdrive-agent.exe",
            "./release/xDriveSetup-amd64.exe"
          )
          foreach ($target in $targets) {
            $sig = Get-AuthenticodeSignature $target
            if ($sig.Status -ne "Valid") { throw "invalid Authenticode signature for $target: $($sig.Status)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-amd64
          path: release/xDriveSetup-amd64.exe
          if-no-files-found: error
          retention-days: 14

  server-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: xdrive-server
            context: .
            dockerfile: ./Dockerfile
          - image: xdrive-web
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image }}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
            tags="$image:$GITHUB_REF_NAME"$'\n'"$image:latest"
          else
            version="snapshot-${GITHUB_SHA::7}"
            tags="$image:edge"$'\n'"$image:sha-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

  server-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server deployment assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            source_ref="$GITHUB_REF_NAME"
            image_tag="$GITHUB_REF_NAME"
          else
            source_ref="$GITHUB_SHA"
            image_tag="edge"
          fi
          sed -e "s|@SOURCE_REF@|$source_ref|g" -e "s|@IMAGE_TAG@|$image_tag|g" \
            deploy/install-server.sh > release/xdrive-server-install.sh
          chmod +x release/xdrive-server-install.sh
          cp deploy/docker-compose.yml release/docker-compose.yml
          cp deploy/Caddyfile release/Caddyfile
          cp deploy/.env.example release/xdrive.env.example
          cp scripts/server-backup.sh scripts/server-backup-scheduled.sh scripts/server-restore.sh scripts/server-verify.sh release/
          chmod +x release/server-backup.sh release/server-backup-scheduled.sh release/server-restore.sh release/server-verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server-deploy
          path: release/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    needs: [client-linux-amd64, client-windows-amd64, server-images, server-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux client installer
        uses: actions/download-artifact@v4
        with:
          name: client-linux-amd64
          path: release
      - name: Download Windows client installer
        uses: actions/download-artifact@v4
        with:
          name: client-windows-amd64
          path: release
      - name: Download server deployment assets
        uses: actions/download-artifact@v4
        with:
          name: server-deploy
          path: release
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum \
            xdrive-client-linux-amd64.deb \
            xDriveSetup-amd64.exe \
            xdrive-server-install.sh \
            server-backup.sh \
            server-backup-scheduled.sh \
            server-restore.sh \
            server-verify.sh \
            docker-compose.yml \
            Caddyfile \
            xdrive.env.example > SHA256SUMS.txt
      - name: Publish rolling snapshot prerelease as direct files
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if gh api "repos/$repo/git/ref/tags/snapshot" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$repo/git/refs/tags/snapshot" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$repo/git/refs" -f ref='refs/tags/snapshot' -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view snapshot --repo "$repo" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [[ -n "$asset" ]] && gh release delete-asset snapshot "$asset" --repo "$repo" -y
            done < <(gh release view snapshot --repo "$repo" --json assets --jq '.assets[].name')
            gh release upload snapshot release/* --repo "$repo"
            gh release edit snapshot --repo "$repo" --prerelease --title "xDrive snapshot ${GITHUB_SHA::7}" \
              --notes "Rolling development snapshot from master at $GITHUB_SHA. Assets are published directly; no extra zip/tar wrapper is used."
          else
            gh release create snapshot release/* --repo "$repo" --prerelease \
              --title "xDrive snapshot ${GITHUB_SHA::7}" \
              --notes "Rolling development snapshot from master at `$GITHUB_SHA`. Assets are published directly; no extra zip/tar wrapper is used."
          fi
      - name: Assert distribution assets are not archive-wrapped
        shell: bash
        run: |
          set -euo pipefail
          if find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) | grep -q .; then
            echo "single-file installers/scripts must be published directly, not archive-wrapped" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "xDrive $GITHUB_REF_NAME"
