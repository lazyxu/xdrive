name: Publish Packages

on:
  workflow_call:
    inputs:
      publish:
        description: Publish exact CI-tested server images and release assets after the full gate passes.
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  verify-client-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Linux installer tested by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-linux-amd64
          path: exact
      - name: Download exact Windows installer tested by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-windows-amd64
          path: exact
      - name: Download exact Synology source-agent binaries tested by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-source-agent-linux
          path: source-agent
      - name: Verify exact client artifact contract
        shell: bash
        run: |
          set -euo pipefail
          test -f exact/xdrive-linux-amd64.deb
          test -f exact/xDriveSetup-amd64.exe
          count="$(find exact -maxdepth 1 -type f | wc -l)"
          [[ "$count" == "2" ]] || {
            echo "expected exactly two user-facing client installers; found $count" >&2
            find exact -maxdepth 1 -type f -print >&2
            exit 1
          }
          test -f source-agent/xdrive-source-agent-linux-amd64
          test -f source-agent/xdrive-source-agent-linux-arm64
          source_count="$(find source-agent -maxdepth 1 -type f | wc -l)"
          [[ "$source_count" == "2" ]] || {
            echo "expected exactly two source-agent binaries; found $source_count" >&2
            find source-agent -maxdepth 1 -type f -print >&2
            exit 1
          }

  server-images:
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download exact images tested by CI
        uses: actions/download-artifact@v4
        with:
          pattern: xdrive-*-image
          path: dist
      - name: Load and verify exact images tested by CI
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh

          load_exact() {
            local artifact="$1"
            local image="$2"
            bash scripts/ci/import-docker-image.sh "dist/$artifact" "$image"
            local image_version
            image_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")"
            [[ "$image_version" == "$XDRIVE_RELEASE_VERSION" ]] || {
              echo "exact image version label mismatch: got $image_version want $XDRIVE_RELEASE_VERSION for $image" >&2
              exit 1
            }
          }

          load_exact xdrive-server-image xdrive/server:test
          load_exact xdrive-web-image xdrive/web:test
          load_exact xdrive-caddy-image xdrive/caddy:test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exact tested images in parallel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            remote_tag="$GITHUB_REF_NAME"
          else
            remote_tag="sha-${GITHUB_SHA::12}"
          fi

          names=(xdrive-server xdrive-web xdrive-caddy)
          locals=(xdrive/server:test xdrive/web:test xdrive/caddy:test)
          pids=()

          for i in "${!names[@]}"; do
            remote="ghcr.io/$GITHUB_REPOSITORY_OWNER/${names[$i]}:$remote_tag"
            docker tag "${locals[$i]}" "$remote"
            docker push "$remote" &
            pids+=("$!")
          done

          status=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "failed to push ${names[$i]}:$remote_tag" >&2
              status=1
            fi
          done
          exit "$status"

  server-deploy:
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server deployment assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            source_ref="$GITHUB_REF_NAME"
            image_tag="$GITHUB_REF_NAME"
            release_channel="stable"
            release_commit=""
          else
            source_ref="$GITHUB_SHA"
            image_tag="sha-${GITHUB_SHA::12}"
            release_channel="master"
            release_commit="$GITHUB_SHA"
          fi
          sed \
            -e "s|@SOURCE_REF@|$source_ref|g" \
            -e "s|@IMAGE_TAG@|$image_tag|g" \
            -e "s|@IMAGE_REGISTRY@|ghcr.io/$GITHUB_REPOSITORY_OWNER|g" \
            -e "s|@RELEASE_CHANNEL@|$release_channel|g" \
            -e "s|@RELEASE_COMMIT@|$release_commit|g" \
            deploy/install-server.sh > release/xdrive-server-install.sh
          chmod +x release/xdrive-server-install.sh
          cp deploy/docker-compose.yml release/docker-compose.yml
          cp deploy/Caddyfile release/Caddyfile
          cp deploy/.env.example release/xdrive.env.example
          cp scripts/server-backup.sh scripts/server-backup-scheduled.sh scripts/server-restore.sh scripts/server-verify.sh scripts/server-doctor.sh release/
          cp scripts/xdrive-server-host.sh release/xdrive-server
          chmod +x release/server-backup.sh release/server-backup-scheduled.sh release/server-restore.sh release/server-verify.sh release/server-doctor.sh release/xdrive-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-deploy
          path: release/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    if: inputs.publish
    needs: [verify-client-artifacts, server-images, server-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download exact Linux installer tested by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-linux-amd64
          path: release
      - name: Download exact Windows installer tested by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-windows-amd64
          path: release
      - name: Download exact Synology source-agent binaries
        uses: actions/download-artifact@v4
        with:
          name: xdrive-source-agent-linux
          path: release
      - name: Download server deployment assets
        uses: actions/download-artifact@v4
        with:
          name: server-deploy
          path: release
      - name: Verify single-installer distribution contract
        shell: bash
        run: |
          set -euo pipefail
          test -f release/xdrive-linux-amd64.deb
          test -f release/xDriveSetup-amd64.exe
          test -f release/xdrive-source-agent-linux-amd64
          test -f release/xdrive-source-agent-linux-arm64
          if find release -maxdepth 1 -type f \( -name '*DesktopSetup*' -o -name 'xdrive-desktop-*' \) | grep -q .; then
            echo "standalone Desktop installer must not be published" >&2
            exit 1
          fi
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum \
            xdrive-linux-amd64.deb \
            xDriveSetup-amd64.exe \
            xdrive-source-agent-linux-amd64 \
            xdrive-source-agent-linux-arm64 \
            xdrive-server-install.sh \
            server-backup.sh \
            server-backup-scheduled.sh \
            server-restore.sh \
            server-verify.sh \
            server-doctor.sh \
            xdrive-server \
            docker-compose.yml \
            Caddyfile \
            xdrive.env.example > SHA256SUMS.txt
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for channel promotion
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote successful server images
        shell: bash
        run: |
          set -euo pipefail
          owner="$GITHUB_REPOSITORY_OWNER"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            source_tag="$GITHUB_REF_NAME"
            target_tag="latest"
          else
            source_tag="sha-${GITHUB_SHA::12}"
            target_tag="edge"
          fi
          for image in xdrive-server xdrive-web xdrive-caddy; do
            docker buildx imagetools create \
              --tag "ghcr.io/$owner/$image:$target_tag" \
              "ghcr.io/$owner/$image:$source_tag"
          done
      - name: Publish immutable master snapshot
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="snapshot-${GITHUB_SHA::12}"
          if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
            [[ "$existing" == "$GITHUB_SHA" ]] || {
              echo "$tag already points to $existing, refusing to overwrite immutable snapshot." >&2
              exit 1
            }
          else
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [[ -n "$asset" ]] && gh release delete-asset "$tag" "$asset" --repo "$repo" -y
            done < <(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')
            gh release upload "$tag" release/* --repo "$repo"
            gh release edit "$tag" --repo "$repo" --prerelease \
              --title "xDrive snapshot ${GITHUB_SHA::12}" \
              --notes "Immutable successful master snapshot at `$GITHUB_SHA`."
          else
            gh release create "$tag" release/* --repo "$repo" --prerelease \
              --title "xDrive snapshot ${GITHUB_SHA::12}" \
              --notes "Immutable successful master snapshot at `$GITHUB_SHA`."
          fi
      - name: Prune old immutable master snapshots
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          keep_recent=50
          daily_days=30
          releases_json="$(mktemp)"
          trap 'rm -f "$releases_json"' EXIT

          gh release list --repo "$repo" --limit 1000 --json tagName,publishedAt > "$releases_json"
          delete_tags="$(
            KEEP_RECENT="$keep_recent" DAILY_DAYS="$daily_days" RELEASES_JSON="$releases_json" python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re

          keep_recent = int(os.environ["KEEP_RECENT"])
          daily_days = int(os.environ["DAILY_DAYS"])
          now = dt.datetime.now(dt.timezone.utc)
          cutoff = now - dt.timedelta(days=daily_days)
          pattern = re.compile(r"^snapshot-[0-9a-fA-F]{12}$")

          with open(os.environ["RELEASES_JSON"], encoding="utf-8") as handle:
              releases = json.load(handle)

          items = []
          unknown = set()
          for release in releases:
              tag = str(release.get("tagName") or "")
              if not pattern.fullmatch(tag):
                  continue
              raw = release.get("publishedAt")
              if not raw:
                  unknown.add(tag)
                  continue
              try:
                  published = dt.datetime.fromisoformat(str(raw).replace("Z", "+00:00")).astimezone(dt.timezone.utc)
              except ValueError:
                  unknown.add(tag)
                  continue
              items.append((published, tag))

          items.sort(reverse=True)
          keep = set(unknown)
          keep.update(tag for _, tag in items[:keep_recent])

          daily_kept = set()
          for published, tag in items[keep_recent:]:
              if published > now:
                  keep.add(tag)
                  continue
              if published < cutoff:
                  continue
              day = published.date()
              if day not in daily_kept:
                  daily_kept.add(day)
                  keep.add(tag)

          for _, tag in items:
              if tag not in keep:
                  print(tag)
          PY
          )"

          if [[ -z "$delete_tags" ]]; then
            echo "No immutable snapshots need pruning."
            exit 0
          fi

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            echo "Pruning immutable snapshot: $tag"
            if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$repo" -y
            fi
            if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$repo/git/refs/tags/$tag" >/dev/null
            fi
          done <<< "$delete_tags"

      - name: Publish rolling snapshot prerelease
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if gh api "repos/$repo/git/ref/tags/snapshot" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$repo/git/refs/tags/snapshot" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$repo/git/refs" -f ref='refs/tags/snapshot' -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view snapshot --repo "$repo" >/dev/null 2>&1; then
            gh release delete snapshot --repo "$repo" -y
          fi
          gh release create snapshot release/* --repo "$repo" --prerelease \
            --title "xDrive snapshot ${GITHUB_SHA::12}" \
            --notes "Rolling development snapshot from master at `$GITHUB_SHA`. The exact CI-tested installers are published without rebuilding."
      - name: Assert distribution assets are not archive-wrapped
        shell: bash
        run: |
          set -euo pipefail
          if find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) | grep -q .; then
            echo "single-file installers/scripts must be published directly, not archive-wrapped" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "xDrive $GITHUB_REF_NAME"
