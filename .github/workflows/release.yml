name: Build Packages

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  client-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build Linux client installer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="snapshot-${GITHUB_SHA::7}"
          fi
          bash scripts/build-linux-deb.sh "$version" release
      - uses: actions/upload-artifact@v4
        with:
          name: client-linux-amd64
          path: release/xdrive-client-linux-amd64.deb
          if-no-files-found: error
          retention-days: 14

  client-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Test Windows CfAPI packages
        run: go test ./internal/...
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows client installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "snapshot-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          ./scripts/build-windows-installer.ps1 -Version $version -OutputDir release
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-amd64
          path: release/xDriveSetup-amd64.exe
          if-no-files-found: error
          retention-days: 14

  server-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: xdrive-server
            context: .
            dockerfile: ./Dockerfile
          - image: xdrive-web
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image }}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
            tags="$image:$GITHUB_REF_NAME"$'\n'"$image:latest"
          else
            version="snapshot-${GITHUB_SHA::7}"
            tags="$image:edge"$'\n'"$image:sha-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

  server-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server deployment assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            source_ref="$GITHUB_REF_NAME"
            image_tag="$GITHUB_REF_NAME"
          else
            source_ref="$GITHUB_SHA"
            image_tag="edge"
          fi
          sed -e "s|@SOURCE_REF@|$source_ref|g" -e "s|@IMAGE_TAG@|$image_tag|g" \
            deploy/install-server.sh > release/xdrive-server-install.sh
          chmod +x release/xdrive-server-install.sh
          cp deploy/docker-compose.yml release/docker-compose.yml
          cp deploy/.env.example release/xdrive.env.example
      - uses: actions/upload-artifact@v4
        with:
          name: server-deploy
          path: release/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    needs: [client-linux-amd64, client-windows-amd64, server-images, server-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux client installer
        uses: actions/download-artifact@v4
        with:
          name: client-linux-amd64
          path: release
      - name: Download Windows client installer
        uses: actions/download-artifact@v4
        with:
          name: client-windows-amd64
          path: release
      - name: Download server deployment assets
        uses: actions/download-artifact@v4
        with:
          name: server-deploy
          path: release
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum \
            xdrive-client-linux-amd64.deb \
            xDriveSetup-amd64.exe \
            xdrive-server-install.sh \
            docker-compose.yml \
            xdrive.env.example > SHA256SUMS.txt
      - name: Upload combined snapshot
        uses: actions/upload-artifact@v4
        with:
          name: xdrive-${{ github.ref_type == 'tag' && github.ref_name || format('snapshot-{0}', github.sha) }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "xDrive $GITHUB_REF_NAME"
