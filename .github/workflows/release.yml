name: Publish Packages

on:
  workflow_call:
    inputs:
      publish:
        description: Publish exact CI-produced server images and release assets. Stable tags call this after the full gate; master snapshots call it as soon as publishable artifacts exist.
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  verify-client-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Linux installer produced by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-linux-amd64
          path: exact
      - name: Download exact Windows installer produced by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-windows-amd64
          path: exact
      - name: Download exact Synology source-agent binaries produced by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-source-agent-linux
          path: source-agent
      - name: Download exact CLI-only backup archives produced by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-backup-cli
          path: backup-cli
      - name: Verify exact client artifact contract
        shell: bash
        run: |
          set -euo pipefail
          test -f exact/xdrive-linux-amd64.deb
          test -f exact/xDriveSetup-amd64.exe
          count="$(find exact -maxdepth 1 -type f | wc -l)"
          [[ "$count" == "2" ]] || {
            echo "expected exactly two user-facing client installers; found $count" >&2
            find exact -maxdepth 1 -type f -print >&2
            exit 1
          }
          test -f source-agent/xdrive-source-agent-linux-amd64
          test -f source-agent/xdrive-source-agent-linux-arm64
          test -s backup-cli/xdrive-backup-linux-amd64.tar.gz
          test -s backup-cli/xdrive-backup-windows-amd64.zip
          cli_count="$(find backup-cli -maxdepth 1 -type f | wc -l)"
          [[ "$cli_count" == "2" ]] || {
            echo "expected exactly two standalone Backup CLI archives; found $cli_count" >&2
            exit 1
          }
          source_count="$(find source-agent -maxdepth 1 -type f | wc -l)"
          [[ "$source_count" == "2" ]] || {
            echo "expected exactly two source-agent binaries; found $source_count" >&2
            find source-agent -maxdepth 1 -type f -print >&2
            exit 1
          }

  server-images:
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download exact images produced by CI
        uses: actions/download-artifact@v4
        with:
          pattern: xdrive-*-image
          path: dist
      - name: Load and verify exact CI-produced images
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh

          load_exact() {
            local artifact="$1"
            local image="$2"
            bash scripts/ci/import-docker-image.sh "dist/$artifact" "$image"
            local image_version
            image_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")"
            [[ "$image_version" == "$XDRIVE_RELEASE_VERSION" ]] || {
              echo "exact image version label mismatch: got $image_version want $XDRIVE_RELEASE_VERSION for $image" >&2
              exit 1
            }
          }

          load_exact xdrive-server-image xdrive/server:test
          load_exact xdrive-caddy-image xdrive/caddy:test
          load_exact xdrive-photo-face-image xdrive/photo-face:test
          load_exact xdrive-media-worker-image xdrive/media-worker:test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exact CI-produced images in parallel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            remote_tag="$GITHUB_REF_NAME"
          else
            remote_tag="sha-${GITHUB_SHA::12}"
          fi

          names=(xdrive-server xdrive-caddy xdrive-photo-face xdrive-media-worker)
          locals=(xdrive/server:test xdrive/caddy:test xdrive/photo-face:test xdrive/media-worker:test)
          pids=()

          for i in "${!names[@]}"; do
            remote="ghcr.io/$GITHUB_REPOSITORY_OWNER/${names[$i]}:$remote_tag"
            docker tag "${locals[$i]}" "$remote"
            docker push "$remote" &
            pids+=("$!")
          done

          status=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "failed to push ${names[$i]}:$remote_tag" >&2
              status=1
            fi
          done
          exit "$status"

  server-deploy:
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server deployment assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            source_ref="$GITHUB_REF_NAME"
            image_tag="$GITHUB_REF_NAME"
            release_channel="stable"
            release_commit=""
          else
            source_ref="$GITHUB_SHA"
            image_tag="sha-${GITHUB_SHA::12}"
            release_channel="master"
            release_commit="$GITHUB_SHA"
          fi
          # Hash every raw GitHub file that the signed installer subsequently
          # stages. The manifest is embedded in the installer itself, whose
          # digest is then attested by the existing Sigstore Release workflow.
          deploy_hash_manifest="$RUNNER_TEMP/xdrive-deploy-assets.sha256"
          sha256sum \
            deploy/docker-compose.yml \
            scripts/server-backup.sh \
            scripts/server-backup-scheduled.sh \
            scripts/server-restore.sh \
            scripts/server-verify.sh \
            scripts/server-doctor.sh \
            scripts/server-migrate-user.sh \
            scripts/server-control.sh \
            scripts/caddy-env-config.py \
            scripts/caddy-admission.py \
            scripts/xdrive-server-host.sh > "$deploy_hash_manifest"
          deploy_hash_manifest_b64="$(base64 -w0 "$deploy_hash_manifest")"
          sed \
            -e "s|@DEPLOY_ASSET_MANIFEST_B64@|$deploy_hash_manifest_b64|g" \
            -e "s|@SOURCE_REF@|$source_ref|g" \
            -e "s|@IMAGE_TAG@|$image_tag|g" \
            -e "s|@IMAGE_REGISTRY@|ghcr.io/$GITHUB_REPOSITORY_OWNER|g" \
            -e "s|@RELEASE_CHANNEL@|$release_channel|g" \
            -e "s|@RELEASE_COMMIT@|$release_commit|g" \
            -e "s|@UPDATE_SOURCE@|github|g" \
            deploy/install-server.sh > release/xdrive-server-install.sh
          chmod +x release/xdrive-server-install.sh
          if grep -q '@DEPLOY_ASSET_MANIFEST_B64@' release/xdrive-server-install.sh; then
            echo "Release installer lacks embedded deployment asset manifest" >&2
            exit 1
          fi
          cp deploy/docker-compose.yml release/docker-compose.yml
          cp deploy/.env.example release/xdrive.env.example
          cp scripts/server-backup.sh scripts/server-backup-scheduled.sh scripts/server-restore.sh scripts/server-verify.sh scripts/server-doctor.sh scripts/server-migrate-user.sh release/
          cp scripts/xdrive-server-host.sh release/xdrive-server
          chmod +x release/server-backup.sh release/server-backup-scheduled.sh release/server-restore.sh release/server-verify.sh release/server-doctor.sh release/server-migrate-user.sh release/xdrive-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-deploy
          path: release/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    if: inputs.publish
    needs: [verify-client-artifacts, server-images, server-deploy]
    runs-on: ubuntu-latest
    # Master builds run independently, but floating edge/Snapshot promotion
    # must be serialized. queue:max preserves every pending publisher.
    concurrency:
      group: xdrive-release-promote-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact Linux installer produced by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-linux-amd64
          path: release
      - name: Download exact Windows installer produced by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-windows-amd64
          path: release
      - name: Download exact Synology source-agent binaries
        uses: actions/download-artifact@v4
        with:
          name: xdrive-source-agent-linux
          path: release
      - name: Download exact CLI-only backup archives
        uses: actions/download-artifact@v4
        with:
          name: xdrive-backup-cli
          path: release
      - name: Download server deployment assets
        uses: actions/download-artifact@v4
        with:
          name: server-deploy
          path: release
      - name: Verify single-installer distribution contract
        shell: bash
        run: |
          set -euo pipefail
          test -f release/xdrive-linux-amd64.deb
          test -f release/xDriveSetup-amd64.exe
          test -f release/xdrive-source-agent-linux-amd64
          test -f release/xdrive-source-agent-linux-arm64
          test -s release/xdrive-backup-linux-amd64.tar.gz
          test -s release/xdrive-backup-windows-amd64.zip
          if find release -maxdepth 1 -type f \( -name '*DesktopSetup*' -o -name 'xdrive-desktop-*' \) | grep -q .; then
            echo "standalone Desktop installer must not be published" >&2
            exit 1
          fi
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum \
            xdrive-linux-amd64.deb \
            xDriveSetup-amd64.exe \
            xdrive-source-agent-linux-amd64 \
            xdrive-source-agent-linux-arm64 \
            xdrive-backup-linux-amd64.tar.gz \
            xdrive-backup-windows-amd64.zip \
            xdrive-server-install.sh \
            server-backup.sh \
            server-backup-scheduled.sh \
            server-restore.sh \
            server-verify.sh \
            server-doctor.sh \
            server-migrate-user.sh \
            xdrive-server \
            docker-compose.yml \
            xdrive.env.example > SHA256SUMS.txt
      # Sigstore signs both file digests and the immutable OIDC workflow identity.
      - name: Attest release installer and checksum manifest
        id: release_attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            release/xdrive-server-install.sh
            release/SHA256SUMS.txt
      - name: Publish independent release provenance bundle
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.release_attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" release/xdrive-release-attestation.json
      - name: Cryptographically verify signed bundle before releasing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_args=(
            --repo "$GITHUB_REPOSITORY"
            --bundle release/xdrive-release-attestation.json
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            --source-ref "$GITHUB_REF"
            --deny-self-hosted-runners
          )
          gh attestation verify release/xdrive-server-install.sh "${verify_args[@]}"
          gh attestation verify release/SHA256SUMS.txt "${verify_args[@]}"
      - name: Reject stale master snapshot before channel promotion
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Build completion order differs from commit order. Reject an old
          # finished build BEFORE it changes floating GHCR edge image tags.
          # This project has a snapshot tag; an unreadable tag fails closed.
          published="$(gh api "repos/$repo/git/ref/tags/snapshot" --jq '.object.sha')"
          [[ "$published" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Snapshot tag is unavailable or is not a commit; refusing channel promotion." >&2
            exit 1
          }
          relation="$(gh api "repos/$repo/compare/$published...$GITHUB_SHA" --jq '.status')"
          case "$relation" in
            ahead|identical) ;;
            *) echo "Refusing stale Snapshot promotion before channel update: $relation" >&2; exit 1 ;;
          esac
      - name: Log in to GHCR for channel promotion
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote successful server images
        shell: bash
        run: |
          set -euo pipefail
          owner="$GITHUB_REPOSITORY_OWNER"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            source_tag="$GITHUB_REF_NAME"
            target_tag="latest"
          else
            source_tag="sha-${GITHUB_SHA::12}"
            target_tag="edge"
          fi
          for image in xdrive-server xdrive-caddy xdrive-photo-face xdrive-media-worker; do
            docker buildx imagetools create \
              --tag "ghcr.io/$owner/$image:$target_tag" \
              "ghcr.io/$owner/$image:$source_tag"
          done
      - name: Publish rolling snapshot prerelease
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          title="xDrive snapshot $(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          notes="$(printf 'Rolling development snapshot from master at \x60%s\x60. Exact CI-produced artifacts are published without rebuilding; full master CI continues independently.' "$GITHUB_SHA")"
          previous_snapshot=""

          # Retain the previous public Release while replacing rolling assets.
          # The installer/manifest/signature checks still protect each partial
          # asset-replacement window; multi-asset GitHub uploads are not atomic.
          if gh release view snapshot --repo "$repo" >/dev/null 2>&1; then
            previous_snapshot="$(gh api "repos/$repo/git/ref/tags/snapshot" --jq '.object.sha')"
            [[ "$previous_snapshot" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "Snapshot tag is not a commit; refusing publication." >&2
              exit 1
            }
            ancestry="$(gh api "repos/$repo/compare/$previous_snapshot...$GITHUB_SHA" --jq '.status')"
            case "$ancestry" in
              ahead|identical) ;;
              *) echo "Refusing stale or diverged Snapshot publication: $ancestry" >&2; exit 1 ;;
            esac
            gh release upload snapshot release/* --repo "$repo" --clobber
          else
            # On initial creation there is no previous Release to preserve.
            gh release create snapshot release/* --repo "$repo" --prerelease \
              --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi

          # Never advertise a tag until every remote asset actually has the
          # expected SHA-256 and no old or unexpected asset remains.
          expected_names="$(for path in release/*; do basename "$path"; done | LC_ALL=C sort)"
          remote_complete=0
          for check_attempt in 1 2 3 4 5; do
            release_json="$(gh api "repos/$repo/releases/tags/snapshot")"
            actual_names="$(jq -r '.assets[].name' <<< "$release_json" | LC_ALL=C sort)"
            if [[ "$actual_names" == "$expected_names" ]]; then
              digest_mismatch=0
              for path in release/*; do
                name="$(basename "$path")"
                expected_digest="sha256:$(sha256sum "$path" | awk '{print $1}')"
                actual_digest="$(jq -r --arg n "$name" '[.assets[] | select(.name == $n) | .digest] | if length == 1 then .[0] else empty end' <<< "$release_json")"
                if [[ "$actual_digest" != "$expected_digest" ]]; then
                  digest_mismatch=1
                  break
                fi
              done
              if [[ "$digest_mismatch" == 0 ]]; then
                remote_complete=1
                break
              fi
            fi
            if [[ "$check_attempt" -lt 5 ]]; then
              echo "[xDrive] remote Snapshot digests not yet consistent ($check_attempt/5); retrying..." >&2
              sleep 2
            fi
          done
          if [[ "$remote_complete" != 1 ]]; then
            echo "Snapshot asset verification incomplete; preserving previous tag." >&2
            exit 1
          fi
          echo "[xDrive] all published Snapshot asset SHA-256 digests verified."

          # Re-read the floating ref so a superseding publisher is never
          # silently overwritten by an older delayed CI run.
          if [[ -n "$previous_snapshot" ]]; then
            current_tag="$(gh api "repos/$repo/git/ref/tags/snapshot" --jq '.object.sha')"
            [[ "$current_tag" == "$previous_snapshot" ]] || {
              echo "Snapshot tag changed while assets were uploaded; refusing stale promotion." >&2
              exit 1
            }
            gh api --method PATCH "repos/$repo/git/refs/tags/snapshot" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi
          gh release edit snapshot --repo "$repo" --prerelease --title "$title" --notes "$notes"

          # Remove legacy immutable snapshot-<sha> releases/tags from the previous policy.
          mapfile -t legacy_snapshot_releases < <(
            gh api --paginate "repos/$repo/releases?per_page=100" \
              --jq '.[] | "\(.id)|\(.tag_name)"'
          )
          for row in "${legacy_snapshot_releases[@]}"; do
            release_id="${row%%|*}"
            tag="${row#*|}"
            [[ "$tag" =~ ^snapshot-[0-9a-fA-F]{7,40}$ ]] || continue
            echo "Deleting legacy snapshot release: $tag"
            gh api --method DELETE "repos/$repo/releases/$release_id" >/dev/null
          done

          mapfile -t legacy_snapshot_refs < <(
            gh api --paginate "repos/$repo/git/matching-refs/tags/snapshot-" --jq '.[].ref'
          )
          for ref in "${legacy_snapshot_refs[@]}"; do
            tag="${ref#refs/tags/}"
            [[ "$tag" =~ ^snapshot-[0-9a-fA-F]{7,40}$ ]] || continue
            echo "Deleting legacy snapshot tag: $tag"
            gh api --method DELETE "repos/$repo/git/refs/tags/$tag" >/dev/null
          done
      - name: Assert distribution assets are not archive-wrapped
        shell: bash
        run: |
          set -euo pipefail
          if find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) | grep -q .; then
            echo "single-file installers/scripts must be published directly, not archive-wrapped" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "xDrive $GITHUB_REF_NAME"
