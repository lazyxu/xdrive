name: Publish Packages

on:
  workflow_call:
    inputs:
      publish:
        description: Publish server images and release assets after exact client artifacts are verified.
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  verify-client-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Linux installer tested by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-linux-amd64
          path: exact
      - name: Download exact Windows installer tested by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-windows-amd64
          path: exact
      - name: Download exact Synology source-agent binaries tested by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-source-agent-linux
          path: source-agent
      - name: Verify exact client artifact contract
        shell: bash
        run: |
          set -euo pipefail
          test -f exact/xdrive-linux-amd64.deb
          test -f exact/xDriveSetup-amd64.exe
          count="$(find exact -maxdepth 1 -type f | wc -l)"
          [[ "$count" == "2" ]] || {
            echo "expected exactly two user-facing client installers; found $count" >&2
            find exact -maxdepth 1 -type f -print >&2
            exit 1
          }
          test -f source-agent/xdrive-source-agent-linux-amd64
          test -f source-agent/xdrive-source-agent-linux-arm64
          source_count="$(find source-agent -maxdepth 1 -type f | wc -l)"
          [[ "$source_count" == "2" ]] || {
            echo "expected exactly two source-agent binaries; found $source_count" >&2
            find source-agent -maxdepth 1 -type f -print >&2
            exit 1
          }

  server-images:
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: xdrive-server
            context: .
            dockerfile: ./Dockerfile
          - image: xdrive-web
            context: .
            dockerfile: ./web/Dockerfile
          - image: xdrive-caddy
            context: .
            dockerfile: ./deploy/Caddy.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY_OWNER/${{ matrix.image }}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
            tags="$image:$GITHUB_REF_NAME"
          else
            version="snapshot-${GITHUB_SHA::12}"
            tags="$image:sha-${GITHUB_SHA::12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

  server-deploy:
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server deployment assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            source_ref="$GITHUB_REF_NAME"
            image_tag="$GITHUB_REF_NAME"
            release_channel="stable"
            release_commit=""
          else
            source_ref="$GITHUB_SHA"
            image_tag="sha-${GITHUB_SHA::12}"
            release_channel="master"
            release_commit="$GITHUB_SHA"
          fi
          sed \
            -e "s|@SOURCE_REF@|$source_ref|g" \
            -e "s|@IMAGE_TAG@|$image_tag|g" \
            -e "s|@IMAGE_REGISTRY@|ghcr.io/$GITHUB_REPOSITORY_OWNER|g" \
            -e "s|@RELEASE_CHANNEL@|$release_channel|g" \
            -e "s|@RELEASE_COMMIT@|$release_commit|g" \
            deploy/install-server.sh > release/xdrive-server-install.sh
          chmod +x release/xdrive-server-install.sh
          cp deploy/docker-compose.yml release/docker-compose.yml
          cp deploy/Caddyfile release/Caddyfile
          cp deploy/.env.example release/xdrive.env.example
          cp scripts/server-backup.sh scripts/server-backup-scheduled.sh scripts/server-restore.sh scripts/server-verify.sh scripts/server-doctor.sh release/
          cp scripts/xdrive-server-host.sh release/xdrive-server
          chmod +x release/server-backup.sh release/server-backup-scheduled.sh release/server-restore.sh release/server-verify.sh release/server-doctor.sh release/xdrive-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-deploy
          path: release/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    if: inputs.publish
    needs: [verify-client-artifacts, server-images, server-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download exact Linux installer tested by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-linux-amd64
          path: release
      - name: Download exact Windows installer tested by CI
        uses: actions/download-artifact@v4
        with:
          name: xdrive-windows-amd64
          path: release
      - name: Download exact Synology source-agent binaries
        uses: actions/download-artifact@v4
        with:
          name: xdrive-source-agent-linux
          path: release
      - name: Download server deployment assets
        uses: actions/download-artifact@v4
        with:
          name: server-deploy
          path: release
      - name: Verify single-installer distribution contract
        shell: bash
        run: |
          set -euo pipefail
          test -f release/xdrive-linux-amd64.deb
          test -f release/xDriveSetup-amd64.exe
          test -f release/xdrive-source-agent-linux-amd64
          test -f release/xdrive-source-agent-linux-arm64
          if find release -maxdepth 1 -type f \( -name '*DesktopSetup*' -o -name 'xdrive-desktop-*' \) | grep -q .; then
            echo "standalone Desktop installer must not be published" >&2
            exit 1
          fi
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum \
            xdrive-linux-amd64.deb \
            xDriveSetup-amd64.exe \
            xdrive-source-agent-linux-amd64 \
            xdrive-source-agent-linux-arm64 \
            xdrive-server-install.sh \
            server-backup.sh \
            server-backup-scheduled.sh \
            server-restore.sh \
            server-verify.sh \
            server-doctor.sh \
            xdrive-server \
            docker-compose.yml \
            Caddyfile \
            xdrive.env.example > SHA256SUMS.txt
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for channel promotion
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote successful server images
        shell: bash
        run: |
          set -euo pipefail
          owner="$GITHUB_REPOSITORY_OWNER"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            source_tag="$GITHUB_REF_NAME"
            target_tag="latest"
          else
            source_tag="sha-${GITHUB_SHA::12}"
            target_tag="edge"
          fi
          for image in xdrive-server xdrive-web xdrive-caddy; do
            docker buildx imagetools create \
              --tag "ghcr.io/$owner/$image:$target_tag" \
              "ghcr.io/$owner/$image:$source_tag"
          done
      - name: Publish immutable master snapshot
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="snapshot-${GITHUB_SHA::12}"
          if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
            [[ "$existing" == "$GITHUB_SHA" ]] || {
              echo "$tag already points to $existing, refusing to overwrite immutable snapshot." >&2
              exit 1
            }
          else
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [[ -n "$asset" ]] && gh release delete-asset "$tag" "$asset" --repo "$repo" -y
            done < <(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')
            gh release upload "$tag" release/* --repo "$repo"
            gh release edit "$tag" --repo "$repo" --prerelease \
              --title "xDrive snapshot ${GITHUB_SHA::12}" \
              --notes "Immutable successful master snapshot at `$GITHUB_SHA`."
          else
            gh release create "$tag" release/* --repo "$repo" --prerelease \
              --title "xDrive snapshot ${GITHUB_SHA::12}" \
              --notes "Immutable successful master snapshot at `$GITHUB_SHA`."
          fi
      - name: Publish rolling snapshot prerelease
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if gh api "repos/$repo/git/ref/tags/snapshot" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$repo/git/refs/tags/snapshot" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$repo/git/refs" -f ref='refs/tags/snapshot' -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view snapshot --repo "$repo" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [[ -n "$asset" ]] && gh release delete-asset snapshot "$asset" --repo "$repo" -y
            done < <(gh release view snapshot --repo "$repo" --json assets --jq '.assets[].name')
            gh release upload snapshot release/* --repo "$repo"
            gh release edit snapshot --repo "$repo" --prerelease \
              --title "xDrive snapshot ${GITHUB_SHA::12}" \
              --notes "Rolling development snapshot from master at `$GITHUB_SHA`. The exact CI-tested installers are published without rebuilding."
          else
            gh release create snapshot release/* --repo "$repo" --prerelease \
              --title "xDrive snapshot ${GITHUB_SHA::12}" \
              --notes "Rolling development snapshot from master at `$GITHUB_SHA`. The exact CI-tested installers are published without rebuilding."
          fi
      - name: Assert distribution assets are not archive-wrapped
        shell: bash
        run: |
          set -euo pipefail
          if find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) | grep -q .; then
            echo "single-file installers/scripts must be published directly, not archive-wrapped" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "xDrive $GITHUB_REF_NAME"
