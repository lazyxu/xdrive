name: PWA P1-B1 Real Chromium IndexedDB Isolation
on:
  pull_request:
    branches: [master, feat/pwa-p1b0-durable-instance-scope-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwa-p1b1-real-idb:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/pwa-p1b1-optin-directory-capture-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact Web dependency tree and isolated native Chromium driver
        run: |
          set -euo pipefail
          npm --prefix web ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/xdrive-pwa-p1b1-driver"
          npm install --prefix "$RUNNER_TEMP/xdrive-pwa-p1b1-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          if command -v google-chrome-stable >/dev/null; then
            echo "XD_PWA_P1B_BROWSER=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XD_PWA_P1B_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XD_PWA_P1B_BROWSER=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Real Chrome/Chromium missing" >&2
            exit 1
          fi
      - name: Source, projection and Web TypeScript checks
        run: |
          set -euo pipefail
          node --check desktop/scripts/pwa-p1b1-real-idb.cjs
          node web/scripts/test-pwa-offline-directory.cjs
          npm --prefix web run lint
      - name: Run real Chromium secure-origin IDB privacy and offline regression
        env:
          XDRIVE_BROWSER_EXECUTABLE: ${{ env.XD_PWA_P1B_BROWSER }}
          XDRIVE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/xdrive-pwa-p1b1-driver/node_modules/playwright-core
        run: |
          set -euo pipefail
          export XD_PR_HEAD="$(git rev-parse HEAD)"
          test "$XD_PR_HEAD" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node desktop/scripts/pwa-p1b1-real-idb.cjs
