name: Places iOS27 Trusted Map Photo Strip

on:
  pull_request:
    branches:
      - master
      - feat/places-ios27-mobile-map-list-20261023
    # Only feature-specific evidence files should wake this heavyweight workflow.
    paths:
      - 'desktop/tests/gallery-places-ios27-camera-filmstrip.cjs'

permissions:
  contents: read

concurrency:
  group: places-ios27-photo-strip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  places-ios27-photo-strip:
    if: github.head_ref == 'feat/places-ios27-current-cell-strip-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shared Gallery/Desktop test dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Verify exact HEAD and compile current-photo strip source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node --check desktop/tests/gallery-places-ios27-camera-filmstrip.cjs
      - name: Test bounded 100k Owner cells, wrong-camera projections and original Range/Viewer
        working-directory: desktop
        run: node --test tests/gallery-places-ios27-camera-filmstrip.cjs
      - name: Typecheck shared Desktop and trusted map contracts
        working-directory: desktop
        run: npm run typecheck
