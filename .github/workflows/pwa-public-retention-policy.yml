name: PWA Public Hashed Asset Retention Capacity Policy Contract
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  pwa-public-retention-policy:
    if: github.head_ref == 'docs/pwa-public-retention-policy-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed code and documented retain-all policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node --test desktop/tests/pwa-public-retention-policy.cjs
          node --test desktop/tests/pwa-archive-audit.cjs
          node --test desktop/tests/pwa-archive-reference-audit.cjs
