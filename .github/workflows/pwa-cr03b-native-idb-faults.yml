name: PWA CR03b Real Chromium IDB Abort Blocked and Quota Diagnostic
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  native-idb-transaction-failure:
    if: github.head_ref == 'test/pwa-cr03b-native-idb-faults-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build actual production Web and isolated native Chromium driver
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/pwa-cr03b-driver"
          npm install --prefix "$RUNNER_TEMP/pwa-cr03b-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          echo "XDRIVE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/pwa-cr03b-driver/node_modules/playwright-core" >> "$GITHUB_ENV"
          if command -v google-chrome-stable >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "native Chromium is mandatory" >&2
            exit 1
          fi
      - name: Fail closed on source and stale public cache regressions
        run: |
          set -euo pipefail
          node --check desktop/scripts/pwa-cr03b-native-idb-faults.cjs
          node --test desktop/tests/pwa-cr03b-native-idb-faults-source.cjs
          node web/scripts/test-pwa-offline-directory.cjs
          node web/scripts/test-pwa-offline-albums.cjs
          npm --prefix web run build
      - name: Native Chrome quota diagnostic, true aborted transaction and blocked upgrade
        env:
          XD_PWA_CR03B_REAL_CHROME: '1'
          XD_PWA_CR03B_OUTPUT: ${{ github.workspace }}/desktop/pwa-cr03b-results
        run: |
          set -euo pipefail
          export XD_PR_HEAD="$(git rev-parse HEAD)"
          test "$XD_PR_HEAD" = "${{ github.event.pull_request.head.sha }}"
          node desktop/scripts/pwa-cr03b-native-idb-faults.cjs
          node -e "const a=require(process.cwd()+'/desktop/pwa-cr03b-results/summary.json');const quotaPassed=a.realQuotaExceeded&&a.nativeQuotaProbeAborted&&a.nativeQuotaProbeError==='QuotaExceededError'&&a.productCaptureRejected&&a.productFailClosedOnQuota;const quotaUnavailable=a.quotaEnforcementUnavailable&&a.nativeQuotaProbeAttempts===4&&!a.nativeQuotaProbeAborted&&!a.realQuotaExceeded&&!a.productCaptureRejected&&!a.productFailClosedOnQuota;if(!a.passed||a.sourceSha!==process.env.XD_PR_HEAD||!a.actualChromium||!a.publicSW||!a.realIndexedDB||!a.nativeQuotaOverride||!a.quotaDiagnosticCompleted||!a.quotaProbeCleanupCompleted||!(quotaPassed||quotaUnavailable)||!a.nativeTransactionAborted||!a.priorSnapshotUnaffected||!a.nativeUpgradeBlocked||!a.productionFutureVersionRejected||!a.privateCacheAbsent||a.realGoOwnerACL||a.realIOS||a.performanceAfter)process.exit(1);console.log('PWA_CR03B_NATIVE_ABORT_BLOCKED_PASS quota_proven='+quotaPassed+' quota_unverified='+quotaUnavailable)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-cr03b-anonymous-idb-quota-abort-blocked
          path: desktop/pwa-cr03b-results/summary.json
          if-no-files-found: warn
          retention-days: 14
