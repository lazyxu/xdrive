name: Cleanup refresh branches

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cleanup-refresh-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary refresh branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "refresh/tray-transfer-summary"
            "refresh/taskbar-status-attention"
          )
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            if gh api -H "Accept: application/vnd.github+json" "repos/$REPO/git/ref/heads/$encoded" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api --method DELETE -H "Accept: application/vnd.github+json" "repos/$REPO/git/refs/heads/$encoded"
            else
              echo "Already absent: $branch"
            fi
          done
