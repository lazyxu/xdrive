          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Benchmark 100k Gallery entries BEFORE and AFTER on same runner
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/gallery-entry-perf-results"
          mkdir -p "$results"
          before="$RUNNER_TEMP/gallery-entry-before"
          git worktree add --detach "$before" HEAD^
          cp internal/api/gallery_entry_performance_integration_test.go "$before/internal/api/gallery_entry_performance_integration_test.go"
          echo "=== BEFORE: $(git rev-parse HEAD^) ==="
          if ! (cd "$before" && XD_GALLERY_ENTRY_LEGACY_BEFORE=1 go test -run '^TestGalleryEntryEndpointsPerformance100K$' -count=1 -timeout=25m -v ./internal/api) > "$results/before.log" 2>&1; then
            tail -n 45 "$results/before.log"
            exit 1
          fi
          grep 'GALLERY_ENTRY_NATIVE_100K {' "$results/before.log" | tail -n 1 | sed 's/^.*GALLERY_ENTRY_NATIVE_100K //' > "$results/before.json"
          echo "=== AFTER: $(git rev-parse HEAD) ==="
          if ! go test -run '^TestGalleryEntryEndpointsPerformance100K$' -count=1 -timeout=25m -v ./internal/api > "$results/after.log" 2>&1; then
            tail -n 45 "$results/after.log"
            exit 1
          fi
          grep 'GALLERY_ENTRY_NATIVE_100K {' "$results/after.log" | tail -n 1 | sed 's/^.*GALLERY_ENTRY_NATIVE_100K //' > "$results/after.json"
          node scripts/ci/validate-gallery-entry-paired.mjs "$results/before.json" "$results/after.json" "$results/acceptance.json"
          cat "$results/acceptance.json"
      - uses: actions/upload-artifact@v4
