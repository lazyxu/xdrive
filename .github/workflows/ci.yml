  final-gate:
    if: always()
    needs:
      - pr-scope
      - policy-contract
      - android-native
      - desktop-tests
      - go-linux
      - go-linux-api
      - go-windows
      - test-backup-cli-windows
      - server-validation
      - server-image
      - photo-face-image
      - media-worker-image
      - server-rootless-e2e
      - caddy-image
      - server-backup
      - web
      - test-linux-artifact
      - test-source-agent-artifact
      - test-windows-rollback-artifact
      - test-windows-upgrade-artifact
      - test-windows-smoke-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI gate to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_SCOPE: ${{ needs.pr-scope.outputs.scope }}
        run: |
          set -euo pipefail
          if [[ "$CI_SCOPE" == full ]]; then
            echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' >/dev/null
            echo "All source, server, web, and exact-artifact tests passed."
            exit 0
          fi
          # A scoped PR requires its selected jobs to succeed, while all
          # unselected gates must be skipped (not failed or still pending).
          echo "$NEEDS_JSON" | jq -e --arg scope "$CI_SCOPE" '
            . as $jobs |
            def accepted($required):
              (all($required[]; $jobs[.].result == "success")) and
              (all($jobs | to_entries[];
                . as $item |
                if $item.key == "pr-scope" then $item.value.result == "success"
                elif ($required | index($item.key)) != null then $item.value.result == "success"
                else $item.value.result == "skipped" end));
            if $scope == "docs" then accepted(["policy-contract"])
            elif $scope == "android" then accepted(["android-native"])
            elif $scope == "pwa" then accepted(["web", "desktop-tests"])
            else false end
          ' >/dev/null
          echo "Scoped $CI_SCOPE PR validation passed; master and v* remain full."

  publish-master:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - build-client-core
      - build-source-agent
      - package-linux-client
      - package-windows-client
      - server-image
      - caddy-image
      - photo-face-image
      - media-worker-image
    permissions:
      contents: write
      packages: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      publish: true
    secrets: inherit

  publish-stable:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [final-gate, photo-ocr-master-smoke]
    permissions:
      contents: write
      packages: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      publish: true
    secrets: inherit

