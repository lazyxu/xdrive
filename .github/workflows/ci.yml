          grep -q 'target_tag="edge"' .github/workflows/release.yml
          grep -q 'xdrive-caddy' .github/workflows/release.yml
          grep -q '8443}:443/tcp' deploy/docker-compose.yml
          grep -Fq '${XD_FILES_DATA_DIR:-../data/files}:/data' deploy/docker-compose.yml
          grep -Fq '${XD_POSTGRES_DATA_DIR:-../data/postgres}:/var/lib/postgresql/data' deploy/docker-compose.yml
          if grep -Eq '(postgres-data:/var/lib/postgresql/data|file-data:/data|caddy-data:/data|caddy-config:/config)' deploy/docker-compose.yml; then
            echo "server Compose must default to host bind mounts, not named data volumes" >&2
            exit 1
          fi
          grep -q '^# Server host layout and Rootless Docker contract' docs/server-host-layout.md
          grep -q 'dns alidns' deploy/Caddyfile
          if grep -q 'docker/build-push-action@v6' .github/workflows/release.yml; then
            echo "release must publish exact CI-produced server images without docker rebuild" >&2
            exit 1
          fi
          if grep -q 'tags=.*:edge' .github/workflows/release.yml; then
            echo "server image build jobs must not bypass the publish workflow by writing edge directly" >&2
            exit 1
          fi

          backup_line="$(grep -n '^stage 5 "create pre-upgrade backup"' deploy/install-server.sh | head -n1 | cut -d: -f1)"
          image_line="$(grep -n '^set_env XD_SERVER_IMAGE ' deploy/install-server.sh | head -n1 | cut -d: -f1)"
          test -n "$backup_line" -a -n "$image_line"
          test "$backup_line" -lt "$image_line"
          grep -q 'STAGING_DIR/server-backup.sh' deploy/install-server.sh
          grep -q 'server-doctor.sh' deploy/install-server.sh
          grep -q 'server-doctor.sh' .github/workflows/release.yml
          grep -q 'server-migrate-user.sh' deploy/install-server.sh
          grep -q 'server-migrate-user.sh' .github/workflows/release.yml
          grep -q 'migrate-user) migrate_user_cmd' scripts/xdrive-server-host.sh
          if grep -Eq 'HOST_BIN_DIR|HOST_MANAGER_LINK|ln -sfn .*xdrive-server' deploy/install-server.sh scripts/xdrive-server-host.sh; then
            echo "xDrive host manager must not create a system-wide command link" >&2
            exit 1
          fi
          grep -q '/api/v1/readyz' deploy/install-server.sh
          grep -q '/api/v1/readyz' scripts/server-doctor.sh
          if grep -q '/api/v1/healthz' deploy/install-server.sh; then
            echo "install readiness gates must use /readyz, not /healthz" >&2
            exit 1
          fi
          grep -q 'xdrive-server-host.sh' deploy/install-server.sh
          grep -q 'release/xdrive-server' .github/workflows/release.yml
          if grep -q 'compose create server' scripts/server-backup.sh; then
            echo "server backup must not create/recreate the formal server service" >&2
            exit 1
          fi
          grep -q 'UPGRADE INCOMPLETE' deploy/install-server.sh
          grep -q -- '--leave-server-stopped </dev/null' deploy/install-server.sh
          grep -q 'flock -n 9' deploy/install-server.sh
          grep -q -- '--leave-server-stopped' deploy/install-server.sh
          grep -q 'UPGRADE FAILED -> ROLLBACK SUCCESS' deploy/install-server.sh
          grep -q 'detailed Docker output is captured in' deploy/install-server.sh

  server-image:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    # Dockerfile defaults keep GitHub on official registries; GitLab passes
    # region-friendly mirrors into the same build arguments.
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate exact server image
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/build-metadata.sh
          docker build \
            --build-arg "VERSION=$XDRIVE_BUILD_VERSION" \
            --build-arg "BUILD_CHANNEL=$XDRIVE_BUILD_CHANNEL" \
            --build-arg "BUILD_COMMIT=$XDRIVE_BUILD_COMMIT" \
            --build-arg "BUILD_COMMIT_MESSAGE_B64=$XDRIVE_BUILD_COMMIT_MESSAGE_B64" \
            --build-arg "BUILD_COMMIT_TIME=$XDRIVE_BUILD_COMMIT_TIME" \
            --build-arg "BUILD_TIME=$XDRIVE_BUILD_TIME" \
            -t xdrive/server:test .
          server_version_output="$(docker run --rm xdrive/server:test version)"
          grep -Fqx "server version: $XDRIVE_BUILD_VERSION" <<<"$server_version_output"
          grep -Fqx "channel: $XDRIVE_BUILD_CHANNEL" <<<"$server_version_output"
          grep -Fqx "commit: $XDRIVE_BUILD_COMMIT" <<<"$server_version_output"
          grep -Fqx "commit time: $XDRIVE_BUILD_COMMIT_TIME" <<<"$server_version_output"
          grep -Fqx "build time: $XDRIVE_BUILD_TIME" <<<"$server_version_output"
          bash scripts/test-server-chunk-storage.sh
          bash scripts/ci/export-docker-image.sh xdrive/server:test dist/server-image
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-server-image
          path: dist/server-image
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  server-rootless-e2e:
    needs: [server-image, caddy-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xdrive-server-image
          path: dist/server-image
      - uses: actions/download-artifact@v4
        with:
          name: xdrive-caddy-image
          path: dist/caddy-image
      - name: Install Rootless Docker prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y uidmap dbus-user-session slirp4netns fuse-overlayfs
          if ! command -v dockerd-rootless.sh >/dev/null 2>&1; then
            rootless_installer="$RUNNER_TEMP/docker-rootless-install.sh"
            curl -fsSL https://get.docker.com/rootless -o "$rootless_installer"
            install_runtime="$RUNNER_TEMP/docker-rootless-install-runtime"
            mkdir -p "$install_runtime"
            chmod 700 "$install_runtime"
            FORCE_ROOTLESS_INSTALL=1 SKIP_IPTABLES=1 XDG_RUNTIME_DIR="$install_runtime" sh "$rootless_installer"
            echo "$HOME/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/bin:$PATH"
          fi
          command -v dockerd-rootless.sh
          rootlesskit_path="$(command -v rootlesskit)"
          if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" == "1" ]]; then
            profile_name="${rootlesskit_path#/}"
            profile_name="${profile_name//\//.}"
            profile_file="/etc/apparmor.d/$profile_name"
            cat <<EOF | sudo tee "$profile_file" >/dev/null
          abi <abi/4.0>,
          include <tunables/global>

          $rootlesskit_path flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r "$profile_file"
          fi
          user_name="$(id -un)"
          user_id="$(id -u)"
          sudo mkdir -p /etc/systemd/system/user@.service.d
          cat <<'EOF' | sudo tee /etc/systemd/system/user@.service.d/xdrive-rootless-delegate.conf >/dev/null
          [Service]
          Delegate=cpu cpuset io memory pids
          EOF
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$user_name"
          sudo systemctl restart "user@$user_id.service"
          user_runtime="/run/user/$user_id"
          for _ in $(seq 1 30); do
            [[ -S "$user_runtime/bus" ]] && break
            sleep 1
          done
          [[ -S "$user_runtime/bus" ]] || {
            echo "rootless E2E could not establish the runner's systemd user bus" >&2
            exit 1
          }
          sudo systemctl show "user@$user_id.service" -p Delegate -p DelegateControllers
          export XDG_RUNTIME_DIR="$user_runtime"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$user_runtime/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          subuid_count="$(awk -F: -v u="$user_name" '$1==u {sum += $3} END {print sum+0}' /etc/subuid)"
          subgid_count="$(awk -F: -v u="$user_name" '$1==u {sum += $3} END {print sum+0}' /etc/subgid)"
          if (( subuid_count < 65536 )); then
            sudo usermod --add-subuids 100000-165535 "$user_name"
          fi
          if (( subgid_count < 65536 )); then
            sudo usermod --add-subgids 100000-165535 "$user_name"
          fi
          grep "^$user_name:" /etc/subuid
          grep "^$user_name:" /etc/subgid
      - name: Real Rootless Docker install/status/doctor E2E
        shell: bash
        run: bash scripts/ci/test-server-rootless-e2e.sh dist/server-image dist/caddy-image

  media-worker-image:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FFmpeg/FFprobe runtime and verify offline private-socket health
        shell: bash
        run: bash scripts/ci/test-media-worker-image.sh dist/media-worker-image
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-media-worker-image
          path: dist/media-worker-image
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  photo-face-image:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    env:
      HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://huggingface.co' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Photo Intelligence runtime cache identity
        id: photo-face-runtime-cache
        shell: bash
        run: echo "hash=$(bash scripts/ci/photo-face-runtime-cache-key.sh)" >> "$GITHUB_OUTPUT"
      - name: Restore reusable Photo Intelligence runtime image
        uses: actions/cache@v4
        with:
          path: .cache/photo-face-runtime
          key: photo-face-runtime-v2-${{ runner.os }}-${{ steps.photo-face-runtime-cache.outputs.hash }}
      - name: Restore resumable Photo Intelligence model downloads
        id: photo-face-model-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/photo-face-models
          key: photo-face-models-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            photo-face-models-v1-${{ runner.os }}-
      - name: Test mounted analyzer code and export exact Photo Intelligence image
        id: photo-face-build
        shell: bash
        run: bash scripts/ci/test-photo-face-image.sh dist/photo-face-image
      # Source-only OCR PR fixture stays isolated from ordinary artifact jobs.
      # The shared script is also used by the post-build master/tag smoke below.
      - uses: actions/setup-go@v5
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'test/photo-ocr-real-jpeg-')
        with:
          go-version: "1.25.x"
          cache: true
      - name: Real JPEG PP-OCR and Gallery search PostgreSQL integration
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'test/photo-ocr-real-jpeg-')
        run: bash scripts/ci/test-photo-ocr-real-model.sh

      - name: Save Photo Intelligence model download progress
        if: always() && steps.photo-face-build.outputs.model_cache_attempted == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/photo-face-models
          key: ${{ steps.photo-face-model-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-photo-face-image
          path: dist/photo-face-image
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  # Detached from photo-face-image: master snapshot publishing must NOT wait
  # for Docker/Go/PostgreSQL OCR smoke. Stable v* tags DO require this check.

  photo-ocr-master-smoke:
    needs: photo-face-image
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'test/photo-ocr-master-smoke-'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xdrive-photo-face-image
          path: dist/photo-face-image
      - name: Load exact published Photo Intelligence image
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/photo-face-image/image.tar.gz
          gzip -dc dist/photo-face-image/image.tar.gz | docker load
          docker image inspect xdrive/photo-face:test >/dev/null
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Real JPEG PP-OCR and Gallery search PostgreSQL smoke
        run: bash scripts/ci/test-photo-ocr-real-model.sh

  caddy-image:
    needs: [pr-scope, web]
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    # Dockerfile defaults keep GitHub on official Go infrastructure; GitLab
    # overrides the same build arguments for its runner network.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xdrive-web-dist
          path: web/dist
      - name: Build and validate exact Caddy/Web image
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          test -f web/dist/index.html
          docker build --build-arg "VERSION=$XDRIVE_RELEASE_VERSION" -f deploy/Caddy.Dockerfile -t xdrive/caddy:test .
          # grep -q closes its input early; under pipefail that can fail a successful docker command with SIGPIPE.
          docker run --rm xdrive/caddy:test caddy list-modules | grep -Fx 'dns.providers.alidns' >/dev/null
          docker run --rm xdrive/caddy:test test -f /srv/index.html
          # The optional independent HTTPS Child is shipped at this EXACT
          # commit, but must never be served by the default Gallery Origin.
          # Compare image bytes with checked-out source, not just existence.
          for asset in index.html child.js child.css; do
            expected="$(sha256sum "deploy/baidu-isolated-child/$asset" | cut -d' ' -f1)"
            actual="$(docker run --rm xdrive/caddy:test sha256sum "/usr/share/xdrive-baidu-isolated-child/$asset" | cut -d' ' -f1)"
            [[ "$actual" == "$expected" ]] || {
              echo "::error title=Isolated Child artifact::Caddy contains stale or missing $asset" >&2
              exit 1
            }
          done
          docker run --rm xdrive/caddy:test /bin/sh -ec \
            'test ! -e /srv/xdrive-baidu-isolated-child/child.js && test ! -e /srv/_xdrive_baidu_isolated/child.js'
          docker run --rm xdrive/caddy:test caddy validate --config /etc/caddy/Caddyfile.http --adapter caddyfile
          docker run --rm xdrive/caddy:test caddy validate --config /etc/caddy/Caddyfile.rescue --adapter caddyfile
          # Validate rescue under actual no-capabilities sandbox. Official Caddy's
          # file-effective NET_BIND_SERVICE bit can cause execve EPERM even on :8080.
          docker run --rm xdrive/caddy:test /bin/sh -ec 'test -z "$(getcap /usr/bin/caddy)"'
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user 65532:65532 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777 \
            -e XDG_CONFIG_HOME=/tmp/caddy-rescue-config \
            -e XDG_DATA_HOME=/tmp/caddy-rescue-data \
            xdrive/caddy:test caddy validate --config /etc/caddy/Caddyfile.rescue --adapter caddyfile
          docker run --rm -e XD_DOMAIN=drive.example.test -e ALIYUN_ACCESS_KEY_ID=test -e ALIYUN_ACCESS_KEY_SECRET=test xdrive/caddy:test caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          bash scripts/ci/export-docker-image.sh xdrive/caddy:test dist/caddy-image
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-caddy-image
          path: dist/caddy-image
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

