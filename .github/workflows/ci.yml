  web:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full' || needs.pr-scope.outputs.scope == 'pwa'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 2
      - name: Prepare native Chromium System Dependencies v1.0 browser acceptance
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'test/admin-system-dependencies-browser-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xdrive-admin-playwright"
          npm install --prefix "$RUNNER_TEMP/xdrive-admin-playwright" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          if command -v google-chrome-stable >/dev/null; then
            echo "XD_ADMIN_CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XD_ADMIN_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XD_ADMIN_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No native Chrome/Chromium available"; exit 1
          fi
      - name: Real Web System Dependencies 375-2560px light/dark Chromium acceptance
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'test/admin-system-dependencies-browser-')
        shell: bash
        env:
          XD_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xdrive-admin-dependencies-browser"
          git rev-parse HEAD > "$RUNNER_TEMP/xdrive-admin-dependencies-browser/tested-checkout.sha"
          echo "$XD_PR_HEAD" > "$RUNNER_TEMP/xdrive-admin-dependencies-browser/pr-head.sha"
          if [ "$(git rev-parse HEAD)" != "$XD_PR_HEAD" ]; then
            git cat-file -p HEAD | grep -Fx "parent $XD_PR_HEAD" >/dev/null || {
              echo "Exact submitted PR head not contained in checkout"; exit 1;
            }
          fi
          node --check ../desktop/scripts/system-dependencies-browser.cjs
          set +e
          XDRIVE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/xdrive-admin-playwright/node_modules/playwright-core" \
          XDRIVE_BROWSER_EXECUTABLE="$XD_ADMIN_CHROME" \
          node ../desktop/scripts/system-dependencies-browser.cjs --output-dir="$RUNNER_TEMP/xdrive-admin-dependencies-browser"
          code=$?
          set -e
          cat "$RUNNER_TEMP/xdrive-admin-dependencies-browser/results.json"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'test/admin-system-dependencies-browser-')
        with:
          name: system-dependencies-v1-real-chromium
          path: ${{ runner.temp }}/xdrive-admin-dependencies-browser/
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare opt-in native Chrome iOS 27 Web acceptance
        if: >-
          github.event_name == 'pull_request' &&
          (startsWith(github.head_ref, 'test/mobile-gallery-ios27-real-chrome-') ||
           startsWith(github.head_ref, 'fix/navigation-no-intermediate-files-gallery-loading-p62-') ||
           startsWith(github.head_ref, 'fix/mobile-gallery-ios27-selection-more-') ||
           startsWith(github.head_ref, 'fix/mobile-gallery-ios27-web-selection-') ||
           startsWith(github.head_ref, 'test/mobile-files-ios27-real-chrome-') ||
           startsWith(github.head_ref, 'fix/mobile-files-ios27-compact-folder-list-') ||
           startsWith(github.head_ref, 'fix/files-quiet-navigation-') ||
            startsWith(github.head_ref, 'fix/mobile-files-owner-prepaint-navigation-p118-') ||
           startsWith(github.head_ref, 'test/mobile-files-path-real-chromium-stability-') ||
           startsWith(github.head_ref, 'test/mobile-cross-app-frame-stability-') ||
           startsWith(github.head_ref, 'test/mobile-secondary-app-frame-stability-') ||
           startsWith(github.head_ref, 'test/mobile-transient-app-frame-stability-') ||
           startsWith(github.head_ref, 'test/mobile-orientation-inflight-folder-stability-') ||
           startsWith(github.head_ref, 'test/mobile-breakpoint-pending-folder-stability-') ||
           startsWith(github.head_ref, 'test/mobile-breakpoint-committed-folder-resume-') ||
           startsWith(github.head_ref, 'fix/mobile-files-ios27-leading-disclosure-') ||
           startsWith(github.head_ref, 'fix/mobile-files-ios27-metadata-10c-') ||
           startsWith(github.head_ref, 'fix/mobile-gallery-ios27-web-viewer-') ||
