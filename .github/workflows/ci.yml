name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  single-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one commit before merge
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          if [[ "$PR_COMMITS" != "1" ]]; then
            echo "PR must contain exactly one commit before merge; found $PR_COMMITS." >&2
            echo "Fetch/rebase origin/master, squash the work branch to one commit, push it, and rerun CI." >&2
            exit 1
          fi

  gallery-thumbnail-web-overwrite:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/media-thumbnail-http-revision'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native Chromium benchmark dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Browser HTTP cache revision overwrite test (baseline first)
        working-directory: desktop
        run: |
          set -euo pipefail
          mkdir -p perf-results
          xvfb-run -a --server-args="-screen 0 1920x1200x24" ./node_modules/.bin/electron --no-sandbox scripts/gallery-web-thumbnail-revision-main.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-thumbnail-web-overwrite
          path: desktop/perf-results/gallery-web-thumbnail-revision.json
          if-no-files-found: warn
          retention-days: 7

  gallery-thumbnail-agent-overwrite:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/media-thumbnail-http-revision'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Agent real HTTP 3600s-cache overwrite test (baseline first)
        run: |
          go test -run '^TestAgentCloudMediaThumbnailOverwriteRevalidatesUnknownRevision$' -count=1 -v ./cmd/xdrive-agent
  gallery-desktop-signed-video-proxy:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/gallery-desktop-signed-video-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Desktop Electron and compile real Main/Agent IPC client
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run build:main
      - name: Build actual production Agent binary
        run: go build -o "$RUNNER_TEMP/xdrive-agent-proxy-fixture" ./cmd/xdrive-agent
      - name: Measure 36 signed Desktop Renderer Range, 12 posters and 6 cancellations
        working-directory: desktop
        env:
          XD_GALLERY_AGENT_BINARY: ${{ runner.temp }}/xdrive-agent-proxy-fixture
        run: |
          set -euo pipefail
          mkdir -p perf-results
          xvfb-run -a --server-args="-screen 0 1920x1200x24" ./node_modules/.bin/electron --no-sandbox scripts/gallery-desktop-signed-video-proxy-main.cjs
          cat perf-results/gallery-desktop-signed-video-proxy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-desktop-signed-video-proxy
          path: |
            desktop/perf-results/gallery-desktop-signed-video-proxy.json
            desktop/perf-results/gallery-real-gin.log
            desktop/perf-results/real-production-agent.log
          if-no-files-found: warn
          retention-days: 7
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test desktop main IPC client
        working-directory: desktop
        run: npm run test:main

  media-shared-progress-chromium:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/media-shared-progress-p0c'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native Chromium performance dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Compare real Chromium HTTP progress collector and native Blob
        working-directory: desktop
        run: |
          set -euo pipefail
          mkdir -p media-progress-results
          xvfb-run -a --server-args="-screen 0 1920x1200x24" ./node_modules/.bin/electron --no-sandbox scripts/media-shared-progress-chromium-main.cjs
          cat media-progress-results/chromium-http-media-progress.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-shared-progress-chromium
          path: desktop/media-progress-results/chromium-http-media-progress.json
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/npm
            .cache/electron
            .cache/electron-builder
          key: desktop-linux-${{ runner.os }}-${{ hashFiles('desktop/package.json') }}
      - name: Resolve desktop artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/build-metadata.sh
          for name in XDRIVE_DESKTOP_VERSION XDRIVE_BUILD_VERSION XDRIVE_BUILD_CHANNEL XDRIVE_BUILD_COMMIT XDRIVE_BUILD_COMMIT_MESSAGE_B64 XDRIVE_BUILD_COMMIT_TIME XDRIVE_BUILD_TIME; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - name: Build Linux desktop runtime
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node scripts/set-version.mjs "$XDRIVE_DESKTOP_VERSION"
          npm run runtime:linux
          test -x release/linux-unpacked/xdrive-desktop
      - name: Pack Linux desktop runtime
        shell: bash
        run: |
          mkdir -p dist
          tar -C desktop/release -czf dist/desktop-runtime-linux-amd64.tar.gz linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-linux-amd64
          path: dist/desktop-runtime-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 2

  desktop-windows:
    runs-on: windows-latest
    env:
      XD_WINDOWS_SIGN_PFX_B64: ${{ secrets.XD_WINDOWS_SIGN_PFX_B64 }}
      XD_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.XD_WINDOWS_SIGN_PFX_PASSWORD }}
      NPM_CONFIG_CACHE: ${{ github.workspace }}\.cache\npm
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/npm
            .cache/electron
            .cache/electron-builder
          key: desktop-windows-${{ runner.os }}-${{ hashFiles('desktop/package.json') }}
      - name: Resolve desktop artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/build-metadata.sh
          for name in XDRIVE_DESKTOP_VERSION XDRIVE_BUILD_VERSION XDRIVE_BUILD_CHANNEL XDRIVE_BUILD_COMMIT XDRIVE_BUILD_COMMIT_MESSAGE_B64 XDRIVE_BUILD_COMMIT_TIME XDRIVE_BUILD_TIME; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - name: Prepare Desktop runtime signing
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and [string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_B64)) {
            throw "Stable Windows releases require XD_WINDOWS_SIGN_PFX_B64 and XD_WINDOWS_SIGN_PFX_PASSWORD secrets."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_B64)) {
            if ([string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_PASSWORD)) {
              throw "XD_WINDOWS_SIGN_PFX_PASSWORD is required when XD_WINDOWS_SIGN_PFX_B64 is set."
            }
            $path = Join-Path $env:RUNNER_TEMP "xdrive-desktop-signing.pfx"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:XD_WINDOWS_SIGN_PFX_B64))
            "CSC_LINK=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$env:XD_WINDOWS_SIGN_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $password = "xdrive-ci-signing"
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=xDrive CI Test" -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable
            $path = Join-Path $env:RUNNER_TEMP "xdrive-desktop-ci-signing.pfx"
            Export-PfxCertificate -Cert $cert -FilePath $path -Password $secure | Out-Null
            "CSC_LINK=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build Windows desktop runtime
        working-directory: desktop
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          node scripts/set-version.mjs $env:XDRIVE_DESKTOP_VERSION
          npm run runtime:win
          if (-not (Test-Path ./release/win-unpacked/xdrive-desktop.exe)) { throw "desktop runtime missing" }
      - name: Verify Windows desktop runtime signature
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            $sig = Get-AuthenticodeSignature ./desktop/release/win-unpacked/xdrive-desktop.exe
            if ($null -eq $sig.SignerCertificate -or $sig.Status -eq "NotSigned") {
              throw "desktop runtime signature missing"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-windows-amd64
          path: desktop/release/win-unpacked
          if-no-files-found: error
          retention-days: 2

  build-client-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Resolve client artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          echo "XDRIVE_RELEASE_VERSION=$XDRIVE_RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Build Linux and Windows client core binaries
        run: bash scripts/build-client-core.sh "$XDRIVE_RELEASE_VERSION" release/core
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-client-core
          path: release/core
          if-no-files-found: error
          retention-days: 2

  go-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod tidy "-go=1.25"
      - run: git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          if [[ -n "$files" ]]; then
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      # internal/api is the dominant race-test package and gets its own
      # PostgreSQL service/job. The remaining packages stay serial here because
      # some integration tests recreate shared schemas inside this job.
      - name: Race test Go packages except internal/api
        shell: bash
        run: |
          # cmd/server migrates large PostgreSQL schemas on every test.
          mapfile -t packages < <(go list ./... | grep -Ev '^github.com/lazyxu/xdrive/(internal/api|cmd/server)$')
          go test -race -timeout=25m ./cmd/server
          go test -p 1 -race "${packages[@]}"
      - run: go vet ./...
      - run: go build ./cmd/server ./cmd/xd ./cmd/xdrive-agent ./cmd/xdrive-updater

  gallery-video-signed-range-server:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/gallery-video-signed-range-server'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_GALLERY_REAL_SIGNED_VIDEO_RANGE_PERF: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Measure signed Go video Range and persisted poster transport
        run: |
          go test -run '^TestGalleryVideoSignedPreviewRangeRealServerBaseline$' -count=1 -timeout=12m -v ./internal/api

  go-linux-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Race test internal/api
        run: bash scripts/ci/test-go-api-race.sh

  gallery-first-open-performance:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/gallery-100k-thumbnail-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_GALLERY_FIRST_OPEN_PERF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Measure Gallery first open 100k mixed-media workload
        run: go test -run '^TestMediaGalleryFirstOpenPerformance100K$' -count=1 -v ./internal/api

  photoasset-owner-node-preload-performance:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/photoasset-owner-node-preload-100k')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_PHOTOASSET_NODE_PRELOAD_PERF: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Measure PhotoAsset 115k Node plus File preload and bind cap
        run: go test -run '^TestPhotoAssetOwnerNodePreload100K$' -count=1 -timeout=12m -v ./internal/photoasset

  photoasset-owner-reconcile-100k-performance:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/photoasset-owner-reconcile-100k-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_PHOTOASSET_OWNER_RECONCILE_PERF: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Measure production ReconcileOwner on 100k logical / 115k physical media
        run: go test -run '^TestPhotoAssetOwnerReconcilePerformance100K$' -count=1 -timeout=17m -v ./internal/api

  photoasset-owner-alloc-profile-100k-performance:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/photoasset-owner-alloc-profile-100k-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_PHOTOASSET_OWNER_WRITE_DIAGNOSTIC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Profile 100k unchanged owner reconciliation CPU and allocations
        run: |
          set -euo pipefail
          mkdir -p photoasset-profile
          go test -run '^TestPhotoAssetOwnerReconcilePerformance100K$' -count=1 -timeout=17m -v -cpuprofile=photoasset-profile/cpu.pprof -memprofile=photoasset-profile/alloc.pprof -memprofilerate=16384 ./internal/api 2>&1 | tee photoasset-profile/bench.log
          go tool pprof -sample_index=alloc_space -top -nodecount=30 photoasset-profile/alloc.pprof 2>&1 | tee photoasset-profile/alloc-top.txt
          go tool pprof -sample_index=inuse_space -top -nodecount=30 photoasset-profile/alloc.pprof 2>&1 | tee photoasset-profile/inuse-top.txt
          go tool pprof -top -nodecount=30 photoasset-profile/cpu.pprof 2>&1 | tee photoasset-profile/cpu-top.txt
          test -s photoasset-profile/alloc.pprof
          test -s photoasset-profile/cpu.pprof
          grep -q 'PHOTOASSET_OWNER_RECONCILE_100K' photoasset-profile/bench.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photoasset-owner-100k-profile
          path: photoasset-profile/
          if-no-files-found: warn
          retention-days: 7

  photoasset-owner-write-100k-performance:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/photoasset-owner-write-100k-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_PHOTOASSET_OWNER_RECONCILE_PERF: "1"
      XD_PHOTOASSET_OWNER_WRITE_DIAGNOSTIC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Measure 100k owner reconciliation SQL write pressure after bounded prune
        run: go test -run '^TestPhotoAssetOwnerReconcilePerformance100K$' -count=1 -timeout=17m -v ./internal/api

  photoasset-owner-stale-prune-100k-performance:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/photoasset-owner-stale-prune-100k-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_PHOTOASSET_STALE_PRUNE_PERF: "1"
    steps:
      - uses: actions/checkout@v4
