name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  single-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one commit before merge
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          if [[ "$PR_COMMITS" != "1" ]]; then
            echo "PR must contain exactly one commit before merge; found $PR_COMMITS." >&2
            echo "Fetch/rebase origin/master, squash the work branch to one commit, push it, and rerun CI." >&2
            exit 1
          fi

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve client artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          echo "XDRIVE_DESKTOP_VERSION=$XDRIVE_DESKTOP_VERSION" >> "$GITHUB_ENV"
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test desktop main IPC client
        working-directory: desktop
        run: npm run test:main
      - name: Build Linux desktop runtime once
        working-directory: desktop
        run: |
          node scripts/set-version.mjs "$XDRIVE_DESKTOP_VERSION"
          npm run runtime:linux
          test -x release/linux-unpacked/xdrive-desktop
      - name: Pack Linux desktop runtime
        shell: bash
        run: |
          mkdir -p dist
          tar -C desktop/release -czf dist/desktop-runtime-linux-amd64.tar.gz linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-linux-amd64
          path: dist/desktop-runtime-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 2

  desktop-windows:
    runs-on: windows-latest
    env:
      XD_WINDOWS_SIGN_PFX_B64: ${{ secrets.XD_WINDOWS_SIGN_PFX_B64 }}
      XD_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.XD_WINDOWS_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve client artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          echo "XDRIVE_DESKTOP_VERSION=$XDRIVE_DESKTOP_VERSION" >> "$GITHUB_ENV"
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test desktop main IPC client
        working-directory: desktop
        run: npm run test:main
      - name: Prepare desktop runtime signing
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and [string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_B64)) {
            throw "Stable Windows releases require XD_WINDOWS_SIGN_PFX_B64 and XD_WINDOWS_SIGN_PFX_PASSWORD secrets."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_B64)) {
            if ([string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_PASSWORD)) {
              throw "XD_WINDOWS_SIGN_PFX_PASSWORD is required when XD_WINDOWS_SIGN_PFX_B64 is set."
            }
            $path = Join-Path $env:RUNNER_TEMP "xdrive-desktop-signing.pfx"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:XD_WINDOWS_SIGN_PFX_B64))
            "CSC_LINK=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$env:XD_WINDOWS_SIGN_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $password = "xdrive-ci-signing"
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=xDrive CI Test" `
              -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable
            $path = Join-Path $env:RUNNER_TEMP "xdrive-desktop-ci-signing.pfx"
            Export-PfxCertificate -Cert $cert -FilePath $path -Password $secure | Out-Null
            "CSC_LINK=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build Windows desktop runtime once
        working-directory: desktop
        shell: pwsh
        run: |
          node scripts/set-version.mjs $env:XDRIVE_DESKTOP_VERSION
          npm run runtime:win
      - name: Verify Windows desktop runtime
        shell: pwsh
        run: |
          $exe = "./desktop/release/win-unpacked/xdrive-desktop.exe"
          if (-not (Test-Path $exe)) { throw "desktop runtime missing" }
          if (-not [string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            $sig = Get-AuthenticodeSignature $exe
            if ($null -eq $sig.SignerCertificate -or $sig.Status -eq "NotSigned") {
              throw "desktop runtime signature missing"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-windows-amd64
          path: desktop/release/win-unpacked
          if-no-files-found: error
          retention-days: 2

  go-linux:
    needs: desktop-linux
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve client artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          echo "XDRIVE_RELEASE_VERSION=$XDRIVE_RELEASE_VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: desktop-runtime-linux-amd64
          path: dist
      - name: Restore exact Linux desktop runtime
        shell: bash
        run: |
          mkdir -p desktop/release
          tar -C desktop/release -xzf dist/desktop-runtime-linux-amd64.tar.gz
          test -x desktop/release/linux-unpacked/xdrive-desktop
      - run: go mod tidy "-go=1.25"
      - run: git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          if [[ -n "$files" ]]; then
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      # Packages share XD_TEST_DATABASE_URL and some integration tests recreate
      # tables, so package-level parallelism makes the suite nondeterministic.
      # -race still checks goroutines inside each package while -p 1 isolates DB schema work.
      - run: go test -p 1 -race ./...
      - run: go vet ./...
      - run: go build ./cmd/server ./cmd/xd ./cmd/xdrive-agent ./cmd/xdrive-updater
      - name: Build and verify Linux unified installer once
        shell: bash
        run: |
          bash scripts/build-linux-deb.sh "$XDRIVE_RELEASE_VERSION" release desktop/release/linux-unpacked
          pkg_root="$(mktemp -d)"
          dpkg-deb -x release/xdrive-linux-amd64.deb "$pkg_root"
          test -x "$pkg_root/usr/bin/xdrive-updater" || { echo "unified package missing xdrive-updater" >&2; exit 1; }
          test -f "$pkg_root/usr/lib/systemd/system/xdrive-update.timer" || { echo "unified package missing update timer" >&2; exit 1; }
          test -f "$pkg_root/usr/share/applications/xdrive.desktop" || { echo "unified package missing desktop menu entry" >&2; exit 1; }
          dpkg-deb --field release/xdrive-linux-amd64.deb Depends | grep -q 'libgtk-3-0'
          dpkg-deb --field release/xdrive-linux-amd64.deb Recommends | grep -q 'libappindicator3-1'
          test -L "$pkg_root/usr/bin/xdrive-desktop" || { echo "unified package missing xdrive-desktop link" >&2; exit 1; }
          test -x "$pkg_root/usr/bin/xdrive-desktop" || { echo "unified package xdrive-desktop link is broken" >&2; exit 1; }
          test "$(cat "$pkg_root/usr/share/doc/xdrive-client/client-version")" = "$XDRIVE_RELEASE_VERSION"
          rm -rf "$pkg_root"
          dpkg-deb --field release/xdrive-linux-amd64.deb Provides | grep -q 'xdrive-desktop'
          dpkg-deb --field release/xdrive-linux-amd64.deb Replaces | grep -q 'xdrive-desktop'
          pkg_meta="$(mktemp -d)"
          dpkg-deb -e release/xdrive-linux-amd64.deb "$pkg_meta"
          grep -q 'xDrive client health check failed' "$pkg_meta/postinst"
          grep -q '/usr/bin/xdrive-desktop' "$pkg_meta/postinst"
          rm -rf "$pkg_meta"
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-linux-amd64
          path: release/xdrive-linux-amd64.deb
          if-no-files-found: error
          retention-days: 14
      - name: Validate server deployment files
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          XD_JWT_SECRET: ci-jwt-secret-that-is-long-enough
          XD_SERVER_IMAGE: ghcr.io/lazyxu/xdrive-server:edge
          XD_WEB_IMAGE: ghcr.io/lazyxu/xdrive-web:edge
          XD_CADDY_IMAGE: ghcr.io/lazyxu/xdrive-caddy:edge
        run: |
          bash -n deploy/install-server.sh
          bash -n scripts/server-backup.sh
          bash -n scripts/server-backup-scheduled.sh
          bash -n scripts/server-restore.sh
          bash -n scripts/server-verify.sh
          bash -n scripts/server-doctor.sh
          bash -n scripts/test-server-doctor.sh
          bash scripts/test-server-doctor.sh
          bash -n scripts/test-server-backup-restore.sh
          bash -n scripts/test-server-chunk-storage.sh
          bash -n scripts/test-server-installer-bootstrap.sh
          bash scripts/test-server-installer-bootstrap.sh
          bash -n scripts/test-server-installer-transaction.sh
          bash scripts/test-server-installer-transaction.sh
          bash -n scripts/test-server-installer-pipe.sh
          bash scripts/test-server-installer-pipe.sh
          bash -n scripts/xdrive-server-host.sh
          bash -n scripts/test-xdrive-server-host.sh
          bash scripts/test-xdrive-server-host.sh
          bash -n scripts/cleanup-merged-branches.sh
          bash -n scripts/test-cleanup-merged-branches.sh
          bash scripts/test-cleanup-merged-branches.sh
          bash -n scripts/test-update-channels.sh
          bash scripts/test-update-channels.sh
          bash -n scripts/ci/download-with-fallback.sh
          bash -n scripts/ci/install-node22.sh
          bash -n scripts/ci/install-docker-cli.sh
          bash -n scripts/ci/test-download-with-fallback.sh
          bash scripts/ci/test-download-with-fallback.sh
          bash -n scripts/ci/check-go-min-version.sh
          bash -n scripts/ci/client-artifact-version.sh
          bash -n scripts/ci/test-client-artifact-version.sh
          bash scripts/ci/test-client-artifact-version.sh
          bash -n scripts/ci/gitlab-release-version.sh
          bash -n scripts/ci/gitlab-package-linux.sh
          bash -n scripts/ci/gitlab-package-windows.sh
          bash -n scripts/ci/gitlab-server-images.sh
          bash -n scripts/ci/gitlab-promote-images.sh
          sh -n scripts/ci/gitlab-publish-release.sh
          bash -n scripts/ci/test-gitlab-release-version.sh
          bash scripts/ci/test-gitlab-release-version.sh
          XDRIVE_CI_GO_VERSION_OVERRIDE=go1.25.0 bash scripts/ci/check-go-min-version.sh 1.25
          XDRIVE_CI_GO_VERSION_OVERRIDE=go1.26.0 bash scripts/ci/check-go-min-version.sh 1.25
          if XDRIVE_CI_GO_VERSION_OVERRIDE=go1.24.9 bash scripts/ci/check-go-min-version.sh 1.25; then
            echo "Go 1.24 must be rejected by the minimum-version check" >&2
            exit 1
          fi
          bash -n scripts/ci/gitlab-desktop-windows.sh
          bash -n scripts/ci/gitlab-go-windows.sh
          bash -n scripts/ci/prepare-go-mod-cache.sh
          bash -n scripts/ci/test-prepare-go-mod-cache.sh
          bash scripts/ci/test-prepare-go-mod-cache.sh
          docker compose -f deploy/docker-compose.yml config >/dev/null
          XD_DOMAIN=drive.example.test XD_HTTPS_PORT=8443 ALIYUN_ACCESS_KEY_ID=ci-key ALIYUN_ACCESS_KEY_SECRET=ci-secret docker compose --profile https -f deploy/docker-compose.yml config >/dev/null

          generated="$(mktemp)"
          sed \
            -e 's|@SOURCE_REF@|0123456789abcdef0123456789abcdef01234567|g' \
            -e 's|@IMAGE_TAG@|sha-0123456789ab|g' \
            -e 's|@IMAGE_REGISTRY@|ghcr.io/lazyxu|g' \
            -e 's|@RELEASE_CHANNEL@|master|g' \
            -e 's|@RELEASE_COMMIT@|0123456789abcdef0123456789abcdef01234567|g' \
            deploy/install-server.sh > "$generated"
          bash -n "$generated"
          grep -q 'sha-0123456789ab' "$generated"
          grep -q 'BUILT_CHANNEL="${XD_BUILT_CHANNEL:-master}"' "$generated"
          rm -f "$generated"

          grep -q 'tags="$image:sha-${GITHUB_SHA::12}"' .github/workflows/release.yml
          grep -q 'tag="snapshot-${GITHUB_SHA::12}"' .github/workflows/release.yml
          grep -q 'target_tag="edge"' .github/workflows/release.yml
          grep -q 'xdrive-caddy' .github/workflows/release.yml
          grep -q '8443}:443/tcp' deploy/docker-compose.yml
          grep -q 'dns alidns' deploy/Caddyfile
          if grep -q 'tags=.*:edge' .github/workflows/release.yml; then
            echo "server image jobs must not publish edge before the full bundle succeeds" >&2
            exit 1
          fi

          backup_line="$(grep -n '^stage 5 "create pre-upgrade backup"' deploy/install-server.sh | head -n1 | cut -d: -f1)"
          image_line="$(grep -n '^set_env XD_SERVER_IMAGE ' deploy/install-server.sh | head -n1 | cut -d: -f1)"
          test -n "$backup_line" -a -n "$image_line"
          test "$backup_line" -lt "$image_line"
          grep -q 'STAGING_DIR/server-backup.sh' deploy/install-server.sh
          grep -q 'server-doctor.sh' deploy/install-server.sh
          grep -q 'server-doctor.sh' .github/workflows/release.yml
          grep -q '/api/v1/readyz' deploy/install-server.sh
          grep -q '/api/v1/readyz' scripts/server-doctor.sh
          if grep -q '/api/v1/healthz' deploy/install-server.sh; then
            echo "install readiness gates must use /readyz, not /healthz" >&2
            exit 1
          fi
          grep -q 'xdrive-server-host.sh' deploy/install-server.sh
          grep -q 'release/xdrive-server' .github/workflows/release.yml
          if grep -q 'compose create server' scripts/server-backup.sh; then
            echo "server backup must not create/recreate the formal server service" >&2
            exit 1
          fi
          grep -q 'UPGRADE INCOMPLETE' deploy/install-server.sh
          grep -q -- '--leave-server-stopped </dev/null' deploy/install-server.sh
          grep -q 'flock -n 9' deploy/install-server.sh
          grep -q -- '--leave-server-stopped' deploy/install-server.sh
          grep -q 'UPGRADE FAILED -> ROLLBACK SUCCESS' deploy/install-server.sh
          grep -q 'detailed Docker output is captured in' deploy/install-server.sh
      - name: Validate server image
        run: |
          docker build -t xdrive/server:test .
          bash scripts/test-server-chunk-storage.sh
      - name: Validate Caddy AliDNS image
        run: |
          docker build -f deploy/Caddy.Dockerfile -t xdrive/caddy:test .
          docker run --rm xdrive/caddy:test caddy list-modules | grep -q '^dns.providers.alidns$'
      - name: Backup, corruption detection, and restore drill
        run: bash scripts/test-server-backup-restore.sh

  go-windows:
    needs: desktop-windows
    runs-on: windows-latest
    env:
      XD_WINDOWS_SIGN_PFX_B64: ${{ secrets.XD_WINDOWS_SIGN_PFX_B64 }}
      XD_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.XD_WINDOWS_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve client artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          echo "XDRIVE_RELEASE_VERSION=$XDRIVE_RELEASE_VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: desktop-runtime-windows-amd64
          path: desktop/release/win-unpacked
      - name: Verify exact Windows desktop runtime
        shell: pwsh
        run: if (-not (Test-Path ./desktop/release/win-unpacked/xdrive-desktop.exe)) { throw "desktop runtime artifact missing" }
      - run: go mod tidy "-go=1.25"
      - run: git diff --exit-code -- go.mod go.sum
      - run: go mod verify
      - run: go test -mod=readonly ./internal/... ./cmd/xdrive-agent
      - name: Windows CfAPI E2E
        run: go test -mod=readonly -tags=xdrive_e2e ./internal/mount -run TestWindowsCfAPIE2E -v -count=1
      - name: Validate Windows PowerShell scripts
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw ./scripts/windows-e2e.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw ./scripts/build-windows-installer.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw ./scripts/test-windows-client-upgrade.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw ./internal/update/windows_upgrade_transaction.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw ./internal/update/windows_legacy_cleanup.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw ./scripts/ci/gitlab-windows-native.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw ./scripts/ci/gitlab-package-windows-native.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw ./scripts/ci/resolve-windows-uninstaller.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw ./scripts/ci/test-windows-uninstaller-resolver.ps1))
      - name: Test Windows uninstaller resolver
        shell: pwsh
        run: ./scripts/ci/test-windows-uninstaller-resolver.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Prepare unified installer signing
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and [string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_B64)) {
            throw "Stable Windows releases require XD_WINDOWS_SIGN_PFX_B64 and XD_WINDOWS_SIGN_PFX_PASSWORD secrets."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_B64)) {
            if ([string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_PASSWORD)) {
              throw "XD_WINDOWS_SIGN_PFX_PASSWORD is required when XD_WINDOWS_SIGN_PFX_B64 is set."
            }
            $pfx = Join-Path $env:RUNNER_TEMP "xdrive-unified-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:XD_WINDOWS_SIGN_PFX_B64))
            "XD_WINDOWS_SIGN_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $password = "xdrive-ci-signing"
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=xDrive CI Test" `
              -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable
            $pfx = Join-Path $env:RUNNER_TEMP "xdrive-unified-ci-signing.pfx"
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
            "XD_WINDOWS_SIGN_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "XD_WINDOWS_SIGN_PFX_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build unified Windows installer once
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            ./scripts/build-windows-installer.ps1 -Version $env:XDRIVE_RELEASE_VERSION -OutputDir release -DesktopSourceDir desktop/release/win-unpacked -TimestampUrl "" -SkipSignatureTrustCheck
          } else {
            ./scripts/build-windows-installer.ps1 -Version $env:XDRIVE_RELEASE_VERSION -OutputDir release -DesktopSourceDir desktop/release/win-unpacked
          }
      - name: Verify Windows Authenticode signatures when signing is enabled
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_PATH)) {
            Write-Host "Windows installer is intentionally unsigned for this snapshot."
            exit 0
          }
          $targets = @(
            "./release/windows-build/xd.exe",
            "./release/windows-build/xdrive-agent.exe",
            "./release/windows-build/desktop/xdrive-desktop.exe",
            "./release/xDriveSetup-amd64.exe"
          )
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target
            if ($null -eq $signature.SignerCertificate -or $signature.Status -eq "NotSigned") {
              throw "missing Authenticode signature for $target"
            }
          }
      - name: Verify Windows installer
        shell: pwsh
        run: if (-not (Test-Path ./release/xDriveSetup-amd64.exe)) { throw "installer missing" }
      - name: Validate Windows update transaction and rollback
        shell: pwsh
        run: ./scripts/test-windows-client-upgrade.ps1 -Installer ./release/xDriveSetup-amd64.exe -TargetVersion $env:XDRIVE_RELEASE_VERSION
      - name: Smoke install and uninstall Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path ./release/xDriveSetup-amd64.exe).Path
          $args = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/NOSTARTAGENT", "/NOSTARTDESKTOP")
          $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }

          $app = Join-Path $env:LOCALAPPDATA "Programs\xDrive"
          if (-not (Test-Path (Join-Path $app "xd.exe"))) { throw "installed xd.exe missing" }
          if (-not (Test-Path (Join-Path $app "xdrive-agent.exe"))) { throw "installed agent missing" }
          if (-not (Test-Path (Join-Path $app "desktop\xdrive-desktop.exe"))) { throw "installed Electron desktop missing" }
          if (Test-Path (Join-Path $app "icons")) { throw "runtime tray icons must not be installed" }
          $shortcutRoots = @(
            (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"),
            (Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs")
          )
          $shortcut = $shortcutRoots |
            Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Filter "xDrive.lnk" -Recurse -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if ($null -eq $shortcut) { throw "unified client must install the xDrive Desktop shortcut" }
          $reported = & (Join-Path $app "xd.exe") version
          if ($reported.Trim() -ne $env:XDRIVE_RELEASE_VERSION) { throw "embedded version mismatch: $reported" }

          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $runValue = (Get-ItemProperty -Path $runKey -Name "xDriveAgent" -ErrorAction Stop).xDriveAgent
          if ($runValue -notlike "*xdrive-agent.exe*") { throw "xDriveAgent autorun registration missing" }

          $uninstaller = (& ./scripts/ci/resolve-windows-uninstaller.ps1 -AppDir $app | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($uninstaller)) { throw "uninstaller resolver returned an empty path" }
          $u = Start-Process -FilePath $uninstaller -ArgumentList $args -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exit code $($u.ExitCode)" }

          if (Test-Path (Join-Path $app "xd.exe")) { throw "xd.exe remains after uninstall" }
          $left = Get-ItemProperty -Path $runKey -Name "xDriveAgent" -ErrorAction SilentlyContinue
          if ($null -ne $left) { throw "xDriveAgent autorun remains after uninstall" }
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-windows-amd64
          path: release/xDriveSetup-amd64.exe
          if-no-files-found: error
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Validate web image
        run: docker build -f Dockerfile -t xdrive/web:test ..


  publish:
    needs: [go-linux, go-windows, web]
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    secrets: inherit
