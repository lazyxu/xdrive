        shell: bash
        env:
          XD_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # First-paint P17/P18 and competing-navigation P19 are mandatory
          # for quiet-navigation PRs, not silently skipped by branch gating.
          XDRIVE_MOBILE_FILES_P17: ${{ (startsWith(github.head_ref, 'fix/files-quiet-navigation-') || startsWith(github.head_ref, 'fix/mobile-files-owner-prepaint-navigation-p118-')) && '1' || '0' }}
          XDRIVE_MOBILE_FILES_P18: ${{ (startsWith(github.head_ref, 'fix/files-quiet-navigation-') || startsWith(github.head_ref, 'fix/mobile-files-owner-prepaint-navigation-p118-')) && '1' || '0' }}
          XDRIVE_MOBILE_FILES_P19: ${{ (startsWith(github.head_ref, 'fix/files-quiet-navigation-') || startsWith(github.head_ref, 'fix/mobile-files-owner-prepaint-navigation-p118-')) && '1' || '0' }}
