          node ../desktop/scripts/mobile-web-app-browser.cjs --scenario=files-ios27-chrome \
            --output-dir="$RUNNER_TEMP/xdrive-files-ios27"
          code=$?
          set -e
          cat "$RUNNER_TEMP/xdrive-files-ios27/results.json"
          exit "$code"
