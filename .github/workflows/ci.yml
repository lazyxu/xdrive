  build-source-agent:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Resolve client artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          echo "XDRIVE_RELEASE_VERSION=$XDRIVE_RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Build Synology source-agent binaries
        shell: bash
        run: bash scripts/build-source-agent.sh "$XDRIVE_RELEASE_VERSION" release/source-agent
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-source-agent-linux
          path: |
            release/source-agent/xdrive-source-agent-linux-amd64
            release/source-agent/xdrive-source-agent-linux-arm64
          if-no-files-found: error
          retention-days: 14

  package-linux-client:
    needs: [desktop-linux, build-client-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve client artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          echo "XDRIVE_RELEASE_VERSION=$XDRIVE_RELEASE_VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: desktop-runtime-linux-amd64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: xdrive-client-core
          path: release/core
      - name: Restore Linux desktop runtime
        run: |
          mkdir -p desktop/release
          tar -C desktop/release -xzf dist/desktop-runtime-linux-amd64.tar.gz
          test -x desktop/release/linux-unpacked/xdrive-desktop
      - name: Package Linux installer once
        run: bash scripts/build-linux-deb.sh "$XDRIVE_RELEASE_VERSION" release desktop/release/linux-unpacked release/core/linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-linux-amd64
          path: release/xdrive-linux-amd64.deb
          if-no-files-found: error
          retention-days: 14

  server-validation:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Validate server deployment files
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          XD_JWT_SECRET: ci-jwt-secret-that-is-long-enough
          XD_SERVER_IMAGE: ghcr.io/lazyxu/xdrive-server:edge
          XD_CADDY_IMAGE: ghcr.io/lazyxu/xdrive-caddy:edge
        run: |
