name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs share a group so newer commits cancel obsolete PR runs. Pushes/tags
  # use unique run IDs: GitHub otherwise cancels an earlier *pending* master
  # workflow on every new commit, even with cancel-in-progress set to false.
  # More runs may consume extra CI minutes; the existing SHA/ancestry release
  # guards fence stale publisher runs without discarding pending artifacts.
  # Keep each snapshot's build/publish prerequisites alive until completed.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.detect.outputs.scope }}
    steps:
      # Use only BASE code for classification; never execute PR-controlled policy.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
      - name: Test available trusted scope rules
        run: |
          set -euo pipefail
          if [[ -f scripts/ci/test_pr_scope.py ]]; then
            python3 -m unittest discover -s scripts/ci -p 'test_pr_scope.py'
          fi
      - name: Classify immutable PR diff; default full
        id: detect
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scope=full
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" &&
                -f scripts/ci/classify_pr_scope.py &&
                "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ &&
                "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            if ! git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null; then
              git fetch --quiet --no-tags origin "$PR_HEAD_SHA" || true
            fi
            if git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null; then
              if candidate="$(python3 scripts/ci/classify_pr_scope.py "$PR_BASE_SHA" "$PR_HEAD_SHA")"; then
                case "$candidate" in
                  full|docs|android|pwa) scope="$candidate" ;;
                  *) echo "::warning title=Unknown CI scope::Using complete CI." ;;
                esac
              else
                echo "::warning title=CI scope detection unavailable::Using complete CI."
              fi
            fi
          fi
          case "$scope" in full|docs|android|pwa) ;; *) exit 1 ;; esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "xDrive CI scope: $scope (unknown or risky paths require full CI)"

  # Fast, real document/policy contract: documentation PRs must not bypass
  # assertions about the active AGENTS rules and byte-identical archive.
  # Full master/stable CI also runs this check; other scoped PRs skip it.

  policy-contract:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'docs' || needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify active rules and immutable historical archive
        run: |
          set -euo pipefail
          node --check desktop/tests/agents-active-policy-archive.cjs
          node --test desktop/tests/agents-active-policy-archive.cjs
          python3 -m unittest discover -s scripts/ci -p 'test_pr_scope.py'

  android-native:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full' || needs.pr-scope.outputs.scope == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared native UI assets
        run: |
          node --test android/scripts/shared-ui.test.mjs
          node --test android/scripts/update-asset.test.mjs
          node --test android/scripts/signed-release-plan.test.mjs
          node android/scripts/shared-ui.mjs --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action default also requests the retired legacy "tools" package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint and exact debug APK
        working-directory: android
        run: bash gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Compose UI fixture tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: bash gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/core/build/reports/tests/
          if-no-files-found: error
          retention-days: 7

  single-commit:
    if: github.event_name == 'pull_request'
    needs: pr-scope
    runs-on: ubuntu-latest
    steps:
      - name: Record PR commit count without demanding a rewrite
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          [[ "$PR_COMMITS" =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "PR has $PR_COMMITS commit(s); Squash Merge may retain a linear master."

  desktop-tests:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full' || needs.pr-scope.outputs.scope == 'pwa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test desktop main IPC client
        working-directory: desktop
        run: npm run test:main

  desktop-linux:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/npm
            .cache/electron
            .cache/electron-builder
          key: desktop-linux-${{ runner.os }}-${{ hashFiles('desktop/package.json') }}
      - name: Resolve desktop artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/build-metadata.sh
          for name in XDRIVE_DESKTOP_VERSION XDRIVE_BUILD_VERSION XDRIVE_BUILD_CHANNEL XDRIVE_BUILD_COMMIT XDRIVE_BUILD_COMMIT_MESSAGE_B64 XDRIVE_BUILD_COMMIT_TIME XDRIVE_BUILD_TIME; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - name: Build Linux desktop runtime
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node scripts/set-version.mjs "$XDRIVE_DESKTOP_VERSION"
          npm run runtime:linux
          test -x release/linux-unpacked/xdrive-desktop
      - name: Pack Linux desktop runtime
        shell: bash
        run: |
          mkdir -p dist
          tar -C desktop/release -czf dist/desktop-runtime-linux-amd64.tar.gz linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-linux-amd64
          path: dist/desktop-runtime-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 2

  desktop-windows:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: windows-latest
    env:
      XD_WINDOWS_SIGN_PFX_B64: ${{ secrets.XD_WINDOWS_SIGN_PFX_B64 }}
      XD_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.XD_WINDOWS_SIGN_PFX_PASSWORD }}
      NPM_CONFIG_CACHE: ${{ github.workspace }}\.cache\npm
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/npm
            .cache/electron
            .cache/electron-builder
          key: desktop-windows-${{ runner.os }}-${{ hashFiles('desktop/package.json') }}
      - name: Resolve desktop artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/build-metadata.sh
          for name in XDRIVE_DESKTOP_VERSION XDRIVE_BUILD_VERSION XDRIVE_BUILD_CHANNEL XDRIVE_BUILD_COMMIT XDRIVE_BUILD_COMMIT_MESSAGE_B64 XDRIVE_BUILD_COMMIT_TIME XDRIVE_BUILD_TIME; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - name: Prepare Desktop runtime signing
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and [string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_B64)) {
            throw "Stable Windows releases require XD_WINDOWS_SIGN_PFX_B64 and XD_WINDOWS_SIGN_PFX_PASSWORD secrets."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_B64)) {
            if ([string]::IsNullOrWhiteSpace($env:XD_WINDOWS_SIGN_PFX_PASSWORD)) {
              throw "XD_WINDOWS_SIGN_PFX_PASSWORD is required when XD_WINDOWS_SIGN_PFX_B64 is set."
            }
            $path = Join-Path $env:RUNNER_TEMP "xdrive-desktop-signing.pfx"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:XD_WINDOWS_SIGN_PFX_B64))
            "CSC_LINK=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$env:XD_WINDOWS_SIGN_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $password = "xdrive-ci-signing"
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=xDrive CI Test" -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable
            $path = Join-Path $env:RUNNER_TEMP "xdrive-desktop-ci-signing.pfx"
            Export-PfxCertificate -Cert $cert -FilePath $path -Password $secure | Out-Null
            "CSC_LINK=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build Windows desktop runtime
        working-directory: desktop
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          node scripts/set-version.mjs $env:XDRIVE_DESKTOP_VERSION
          npm run runtime:win
          if (-not (Test-Path ./release/win-unpacked/xdrive-desktop.exe)) { throw "desktop runtime missing" }
      - name: Verify Windows desktop runtime signature
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            $sig = Get-AuthenticodeSignature ./desktop/release/win-unpacked/xdrive-desktop.exe
            if ($null -eq $sig.SignerCertificate -or $sig.Status -eq "NotSigned") {
              throw "desktop runtime signature missing"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-windows-amd64
          path: desktop/release/win-unpacked
          if-no-files-found: error
          retention-days: 2

  build-client-core:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Resolve client artifact version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          echo "XDRIVE_RELEASE_VERSION=$XDRIVE_RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Build Linux and Windows client core binaries
        run: bash scripts/build-client-core.sh "$XDRIVE_RELEASE_VERSION" release/core
      - name: Package and test CLI-only Backup release (exact same core binaries)
        run: |
          bash scripts/package-backup-cli.sh release/core release/backup-cli
          bash scripts/ci/test-backup-cli-archives.sh "$XDRIVE_RELEASE_VERSION" release/backup-cli release/core
      - name: Build and validate DSM armada38x SPK from the original client
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          bash scripts/ci/test-synology-spk-version.sh
          bash scripts/ci/test-synology-release.sh
          source scripts/ci/synology-spk-version.sh
          source scripts/ci/build-metadata.sh
          bash scripts/build-synology-spk.sh "$XDRIVE_SPK_VERSION" release/synology
          python3 scripts/ci/test-synology-spk.py \
            "release/synology/xdrivenas-armada38x-$XDRIVE_SPK_VERSION.spk" \
            release/synology/core "$XDRIVE_SPK_VERSION"
          bash scripts/ci/verify-synology-spk-release.sh release/synology
      - uses: actions/upload-artifact@v4
        with:
          name: xdrivenas-spk
          path: |
            release/synology/*.spk
            release/synology/*.spk.sha256
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-backup-cli
          path: release/backup-cli
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-client-core
          path: release/core
          if-no-files-found: error
          retention-days: 2

  test-backup-cli-windows:
    needs: [build-client-core]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xdrive-backup-cli
          path: backup-cli
      - name: Resolve exact CLI-only release version
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/client-artifact-version.sh
          echo "XDRIVE_RELEASE_VERSION=$XDRIVE_RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Execute exact Windows Backup-only archive without Electron
        shell: pwsh
        run: |
          & ./scripts/ci/test-backup-cli-windows.ps1 `
            -Archive "./backup-cli/xdrive-backup-windows-amd64.zip" `
            -ExpectedVersion $env:XDRIVE_RELEASE_VERSION

  go-linux:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod tidy "-go=1.25"
      - run: git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          if [[ -n "$files" ]]; then
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      # internal/api is the dominant race-test package and gets its own
      # PostgreSQL service/job. The remaining packages stay serial here because
      # some integration tests recreate shared schemas inside this job.
      - name: Race test Go packages except internal/api
        shell: bash
        run: |
          # cmd/server migrates large PostgreSQL schemas on every test.
          mapfile -t packages < <(go list ./... | grep -Ev '^github.com/lazyxu/xdrive/(internal/api|cmd/server)$')
          go test -race -timeout=25m ./cmd/server
          go test -p 1 -race "${packages[@]}"
      - run: go vet ./...
      - run: go build ./cmd/server ./cmd/xd ./cmd/xdrive-agent ./cmd/xdrive-updater

  go-linux-api:
    needs: pr-scope
    if: needs.pr-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Race test internal/api
        run: bash scripts/ci/test-go-api-race.sh
      - name: Measure real PostgreSQL 100k Mobile Gallery sparse first range
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/mobile-gallery-tail-first-p0b'
        env:
          XD_MOBILE_GALLERY_TAIL_100K: "1"
        run: go test -mod=readonly ./internal/api -run '^TestMobileGalleryTailReal100K$' -count=1 -timeout=25m -v
      # F-iOS27-09I-A: existing Go/API PostgreSQL17 service is authoritative.
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'test/mobile-files-ios27-live-go-') || startsWith(github.head_ref, 'test/files-u01c-') || startsWith(github.head_ref, 'test/files-u05-') || startsWith(github.head_ref, 'test/files-u06-'))
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build real Web and prepare native Chromium for Files Go acceptance
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'test/mobile-files-ios27-live-go-') || startsWith(github.head_ref, 'test/files-u01c-') || startsWith(github.head_ref, 'test/files-u05-') || startsWith(github.head_ref, 'test/files-u06-'))
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          mkdir -p "$RUNNER_TEMP/xdrive-ios27-live-playwright"
          npm install --prefix "$RUNNER_TEMP/xdrive-ios27-live-playwright" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          command -v google-chrome-stable || command -v google-chrome || command -v chromium
      - name: Actual Chromium Files 375/390/899/900 to Gin and PostgreSQL17
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'test/mobile-files-ios27-live-go-') || startsWith(github.head_ref, 'test/files-u01c-') || startsWith(github.head_ref, 'test/files-u05-') || startsWith(github.head_ref, 'test/files-u06-'))
        shell: bash
        env:
          XD_FILES_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/xdrive-ios27-files-live-go"
          READY="$RUNNER_TEMP/xdrive-ios27-files-private-ready.json"
          mkdir -p "$OUT"
          echo "$XD_FILES_PR_HEAD" > "$OUT/pr-head.sha"
          git rev-parse HEAD > "$OUT/tested-checkout.sha"
          if [ "$(git rev-parse HEAD)" != "$XD_FILES_PR_HEAD" ]; then
            git cat-file -p HEAD | grep -Fx "parent $XD_FILES_PR_HEAD" >/dev/null || {
              echo "Actual test checkout is not the submitted PR head"; exit 1;
            }
          fi
          go test -c -o "$RUNNER_TEMP/xdrive-files-live-go-api.test" ./internal/api
          XD_FILES_IOS27_LIVE_GO=1 \
          XD_FILES_IOS27_READY_FILE="$READY" \
          XD_FILES_IOS27_DIST="$GITHUB_WORKSPACE/web/dist" \
            "$RUNNER_TEMP/xdrive-files-live-go-api.test" \
              -test.run='^TestIOS27FilesLiveGoFixture$' -test.count=1 -test.v -test.timeout=5m \
              > "$OUT/gin-postgresql.log" 2>&1 &
          FIXTURE_PID=$!
          cleanup() {
            if kill -0 "$FIXTURE_PID" 2>/dev/null; then
              kill "$FIXTURE_PID" || true
              wait "$FIXTURE_PID" || true
            fi
            rm -f "$READY"
          }
          trap cleanup EXIT
          for trial in $(seq 1 90); do
            if [ -s "$READY" ]; then break; fi
            if ! kill -0 "$FIXTURE_PID" 2>/dev/null; then
              cat "$OUT/gin-postgresql.log"; exit 1;
            fi
            sleep 1
          done
          test -s "$READY" || { cat "$OUT/gin-postgresql.log"; exit 1; }
          if command -v google-chrome-stable >/dev/null; then
            CHROME="$(command -v google-chrome-stable)"
          elif command -v google-chrome >/dev/null; then
            CHROME="$(command -v google-chrome)"
          else
            CHROME="$(command -v chromium)"
          fi
          set +e
          XDRIVE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/xdrive-ios27-live-playwright/node_modules/playwright-core" \
          XDRIVE_BROWSER_EXECUTABLE="$CHROME" \
            node desktop/scripts/files-ios27-real-go-browser.cjs \
              --ready="$READY" --output-dir="$OUT"
          RESULT=$?
          set -e
          if [ "$RESULT" -ne 0 ]; then
            cat "$OUT/results.json" || true
            cat "$OUT/gin-postgresql.log"
            exit "$RESULT"
          fi
          wait "$FIXTURE_PID" || { cat "$OUT/gin-postgresql.log"; exit 1; }
          cat "$OUT/results.json"
          grep -q 'IOS27_FILES_LIVE_GO_VERIFIED' "$OUT/gin-postgresql.log"
      # U01-D2: normal full Files E2E above keeps its historical 5m
      # Go process timeout. Eight genuine U01 cycles run in a second fixture,
      # with no relaxed 12s browser-visibility/Abort/Owner assertions.
      - name: Real Chromium U01 eight-cycle private Go and PostgreSQL fixture
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'test/files-u01c-pwa-back-abba-')
        shell: bash
        env:
          XD_FILES_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/xdrive-ios27-u01-abba"
          READY="$RUNNER_TEMP/xdrive-ios27-u01-abba-private-ready.json"
          mkdir -p "$OUT"
          echo "$XD_FILES_PR_HEAD" > "$OUT/pr-head.sha"
          git rev-parse HEAD > "$OUT/tested-checkout.sha"
          if [ "$(git rev-parse HEAD)" != "$XD_FILES_PR_HEAD" ]; then
            git cat-file -p HEAD | grep -Fx "parent $XD_FILES_PR_HEAD" >/dev/null || {
              echo "Balanced U01 checkout differs from PR HEAD"; exit 1;
            }
          fi
          test -f "$RUNNER_TEMP/xdrive-files-live-go-api.test"
          XD_FILES_IOS27_LIVE_GO=1 \
