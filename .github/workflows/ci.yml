name: CI

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  go-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          test -z "$files" || (echo "$files" && exit 1)
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/server ./cmd/xd ./cmd/xdrive-agent
      - name: Build Linux client installer
        run: bash scripts/build-linux-deb.sh 0.0.0+ci dist
      - name: Validate server deployment files
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          XD_JWT_SECRET: ci-jwt-secret-that-is-long-enough
          XD_SERVER_IMAGE: ghcr.io/lazyxu/xdrive-server:edge
          XD_WEB_IMAGE: ghcr.io/lazyxu/xdrive-web:edge
        run: |
          bash -n deploy/install-server.sh
          docker compose -f deploy/docker-compose.yml config >/dev/null
      - name: Validate server image
        run: docker build -t xdrive/server:test .

  go-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go test ./internal/...
      - run: go build -o xd.exe ./cmd/xd
      - run: go build -ldflags="-H=windowsgui" -o xdrive-agent.exe ./cmd/xdrive-agent
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows client installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Version 0.0.0-ci -OutputDir dist
      - name: Verify Windows installer
        shell: pwsh
        run: if (-not (Test-Path ./dist/xDriveSetup-amd64.exe)) { throw "installer missing" }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Validate web image
        run: docker build -t xdrive/web:test .
