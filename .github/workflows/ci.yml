          mkdir -p "$RUNNER_TEMP/xdrive-playwright"
          npm install --prefix "$RUNNER_TEMP/xdrive-playwright" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          # Host Chromium without Chinese fonts renders unreadable tofu glyphs.
          sudo apt-get update -qq
