          mkdir -p "$RUNNER_TEMP/xdrive-files-ios27"
          echo "$XD_PR_HEAD" > "$RUNNER_TEMP/xdrive-files-ios27/pr-head.sha"
          git rev-parse HEAD > "$RUNNER_TEMP/xdrive-files-ios27/tested-checkout.sha"
          # pull_request checks out GitHub's synthetic PR merge commit by default.
          # Its parent is the exact submitted PR head; record both identities.
          # Do not require the merge checkout SHA to equal the source head SHA.
          if [ "$(git rev-parse HEAD)" != "$XD_PR_HEAD" ]; then
            git cat-file -p HEAD | grep -Fx "parent $XD_PR_HEAD" >/dev/null || {
              echo "PR head not included in tested checkout"; exit 1;
