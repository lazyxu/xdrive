name: PWA P1 Real Owner Viewer Signed H264 Range Abort
on:
  pull_request:
    branches: [master]
    # Limit branch-specific evidence to its dedicated source/fixture paths.
    paths:
      - 'desktop/tests/pwa-p1-h264-presented-motion-source.cjs'
      - 'desktop/tests/pwa-p1-live-motion-hold-source.cjs'
      - 'desktop/tests/pwa-p1-owner-100k-viewer-back-source.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-p1-owner-viewer-range-abort:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/pwa-p1-viewer-video-range-abort-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_PWA_P0C2_SPA_BEFORE: '1'
      XD_PWA_P1_100K_VIEWER_BACK: '1'
      XD_PWA_P1_H264_VIEWER_FRAME: '1'
      XD_PWA_P1_LIVE_MOTION_HOLD: '1'
      XD_PWA_P1_VIEWER_VIDEO_RANGE_CANCEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate opt-in real Gallery-to-Go source and summary gates
        run: |
          set -euo pipefail
          node --check desktop/scripts/gallery-mobile-web-go-cancel-100k-main.cjs
          node --test desktop/tests/pwa-p0c2b2-real-spa-go-source.cjs desktop/tests/pwa-p1-owner-100k-viewer-back-source.cjs desktop/tests/pwa-p1-h264-presented-motion-source.cjs desktop/tests/pwa-p1-live-motion-hold-source.cjs desktop/tests/pwa-p1-viewer-video-range-abort-source.cjs
          gofmt -d internal/api/pwa_p1_viewer_video_range_cancel_fixture_test.go internal/api/gallery_real_web_cold_performance_integration_test.go
          test -z "$(gofmt -l internal/api/gallery_real_web_scroll_cancel_support_test.go internal/api/gallery_real_web_cold_performance_integration_test.go internal/api/pwa_p1_live_motion_fixture_test.go internal/api/pwa_p1_viewer_video_range_cancel_fixture_test.go)"
      - name: Compile original shared Web Gallery and actual Go/Gin PostgreSQL fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          npm --prefix web ci --no-audit --no-fund
          npm --prefix desktop install --no-audit --no-fund
          # This mounted production TS test requires the installed Desktop TypeScript package.
          # Keep the full test; run it only after npm install, never skip it.
          node --test desktop/tests/media-preview-stream-teardown.cjs
          VITE_XDRIVE_GALLERY_REAL_COLD_PERF=1 npm --prefix web run build -- --config vite.config.ts
          mkdir -p desktop/pwa-p0c2-pageleave-go-api
          go test -c -o desktop/pwa-p0c2-pageleave-go-api/api.test ./internal/api
          test -x desktop/pwa-p0c2-pageleave-go-api/api.test
      - name: Measure authenticated original Files Gallery Files same-document UI navigation and Go Context Done n3
        run: |
          set -euo pipefail
          export XD_GALLERY_MOBILE_NATIVE_GO_BINARY="$GITHUB_WORKSPACE/desktop/pwa-p0c2-pageleave-go-api/api.test"
          test -x "$XD_GALLERY_MOBILE_NATIVE_GO_BINARY"
          mkdir -p desktop/pwa-p1-owner-100k-viewer-range-abort-results
          printf 'HEAD=%s\nRUN=%s\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > desktop/pwa-p1-owner-100k-viewer-range-abort-results/source.txt
          xvfb-run -a --server-args="-screen 0 1920x1200x24" ./desktop/node_modules/.bin/electron --no-sandbox desktop/scripts/gallery-mobile-web-go-cancel-100k-main.cjs
          node -e 'const fs=require("node:fs"),s=JSON.parse(fs.readFileSync("desktop/pwa-p1-owner-100k-viewer-range-abort-results/summary.json"));if(!s.passed||!s.spaMode||!s.p1ViewerBackMode||!s.mobileCancelMode||s.cssWindowWidth!==390||s.sampleCount!==3||s.worstGoContextMaxMs>160||s.p1OriginalDecodedP50Ms<=0||!s.p1H264ViewerMode||s.p1H264PresentedP50Ms<=0||s.samples?.some(x=>!x.p1H264Frames?.passed)||!s.p1LiveHoldMode||s.p1LivePresentedP50Ms<=0||s.samples?.some(x=>!x.p1LiveMotion?.passed)||!s.p1ViewerVideoAbortMode||s.p1ViewerRangeGoMaxMs>160||s.samples?.some(x=>!x.p1ViewerRangeAbort?.passed))process.exit(1);console.log(JSON.stringify({passed:s.passed,pageLeaveMode:s.spaMode,n:s.sampleCount,worstGoContextMaxMs:s.worstGoContextMaxMs}))'
          test "$(find desktop/pwa-p1-owner-100k-viewer-range-abort-results -maxdepth 1 -name 'sample-*.json' | wc -l)" -eq 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-p1-owner-signed-viewer-range-abort
          path: desktop/pwa-p1-owner-100k-viewer-range-abort-results/
          if-no-files-found: warn
          retention-days: 14
