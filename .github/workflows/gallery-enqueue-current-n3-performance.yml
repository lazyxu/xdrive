name: Gallery 100k Enqueue Current Baseline

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  gallery-enqueue-100k-current-n3:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/gallery-enqueue-baseline-100k-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_GALLERY_SELECTION_JOB_PERF: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Validate existing parser and benchmark formatting
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/parse-gallery-selection-enqueue-n3.py
          test -z "$(gofmt -l internal/api/media_selection_jobs_performance_integration_test.go)"
      - name: Measure three independent genuine 10k and 100k selection jobs on unchanged production
        run: |
          set -euo pipefail
          root="perf-results/gallery-enqueue-current-100k-n3"
          mkdir -p "$root"
          printf 'HEAD=%s\nRUN=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$root/source.txt"
          for sample in 1 2 3; do
            /usr/bin/time -f 'maxrss_kib=%M\nuser_cpu_seconds=%U\nsystem_cpu_seconds=%S' \
              -o "$root/sample-$sample.time" \
              go test -mod=readonly -run '^TestGallerySelectionJobsReal10k100k$' -timeout=12m -count=1 -v ./internal/api \
              | tee "$root/sample-$sample.log"
          done
          python3 scripts/ci/parse-gallery-selection-enqueue-n3.py "$root"
          cat "$root/summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-enqueue-current-100k-n3
          path: perf-results/gallery-enqueue-current-100k-n3/
          if-no-files-found: warn
          retention-days: 14
