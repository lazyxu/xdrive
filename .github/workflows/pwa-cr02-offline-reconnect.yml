name: PWA CR02 Real Chrome Public SW Offline P1 Reconnect Revocation
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  pwa-cr02-reconnect:
    if: github.head_ref == 'test/pwa-cr02-offline-reconnect-revoke-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact Web build and native Chromium test-only driver
        run: |
          set -euo pipefail
          npm --prefix web ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/xdrive-pwa-cr02-driver"
          npm install --prefix "$RUNNER_TEMP/xdrive-pwa-cr02-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          echo "XDRIVE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/xdrive-pwa-cr02-driver/node_modules/playwright-core" >> "$GITHUB_ENV"
          if command -v google-chrome-stable >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XDRIVE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "native Chrome required for real IndexedDB and public SW" >&2
            exit 1
          fi
      - name: Source-negative Owner, cache and combine contract + exact production Web
        run: |
          set -euo pipefail
          node --check desktop/scripts/pwa-cr02-real-offline-reconnect.cjs
          node --test desktop/tests/pwa-cr02-offline-reconnect-contract.cjs
          node web/scripts/test-pwa-offline-directory.cjs
          node web/scripts/test-pwa-offline-readonly.cjs
          node web/scripts/test-pwa-offline-albums.cjs
          npm --prefix web run lint
          npm --prefix web run build
      - name: Real Chromium P0 public SW cross-process P1 both summaries/reconnect/foreign/revoke
        env:
          XD_PWA_CR02_REAL_CHROME: '1'
          XD_PWA_CR02_EVIDENCE_DIR: ${{ github.workspace }}/desktop/pwa-cr02-reconnect-results
        run: |
          set -euo pipefail
          export XD_PR_HEAD="$(git rev-parse HEAD)"
          test "$XD_PR_HEAD" = "${{ github.event.pull_request.head.sha }}"
          node desktop/scripts/pwa-cr02-real-offline-reconnect.cjs
          test -f "$XD_PWA_CR02_EVIDENCE_DIR/summary.json"
          node -e "const x=require(process.env.XD_PWA_CR02_EVIDENCE_DIR+'/summary.json');if(!x.passed||x.head!==process.env.XD_PR_HEAD||!x.realChromium||x.physicalIOS||x.actualGoOwnerACL||!x.p0PublicSW||!x.first100kBounded||!x.album100kBounded||!x.reconnectUnauthenticatedRemainedHistorical||!x.wrongOwnerAndServerScopesDenied||!x.crossTabRevocationClearedMountedUI||!x.revokedSnapshotNotResurrectedAfterNewChromeProcess||x.privateMediaInPublicCache)process.exit(1);console.log(JSON.stringify({sha:x.head,pass:x.passed,dir:true,album:true,crossTabPurge:true}))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-cr02-anonymous-native-chrome-public-sw-p1-offline-reconnect
          path: desktop/pwa-cr02-reconnect-results/summary.json
          if-no-files-found: warn
          retention-days: 14
