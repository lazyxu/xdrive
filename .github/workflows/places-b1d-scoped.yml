name: Places B1-D Scoped Validation

on:
  push:
    branches:
      - feat/places-b1d-shared-hierarchy-20261022
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/places-b1d-scoped.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: places-b1d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify exact source and gofmt
        shell: bash
        run: |
          set -euo pipefail
          echo "B1_D_EXACT_SOURCE_HEAD=$(git rev-parse HEAD)"
          files="$(gofmt -l internal/client/media.go cmd/xdrive-agent/cloud_files.go cmd/xdrive-agent/desktop_ipc.go cmd/xdrive-agent/desktop_ipc_media_places_hierarchy.go cmd/xdrive-agent/desktop_ipc_media_places_hierarchy_test.go)"
          if [[ -n "$files" ]]; then
            printf 'Unformatted Go source:\n%s\n' "$files"
            gofmt -d internal/client/media.go cmd/xdrive-agent/cloud_files.go cmd/xdrive-agent/desktop_ipc.go cmd/xdrive-agent/desktop_ipc_media_places_hierarchy.go cmd/xdrive-agent/desktop_ipc_media_places_hierarchy_test.go
            exit 1
          fi
      - name: B1-D Agent input admission and cancellation
        run: go test ./cmd/xdrive-agent -run '^TestParseDesktopIPCMediaPlacesHierarchy$' -count=1
      - name: B1-B/C PostgreSQL Owner places integration
        run: go test ./internal/api -run '^TestMediaPlaceHierarchy' -count=1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web and mounted shared UI
        run: npm --prefix web install --no-audit --no-fund
      - name: Typecheck and build shared Web and Mobile Web
        run: npm --prefix web run build

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron and mounted shared UI
        run: npm --prefix desktop install --no-audit --no-fund
      - name: Main and Renderer TypeScript checks
        run: npm --prefix desktop run typecheck
      - name: B1-D source contract regressions
        run: node --test desktop/tests/media-gallery-places-b1d-contract.cjs
