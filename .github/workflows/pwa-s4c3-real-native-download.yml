name: PWA S4C3 Real Native Browser Download SHA

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      size_gib:
        description: 'Actual synthetic native download GiB (4 requires enough runner storage)'
        type: choice
        options: ['1', '4']
        default: '1'

permissions:
  contents: read

jobs:
  real-native-download:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/pwa-native-disk-s4c3b1-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
      XD_PWA_S4C3_SIZE_GIB: ${{ github.event_name == 'workflow_dispatch' && inputs.size_gib || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build authentic Web and verify source format and contracts
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/api/pwa_s2b3_real_gin_auth_integration_test.go internal/api/pwa_s4c3_native_download_fixture_test.go)"
          node --check desktop/scripts/pwa-s4c3-native-download-browser.cjs
          node --test desktop/tests/pwa-s4c3-native-download-contract.cjs
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          go test -c -o "$RUNNER_TEMP/pwa-s4c3-api.test" ./internal/api
          mkdir -p "$RUNNER_TEMP/pwa-s4c3-driver"
          npm install --prefix "$RUNNER_TEMP/pwa-s4c3-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          if command -v google-chrome-stable >/dev/null; then
            echo "XD_PWA_CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XD_PWA_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XD_PWA_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo 'Real system Chrome required' >&2
            exit 1
          fi
      - name: Real Chrome native OS 1 GiB download and physical SHA, desktop and Android emulation
        shell: bash
        env:
          XD_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XD_PR_HEAD"
          AVAILABLE_KIB="$(df -Pk "$RUNNER_TEMP" | awk 'END{print $4}')"
          REQUIRED_KIB="$((XD_PWA_S4C3_SIZE_GIB * 3 * 1024 * 1024))"
          if [ "$AVAILABLE_KIB" -lt "$REQUIRED_KIB" ]; then
            echo "Insufficient physical disk for 1/4 GiB native fixture" >&2
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/desktop/pwa-s4c3-native-results"
          mkdir -p "$OUT"
          FIXTURE_PID=""
          READY=""
          cleanup() {
            if [ -n "$FIXTURE_PID" ] && kill -0 "$FIXTURE_PID" 2>/dev/null; then
              kill "$FIXTURE_PID" || true
              wait "$FIXTURE_PID" || true
            fi
            if [ -n "$READY" ]; then rm -f "$READY"; fi
          }
          trap cleanup EXIT
          for MODE in desktop mobile; do
            READY="$RUNNER_TEMP/pwa-s4c3-${MODE}-ready.json"
            XD_PWA_S2B3_REAL_GIN=1 \
            XD_PWA_S4C3_NATIVE_DOWNLOAD=1 \
            XD_PWA_S2B3_READY_FILE="$READY" \
            XD_PWA_S2B3_DIST="$GITHUB_WORKSPACE/web/dist" \
              "$RUNNER_TEMP/pwa-s4c3-api.test" \
                -test.run='^TestPWAS2B3RealGinAuthFixture$' \
                -test.count=1 -test.v -test.timeout=28m \
                > "$RUNNER_TEMP/pwa-s4c3-private-gin-$MODE.log" 2>&1 &
            FIXTURE_PID=$!
            for attempt in $(seq 1 600); do
              if [ -s "$READY" ]; then break; fi
              if ! kill -0 "$FIXTURE_PID" 2>/dev/null; then
                echo "S4C3 isolated Gin fixture not ready ($MODE)" >&2
                exit 1
              fi
              sleep 1
            done
            test -s "$READY" || { echo "S4C3 private ready signal absent" >&2; exit 1; }
            XDRIVE_BROWSER_EXECUTABLE="$XD_PWA_CHROME" \
            XDRIVE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/pwa-s4c3-driver/node_modules/playwright-core" \
            XD_PR_HEAD="$XD_PR_HEAD" \
              node desktop/scripts/pwa-s4c3-native-download-browser.cjs \
                --ready="$READY" --output-dir="$OUT" --mode="$MODE"
            if ! wait "$FIXTURE_PID"; then
              # Never print raw Go logs containing private download state.
              echo "S4C3 independent Go CAS postflight failure ($MODE)" >&2
              exit 1
            fi
            FIXTURE_PID=""
            rm -f "$READY"
            READY=""
            XD_S4C3_MODE="$MODE" node - <<'NODE'
          const fs = require('node:fs')
          const p = 'desktop/pwa-s4c3-native-results/summary-' + process.env.XD_S4C3_MODE + '.json'
          const s = JSON.parse(fs.readFileSync(p, 'utf8'))
          const props = ['passed','noApiMocks','realGin','realPostgreSQL','realLocalCAS',
            'sourcePhysicallyAllocated','uiFileExplorer','actualNativeDownload',
            'actualDiskFile','nativeSHA256Verified','range206','range416',
            'ticketRequired','onlyPublicOfflineCache']
          if (props.some(k => s[k] !== true) || s.physicalDevice || s.systemInstalled ||
              s.fixtureBytes !== Number(process.env.XD_PWA_S4C3_SIZE_GIB)*2**30) process.exit(1)
          NODE
          done
          test "$(find "$OUT" -maxdepth 1 -name 'summary-*.json' -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-s4c3-native-1or4gib-sanitized
          path: desktop/pwa-s4c3-native-results/summary-*.json
          if-no-files-found: warn
          retention-days: 14
