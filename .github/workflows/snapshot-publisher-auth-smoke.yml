name: Snapshot publisher auth smoke

# A single push on introduction verifies configuration without waiting for
# every full master CI. Later checks are manual via workflow_dispatch.
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/snapshot-publisher-auth-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate scoped publisher configuration
        shell: bash
        env:
          HAS_APP_ID: ${{ vars.XD_SNAPSHOT_APP_ID != '' || secrets.XD_SNAPSHOT_APP_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.XD_SNAPSHOT_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_APP_ID" != true ]]; then
            echo "::error title=Missing numeric Snapshot App ID::Set XD_SNAPSHOT_APP_ID under repository Actions Variables or Repository Secrets. Do not use the Iv1. Client ID." >&2
            exit 1
          fi
          if [[ "$HAS_PRIVATE_KEY" != true ]]; then
            echo "::error title=Missing Snapshot publisher private key::Set XD_SNAPSHOT_APP_PRIVATE_KEY under repository Actions Secrets." >&2
            exit 1
          fi
          echo "[xDrive] Numeric App ID and private key are configured; no credential values displayed."
      - name: Mint scoped Snapshot publisher token
        id: publisher
        shell: bash
        env:
          XD_SNAPSHOT_APP_ID: ${{ vars.XD_SNAPSHOT_APP_ID || secrets.XD_SNAPSHOT_APP_ID }}
          XD_SNAPSHOT_APP_PRIVATE_KEY: ${{ secrets.XD_SNAPSHOT_APP_PRIVATE_KEY }}
        run: bash scripts/ci/mint-snapshot-publisher-token.sh
      - name: Probe exact master Snapshot ref authorization
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          published="$(gh api "repos/$repo/git/ref/tags/snapshot" --jq '.object.sha')"
          [[ "$published" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Snapshot tag is missing or not a commit." >&2
            exit 1
          }
          ancestry="$(gh api "repos/$repo/compare/$published...$GITHUB_SHA" --jq '.status')"
          case "$ancestry" in
            ahead|identical) ;;
            *) echo "Refusing stale/diverged master authorization probe: $ancestry" >&2; exit 1 ;;
          esac
          scratch="xdrive-snapshot-auth-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          endpoint="repos/$repo/git/refs/tags/$scratch"
          created=0
          cleanup() {
            if [[ "$created" == 1 ]]; then
              gh api --method DELETE "$endpoint" >/dev/null || {
                echo "Unable to delete temporary auth smoke tag $scratch" >&2
                return 1
              }
              created=0
            fi
          }
          trap cleanup EXIT
          gh api --method POST "repos/$repo/git/refs" \
            -f "ref=refs/tags/$scratch" -f "sha=$published" >/dev/null
          created=1
          gh api --method PATCH "$endpoint" \
            -f "sha=$GITHUB_SHA" -F force=true >/dev/null
          cleanup
          trap - EXIT
          echo "[xDrive] Snapshot publisher App token and temporary ref retarget passed for $GITHUB_SHA."
          echo "[xDrive] The public snapshot tag, release assets and GHCR edge tags were not changed."
      - name: Revoke scoped Snapshot publisher token
        if: always() && steps.publisher.outputs.token != ''
        shell: bash
        env:
          SNAPSHOT_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request DELETE --connect-timeout 10 --max-time 25 \
            -H "Authorization: Bearer $SNAPSHOT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/installation/token >/dev/null
