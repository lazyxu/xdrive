name: PWA S2B1 Real Browser Installation Shell

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-s2b1-browser:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/pwa-browser-shell-s2b1-20261012' || github.head_ref == 'feat/pwa-public-asset-diagnostics-s2b4-20261012' || github.head_ref == 'fix/pwa-install-diagnostics-cancel-s2b8-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install production Web and isolated native Playwright driver
        run: |
          set -euo pipefail
          npm --prefix web ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/xdrive-pwa-s2b1-driver"
          npm install --prefix "$RUNNER_TEMP/xdrive-pwa-s2b1-driver" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          if command -v google-chrome-stable >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XD_PWA_BROWSER=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Native Chromium/Chrome is unavailable" >&2
            exit 1
          fi
      - name: Validate PWA browser source contract
        run: node --test desktop/tests/pwa-browser-runtime-contract.cjs
      - name: Build actual Web production app and PWA public assets
        run: npm --prefix web run build
      - name: Real desktop and mobile-emulated Chromium SW offline/install/deep-link validation
        env:
          XD_PWA_S2B_RESULT_DIR: ${{ github.workspace }}/desktop/pwa-s2b1-results
          XDRIVE_BROWSER_EXECUTABLE: ${{ env.XD_PWA_BROWSER }}
          XDRIVE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/xdrive-pwa-s2b1-driver/node_modules/playwright-core
        run: |
          set -euo pipefail
          export XD_PR_HEAD="$(git rev-parse HEAD)"
          node desktop/scripts/pwa-browser-install-offline.cjs
          node -e "const r=require(process.env.XD_PWA_S2B_RESULT_DIR+'/summary.json');if(!r.passed||r.cases.length!==2||r.cases.some(x=>!x.cachedPublicOnly||!x.offlineNavigation||!x.deepLinkPreserved||!x.privateBypass||r.publicRequestSummary.headIcon512Aborted!==1||!r.cases.some(x=>x.pendingInstallProbeCancelled)))process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-s2b1-chromium-public-shell
          path: desktop/pwa-s2b1-results/summary.json
          if-no-files-found: warn
          retention-days: 14
