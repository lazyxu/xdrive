name: iOS Native Files Gallery simulator crash reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/ios-native-navigation-runtime.yml'
      - 'ios/UITests/XDriveIOSNavigationRuntimeUITests.swift'
      - 'ios/UITests/XDriveIOSCompactLoginUITests.swift'
      - 'ios/XDriveIOS/NativeOwnerLoginScreen.swift'
      - 'desktop/tests/ios-native-login-compact-16-items.cjs'
      - 'ios/UITests/XDriveIOSAllNativePagesCrashSweepUITests.swift'
      - 'ios/UITests/XDriveIOSGalleryFilesStabilityUITests.swift'
      - 'ios/UITests/XDriveIOSGalleryFilesFrameContinuityUITests.swift'
      - 'ios/UITests/XDriveIOSGalleryFilesSixSubpageUITests.swift'
      - 'ios/UITests/XDriveIOSFilesSignedParityUITests.swift'
      - 'ios/UITests/XDriveIOSFilesSessionRecoveryUITests.swift'
      - 'ios/UITests/XDriveIOSB9ReleaseCrashUITests.swift'
      - 'ios/UITests/XDriveIOSMapNavigationRuntimeUITests.swift'
      - 'ios/UITests/XDriveIOSPagePerformanceUITests.swift'
      - 'ios/UITests/Fixtures/**'
      - 'ios/XDriveIOS/NativeLocalPhotoMap.swift'
      - 'ios/XDriveIOS/NativeOwnerPhotoMapGallery.swift'
      - 'ios/XDriveIOS/NativeExactTripMap.swift'
      # Every Files child route (including future destination/preview/selection
      # files) must trigger real native process-crash navigation tests.
      # Listing only selected subpages left other Files-only edits unchecked.
      - 'ios/XDriveIOS/NativeFiles*.swift'
      - 'ios/XDriveIOS/NativeCloudFiles*.swift'
      - 'ios/XDriveIOS/NativeFilesTrash.swift'
      - 'ios/XDriveIOS/NativeFilesSavedSearches.swift'
      - 'ios/XDriveIOS/NativeFilesOperationHistory.swift'
      - 'ios/XDriveIOS/NativeFilesContinuousWindowPolicy.swift'
      - 'ios/tests/NativeFilesContinuousWindowChecks.swift'
      - 'ios/XDriveIOS/NativeFilesNavigationPolicy.swift'
      - 'ios/tests/NativeFilesNavigationChecks.swift'
      - 'ios/XDriveIOS/NativePhotoViewerReturnAnchorPolicy.swift'
      - 'ios/XDriveIOS/NativePhotoWallDensityPolicy.swift'
      - 'ios/scripts/prepare-navigation-runtime-smoke.py'
      - 'ios/scripts/capture-navigation-smoke-frames.py'
      - 'ios/scripts/audit_navigation_frames.py'
      - 'ios/scripts/test_audit_navigation_frames.py'
      - 'ios/scripts/assert_native_ios_no_crash.py'
      - 'ios/scripts/test_assert_native_ios_no_crash.py'
      - 'ios/scripts/summarize-navigation-latency.py'
      - 'ios/XDriveIOS/NativeOwnerLoginModel.swift'
      - 'ios/XDriveIOS/NativeCloudFilesBrowser.swift'
      # Changes in a child Files/Gallery route must also compile and exercise
      # the real five-tab return smoke; Browser.swift is not always modified.
      - 'ios/XDriveIOS/NativeFilesViewer.swift'
      - 'ios/XDriveIOS/NativeFilesSearchLocation.swift'
      - 'ios/XDriveIOS/NativeFilesVersionHistory.swift'
      - 'ios/XDriveIOS/NativeFilesCollections.swift'
      - 'ios/XDriveIOS/NativeFilesManagementPanel.swift'
      - 'ios/XDriveIOS/NativePhotosDashboard.swift'
      - 'ios/XDriveIOS/NativeUnifiedPhotoGallery.swift'
      - 'ios/XDriveIOS/NativeUnifiedPhotoWall.swift'
      - 'ios/XDriveIOS/NativeUnifiedPhotoViewer.swift'
      - 'ios/XDriveIOS/NativePhotoAlbumBrowser.swift'
      - 'ios/XDriveIOS/NativeLocalPhotoGallery.swift'
      - 'ios/XDriveIOS/NativeLocalContinuousGallery.swift'
      - 'ios/XDriveIOS/NativePhotoVideoSurface.swift'
      - 'ios/scripts/test_summarize_navigation_latency.py'
      - 'ios/scripts/files_ui_transition_video.py'
      - 'ios/scripts/test_files_ui_transition_video.py'
      - 'ios/XDriveIOS/NativeFilesUIStyle.swift'
      - 'ios/XDriveIOS/NativeFilesViewModePolicy.swift'
      - 'ios/tests/NativeFilesViewModeChecks.swift'
      - 'desktop/tests/ios-native-files-ui-six-parity-20261114.cjs'
      - 'desktop/tests/ios-native-files-video-firstframe.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  simulator-navigation:
    # The original 18.5 matrix remains intact; the dedicated Files crash
    # repro uses modern iOS 26.5 Simulator with Xcode 26.6 on macos-26.
    runs-on: ${{ matrix.source == 'candidate-ios26-files' && 'macos-26' || 'macos-15' }}
    # Candidate navigation with all-page CrashSweep also exceeded 60 real
    # minutes on 2026-11-17, cancelling the final native layout tests. Keep
    # every XCTest and frame audit; only raise its finite runner deadline.
    timeout-minutes: ${{ (matrix.source == 'candidate-gallery-files' || matrix.source == 'candidate-navigation') && 100 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # Keep published baseline separate and require both current native
        # suites; no unrelated older CI-success can waive this exact HEAD.
        source: [release-c83, candidate-navigation, candidate-navigation-p0, candidate-gallery-files, candidate-no-session, candidate-mapkit, candidate-performance, candidate-ios26-files]
    continue-on-error: ${{ matrix.source == 'release-c83' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The latest PR HEAD, not a stale PR merge ref or a previously green SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare original release/current source and UI smoke scheme
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.source }}" == candidate-ios26-files ]]; then
            test -d /Applications/Xcode_26.6.app/Contents/Developer ||
              { echo "Xcode 26.6 unavailable on macos-26" >&2; exit 1; }
            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          elif [[ -d /Applications/Xcode_16.4.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          if [[ "${{ matrix.source }}" == release-c83 ]]; then
            work="$RUNNER_TEMP/ios-release-c83"
            mkdir -p "$work/ios/UITests"
            git archive c83bcf3bd00dc817c9214386efe0743093ad0fc8 | tar -xf - -C "$work"
            cp ios/UITests/XDriveIOSNavigationRuntimeUITests.swift "$work/ios/UITests/"
          else
            work="$GITHUB_WORKSPACE"
          fi
          echo "SMOKE_ROOT=$work" >> "$GITHUB_ENV"
          python3 ios/scripts/prepare-navigation-runtime-smoke.py "$work"
          bash "$work/ios/scripts/prepare-assets.sh"
          (cd "$work/ios" && xcodegen generate --spec project.yml)
      - name: Boot available iPhone simulator
        env:
          MAPKIT_FRESH: ${{ matrix.source == 'candidate-mapkit' }}
          IOS26_FILES_REPRO: ${{ matrix.source == 'candidate-ios26-files' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          rows=json.loads(subprocess.check_output(
            ["xcrun","simctl","list","devices","available","-j"]))["devices"]
          candidates=[(runtime,d) for runtime,arr in rows.items() for d in arr
                      if d.get("isAvailable",True) and d.get("name","").startswith("iPhone")]
          if not candidates: raise SystemExit("No iPhone Simulator is installed")
          # iOS 26.5 is the closest hosted Simulator baseline to the user's
          # iOS 26.6 STACK GUARD crash. It is NOT a signed-device iOS 26.6 pass.
          newer=os.environ.get("IOS26_FILES_REPRO")=="true"
          requested="iOS-26-5" if newer else "iOS-18-5"
          compatible=[(runtime,d) for runtime,d in candidates
                      if runtime.endswith(requested)]
          if not compatible:
              raise SystemExit("Required Simulator runtime unavailable: "+requested)
          preferred="iPhone 17" if newer else "iPhone 16"
          runtime,d=next(((r,x) for r,x in compatible if x["name"]==preferred),
                         compatible[0])
          print("IOS_CRASH_REPRO_OS runtime=",runtime,"xcode26=",newer,
                "signed_ios26_6_verified=false")
          sim_id=d["udid"]
          if os.environ.get("MAPKIT_FRESH") == "true":
              # A preinstalled iPhone may contain earlier UI-test media.
              # "simctl privacy reset" does NOT erase Photos: one prior run
              # counted 7 GPS photos instead of the two EXIF fixtures.
              # Create a genuinely empty iOS 18.5 device for this one job.
              device_type=d.get("deviceTypeIdentifier")
              if not device_type:
                  raise SystemExit("iOS 18.5 device type identifier missing")
              name="xdrive-mapkit-"+os.environ["GITHUB_RUN_ID"]+"-"+os.environ.get("GITHUB_RUN_ATTEMPT","1")
              sim_id=subprocess.check_output(
                  ["xcrun","simctl","create",name,device_type,runtime],text=True).strip()
              if not sim_id or sim_id == d["udid"]:
                  raise SystemExit("Isolated MapKit simulator creation did not return a new UDID")
              with open(os.environ["GITHUB_ENV"],"a") as out:
                  out.write("MAPKIT_CREATED_SIM="+sim_id+"\n")
              print("MAPKIT_FRESH_PHOTOS_LIBRARY runtime=",runtime,"device=",device_type,"new_udid=",sim_id)
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("SMOKE_SIM="+sim_id+"\n")
          print("Simulator",runtime,d["name"],sim_id)
          PY
          # GITHUB_ENV applies to subsequent steps, not this shell. Reuse
          # the exact selected simulator locally before attempting to boot.
          SMOKE_SIM="$(sed -n 's/^SMOKE_SIM=//p' "$GITHUB_ENV" | tail -1)"
          test -n "$SMOKE_SIM"
          export SMOKE_SIM
          if [[ "${MAPKIT_FRESH:-false}" == "true" ]]; then
            # CoreSimulator's newly created runtime may still contain
            # bundled/sample Photos. Reset ONLY this exact new device, while
            # shut down, before importing precisely two EXIF-GPS assets.
            fresh="$(sed -n 's/^MAPKIT_CREATED_SIM=//p' "$GITHUB_ENV" | tail -1)"
            test -n "$fresh" && test "$SMOKE_SIM" = "$fresh"
            xcrun simctl erase "$SMOKE_SIM"
            echo "MAPKIT_FRESH_ERASED_BEFORE_GPS_SEED device=$SMOKE_SIM"
          fi
          xcrun simctl boot "$SMOKE_SIM"
          # Fail as infrastructure failure instead of waiting indefinitely
          # for an incompatible/failed CoreSimulator runtime.
          python3 - <<'PY'
          import os,subprocess,sys
          # Real Xcode 26.6/iOS 26.5 runner spent >4m30 in Apple's
          # first-boot data migrators, hitting the old 240s pre-XCTest cap.
          # This is infrastructure, not evidence of a native app crash.
          newer = os.environ.get("IOS26_FILES_REPRO") == "true"
          timeout = 720 if newer else 240
          print(f"IOS_SIMULATOR_BOOT_BUDGET_SECONDS={timeout} iOS26={newer}",flush=True)
          try:
              subprocess.run(["xcrun","simctl","bootstatus",os.environ["SMOKE_SIM"],"-b"],
                             timeout=timeout,check=True)
          except subprocess.TimeoutExpired:
              print("::error title=CoreSimulator first-boot migration timeout::"
                    "Simulator could not finish OS migration before XCTest; "
                    "classify as infrastructure failure, not app crash",
                    file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Seed two independent real GPS PhotoKit samples
        if: matrix.source == 'candidate-mapkit'
        shell: bash
        run: |
          set -euo pipefail
          # Only the isolated, newly created Simulator Photos library may
          # receive the two EXIF-GPS fixtures. Do not seed the shared device.
          test -n "${MAPKIT_CREATED_SIM:-}"
          test "$SMOKE_SIM" = "$MAPKIT_CREATED_SIM"
          echo "MAPKIT_SEED_ONLY_TWO_REAL_GPS_PHOTOS simulator=$SMOKE_SIM"
          xcrun simctl addmedia "$SMOKE_SIM" \
            "$GITHUB_WORKSPACE/ios/UITests/Fixtures/synthetic-gps-map.jpg" \
            "$GITHUB_WORKSPACE/ios/UITests/Fixtures/synthetic-gps-map-second.jpg"
      - name: Install candidate and reset Photos for system authorization prompt
        if: matrix.source == 'candidate-mapkit'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-navigation-results"
          # Real app install and a ONE-TIME TCC reset before MapKit tests.
          # Never reset a selected Full Access grant inside each XCTest case,
          # nor accept simctl success as proof of live PhotoKit readWrite.
          derived="$RUNNER_TEMP/native-navigation-results/DerivedData"
          if ! xcodebuild build \
            -project "$SMOKE_ROOT/ios/xDriveIOS.xcodeproj" \
            -scheme xDriveIOS -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SMOKE_SIM" \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            > "$RUNNER_TEMP/native-navigation-results/photos-preflight-build.log" 2>&1; then
            tail -100 "$RUNNER_TEMP/native-navigation-results/photos-preflight-build.log"
            exit 1
          fi
          app="$derived/Build/Products/Debug-iphonesimulator/xDriveIOS.app"
          test -s "$app/xDriveIOS"
          identifier=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          test "$identifier" = 'com.lazyxu.xdrive.ios'
          xcrun simctl install "$SMOKE_SIM" "$app"
          xcrun simctl privacy "$SMOKE_SIM" reset all "$identifier"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print NSPhotoLibraryUsageDescription' "$app/Info.plist")"
          echo "SIM_PHOTOS_PROMPT_RESET installed_bundle=$identifier service=photos (not yet authorized)"
      - name: Run real XCUITest Gallery-Files transitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-navigation-results/diagnostics"
          # The actual codec regressions must run on the required Gallery/Files
          # shard, not silently skip because the runner lacks FFmpeg.
          if [[ "${{ matrix.source }}" == "candidate-gallery-files" ]] && ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          python3 -m py_compile "$GITHUB_WORKSPACE/ios/scripts/capture-navigation-smoke-frames.py" \
            "$GITHUB_WORKSPACE/ios/scripts/audit_navigation_frames.py" \
            "$GITHUB_WORKSPACE/ios/scripts/test_audit_navigation_frames.py" \
            "$GITHUB_WORKSPACE/ios/scripts/summarize-navigation-latency.py" \
            "$GITHUB_WORKSPACE/ios/scripts/test_summarize_navigation_latency.py"
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/ios/scripts" \
            -p 'test_summarize_navigation_latency.py' -v
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/ios/scripts" \
            -p 'test_audit_navigation_frames.py' -v
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/ios/scripts" \
            -p 'test_assert_native_ios_no_crash.py' -v
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/ios/scripts" \
            -p 'test_files_ui_transition_video.py' -v
          if [[ "${{ matrix.source }}" == "candidate-navigation" || "${{ matrix.source }}" == "candidate-navigation-p0" ]]; then
            node --test "$GITHUB_WORKSPACE/desktop/tests/ios-native-all-pages-six-extra-crash-paths-20261116.cjs"
          fi
          if [[ "${{ matrix.source }}" == "candidate-gallery-files" ]]; then
            swiftc "$GITHUB_WORKSPACE/ios/XDriveIOS/NativeFilesViewModePolicy.swift" \
              "$GITHUB_WORKSPACE/ios/tests/NativeFilesViewModeChecks.swift" \
              -o "$RUNNER_TEMP/native-navigation-results/native-files-view-mode-checks"
            "$RUNNER_TEMP/native-navigation-results/native-files-view-mode-checks"
            node --test "$GITHUB_WORKSPACE/desktop/tests/ios-native-files-ui-six-parity-20261114.cjs"
            node --test "$GITHUB_WORKSPACE/desktop/tests/ios-native-gallery-files-six-reentry-20261116.cjs"
          fi
          # Keep a few frames from the LIVE failed route, not SpringBoard after
          # xcodebuild exits. Never use AX queries from this observer.
          if [[ "${{ matrix.source }}" != "release-c83" && "${{ matrix.source }}" != "candidate-gallery-files" ]]; then
            python3 "$SMOKE_ROOT/ios/scripts/capture-navigation-smoke-frames.py" \
              "$SMOKE_SIM" \
              "$RUNNER_TEMP/native-navigation-results/xcodebuild.log" \
              "$RUNNER_TEMP/native-navigation-results/diagnostics/live-frames" &
            frame_watcher=$!
            trap 'kill "$frame_watcher" >/dev/null 2>&1 || true' EXIT
          fi
          # For Gallery-Files use real H.264 instead of slow serial screenshots.
          # No fake test starts or tap markers. The watcher is always reaped.
          if [[ "${{ matrix.source }}" == "candidate-gallery-files" ]]; then
            python3 "$SMOKE_ROOT/ios/scripts/files_ui_transition_video.py" watch \
              "$SMOKE_SIM" \
              "$RUNNER_TEMP/native-navigation-results/xcodebuild.log" \
              "$RUNNER_TEMP/native-navigation-results/diagnostics/files-ui-video" &
            video_watcher=$!
            trap 'kill -TERM "$video_watcher" >/dev/null 2>&1 || true; wait "$video_watcher" >/dev/null 2>&1 || true' EXIT
          fi
          # Legacy release is only an informational baseline: it does not
          # contain new child content IDs, so run the compatible tab smoke.
          # BOTH candidate jobs are mandatory (not continue-on-error).
          # Never silently skip one native child suite when new tests appear.
          native_test_args=()
          case "${{ matrix.source }}" in
            release-c83)
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSNavigationRuntimeUITests/testFilesFirstOpenAndSixGalleryReturnsDoNotExit") ;;
            candidate-navigation)
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSNavigationRuntimeUITests")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSB9ReleaseCrashUITests")
              # Actual product login shell under CI-only safe-startup,
              # not the synthetic Owner/Files/Gallery navigation fixture.
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSCompactLoginUITests") ;;
            candidate-navigation-p0)
              # Separately reproduce the five actual 2026-11-17 failures
              # plus Files search/keyboard return BEFORE the full 46-case
              # suite finishes. Both shards are required; do not skip or mock
              # the existing all-pages test suite to make this one pass.
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testFilesHomeEditThenSavedHistorySheetsRetireDoesNotExit")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testGalleryBackupQueueCacheTwoRoundsFilesNoCrash")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testGalleryBackupSettingsQueueAndFilesReturnDoNotExit")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testGalleryFocusedBackupConsentDoesNotAutoUploadNoCrash")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testGalleryThumbnailCacheSheetForegroundDismissDoesNotExit")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testLauncherSearchKeyboardForegroundFilesReturnDoesNotExit") ;;
            candidate-gallery-files)
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSGalleryFilesStabilityUITests")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSGalleryFilesFrameContinuityUITests")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSGalleryFilesSixSubpageUITests") ;;
            candidate-no-session)
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSFilesSessionRecoveryUITests") ;;
            candidate-mapkit)
              # This candidate uses an isolated real PhotoKit permission
              # lifecycle; other Gallery/Files UITests cannot reset TCC.
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSMapNavigationRuntimeUITests") ;;
            candidate-performance)
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSPagePerformanceUITests") ;;
            candidate-ios26-files)
              # Run actual Files SwiftUI lifetime and subpage navigation on
              # iOS 26.5. No fake login or privileged Owner data is accessed.
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSNavigationRuntimeUITests/testFilesDeepLifecycleViewStackSurvivesOwnerAndForegroundTransitions")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSNavigationRuntimeUITests/testFilesFirstOpenAndSixGalleryReturnsDoNotExit")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSNavigationRuntimeUITests/testFilesRecentBrowseFavoritesRepeatedWithoutCrash")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testFilesHomeEditThenSavedHistorySheetsRetireDoesNotExit")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testFilesDirectSyntheticOwnerColdRelaunchThreeTimesKeepsShellAlive")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testFilesDeniedRootColdRelaunchDoesNotResurrectPrivateGrid")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testFilesRecentDeniedAndSavedSearchesAcrossForegroundDoesNotExit")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testFilesHomeTwoSheetsRepeatAcrossGalleryFilesDoesNotExit")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSAllNativePagesCrashSweepUITests/testInterruptedStartupDisplaysPriorSystemCrashMetadataWithoutOwner")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSGalleryFilesSixSubpageUITests/testFilesSearchKeyboardGalleryPeopleReturnHasNoGhostOverlay")
              # Two real subpage lifecycle journeys recovered from #4298:
              # repeated History/foreground and signed-out Owner cold relaunch.
              # Both must execute under the iOS 26.5 Simulator, not only
              # compile or pass a source-string contract.
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSGalleryFilesFrameContinuityUITests/testFilesOperationHistoryTwoForegroundGalleryReturnCyclesKeepRealPage")
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSGalleryFilesFrameContinuityUITests/testSyntheticOwnerAlbumsFilesForegroundRelaunchDoesNotRetainOldScope")
              # Mount the actual Files L3 Viewer graph for five media kinds,
              # with no bearer, through a DEBUG-only Simulator-only route.
              native_test_args+=("-only-testing:xDriveIOSNavigationUITests/XDriveIOSNavigationRuntimeUITests/testFilesViewerFiveMediaKindsNoSessionForegroundAndDismissNoCrash") ;;
            *) echo "Unsupported UI suite" >&2; exit 2 ;;
          esac
          touch "$RUNNER_TEMP/native-navigation-results/xcodebuild-start.marker"
          xcodebuild test \
            -project "$SMOKE_ROOT/ios/xDriveIOS.xcodeproj" \
            -scheme xDriveIOS -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SMOKE_SIM" \
            -derivedDataPath "$RUNNER_TEMP/native-navigation-results/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/native-navigation-results/Navigation.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            "${native_test_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/native-navigation-results/xcodebuild.log"
      - name: Verify native Files rails and hit targets in dark appearance
        if: matrix.source == 'candidate-navigation'
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl ui "$SMOKE_SIM" appearance dark
          xcodebuild test \
            -project "$SMOKE_ROOT/ios/xDriveIOS.xcodeproj" \
            -scheme xDriveIOS -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SMOKE_SIM" \
            -derivedDataPath "$RUNNER_TEMP/native-navigation-results/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/native-navigation-results/DarkFiles.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            -only-testing:xDriveIOSNavigationUITests/XDriveIOSNavigationRuntimeUITests/testFilesQuickRailAndFiveTabBarDoNotOverlapInPortraitOrLandscape \
            test 2>&1 | tee "$RUNNER_TEMP/native-navigation-results/dark-files.log"
      - name: Verify native PhotoKit MapKit in dark mode
        if: matrix.source == 'candidate-mapkit'
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl ui "$SMOKE_SIM" appearance dark
          xcodebuild test \
            -project "$SMOKE_ROOT/ios/xDriveIOS.xcodeproj" \
            -scheme xDriveIOS -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SMOKE_SIM" \
            -derivedDataPath "$RUNNER_TEMP/native-navigation-results/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/native-navigation-results/DarkMap.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            -only-testing:xDriveIOSNavigationUITests/XDriveIOSMapNavigationRuntimeUITests/testMapCameraLayoutAndUnverifiedGestureNeverClosesTheApp \
            test 2>&1 | tee "$RUNNER_TEMP/native-navigation-results/dark-map.log"
      - name: Validate all native page performance routes have 3 real UI trials
        if: matrix.source == 'candidate-performance'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-navigation-results/diagnostics"
          python3 "$GITHUB_WORKSPACE/ios/scripts/summarize-navigation-latency.py" \
            "$RUNNER_TEMP/native-navigation-results/xcodebuild.log" \
            "$RUNNER_TEMP/native-navigation-results/diagnostics/page-performance.json" \
            --require-page-performance
      - name: Capture crash diagnostics and XCTest summary
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-navigation-results/diagnostics"
          if [[ -f "$RUNNER_TEMP/native-navigation-results/xcodebuild.log" ]]; then
            python3 "$GITHUB_WORKSPACE/ios/scripts/summarize-navigation-latency.py" \
              "$RUNNER_TEMP/native-navigation-results/xcodebuild.log" \
              "$RUNNER_TEMP/native-navigation-results/diagnostics/navigation-latency.json" || true
          fi
          # Diagnostic report only: a flat content region may be a legitimate
          # empty state, and sparse PNGs cannot prove real 60/120-Hz FPS.
          # Preserve all flagged frames for review; never invent a PASS.
          python3 "$GITHUB_WORKSPACE/ios/scripts/audit_navigation_frames.py" \
            "$RUNNER_TEMP/native-navigation-results/diagnostics/live-frames" \
            "$RUNNER_TEMP/native-navigation-results/diagnostics/frame-audit.json" || true
          # Capture a device-level frame even if XCTest was unable to
          # construct an accessibility snapshot for the native child page.
          # Failure attachments generated before an AX timeout are exported
          # below; this frame is independent of XCUIElement queries.
          if [[ -n "${SMOKE_SIM:-}" ]]; then
            xcrun simctl io "$SMOKE_SIM" screenshot \
              "$RUNNER_TEMP/native-navigation-results/diagnostics/simulator-final-frame.png" \
              >/dev/null 2>&1 || true
          fi
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 3 -type f \
            \( -iname '*xDrive*' -o -iname '*.ips' \) -mmin -45 \
            -exec cp {} "$RUNNER_TEMP/native-navigation-results/diagnostics/" \; 2>/dev/null || true
          if [[ -d "$RUNNER_TEMP/native-navigation-results/Navigation.xcresult" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/native-navigation-results/Navigation.xcresult" \
              > "$RUNNER_TEMP/native-navigation-results/diagnostics/summary.json" 2>&1 || true
            mkdir -p "$RUNNER_TEMP/native-navigation-results/diagnostics/failure-attachments"
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/native-navigation-results/Navigation.xcresult" \
              --output-path "$RUNNER_TEMP/native-navigation-results/diagnostics/failure-attachments" \
              --only-failures > /dev/null 2>&1 || true
          fi
      - name: Verify real Files Gallery transition video evidence
        if: ${{ always() && matrix.source == 'candidate-gallery-files' }}
        shell: bash
        run: |
          set -euo pipefail
          # macos-15 runners do not guarantee ffmpeg; fail closed if installation fails.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | sed -n '1p'
          # Require genuine clips from all 56 named native Gallery/Files journeys.
          python3 "$GITHUB_WORKSPACE/ios/scripts/files_ui_transition_video.py" audit \
            "$RUNNER_TEMP/native-navigation-results/diagnostics/files-ui-video" \
            "$RUNNER_TEMP/native-navigation-results/diagnostics/files-ui-video-audit.json" \
            --minimum 57
      - name: Reject candidate xDriveIOS process crash reports
        if: ${{ always() && matrix.source != 'release-c83' }}
        shell: bash
        run: |
          set -euo pipefail
          sim_reports="$HOME/Library/Developer/CoreSimulator/Devices/${SMOKE_SIM:-unknown}/data/Library/Logs"
          python3 "$GITHUB_WORKSPACE/ios/scripts/assert_native_ios_no_crash.py" \
            --marker "$RUNNER_TEMP/native-navigation-results/xcodebuild-start.marker" \
            --xcodebuild-log "$RUNNER_TEMP/native-navigation-results/xcodebuild.log" \
            --output "$RUNNER_TEMP/native-navigation-results/diagnostics/app-process-crash-audit.json" \
            "$HOME/Library/Logs/DiagnosticReports" \
            "$sim_reports/CrashReporter" "$sim_reports/DiagnosticReports"
      - name: Export actual unified Files XCUI screenshots
        if: ${{ always() && matrix.source == 'candidate-gallery-files' }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/native-navigation-results/Navigation.xcresult"
          out="$RUNNER_TEMP/native-navigation-results/diagnostics/files-unified-screenshots"
          test -d "$bundle"
          # Only this one real XCTest run: exporting every Gallery video/frame
          # from the bundle would exhaust the artifact budget.
          ids=(
            'XDriveIOSGalleryFilesSixSubpageUITests/testFilesUnifiedNativePresentationCapturesOneContinuousSequence()'
            'XDriveIOSNavigationUITests/XDriveIOSGalleryFilesSixSubpageUITests/testFilesUnifiedNativePresentationCapturesOneContinuousSequence'
            'XDriveIOSGalleryFilesSixSubpageUITests/testFilesUnifiedNativePresentationCapturesOneContinuousSequence'
          )
          exported=0
          for test_id in "${ids[@]}"; do
            rm -rf "$out"
            mkdir -p "$out"
            if xcrun xcresulttool export attachments \
                --path "$bundle" --output-path "$out" --test-id "$test_id" \
                >"$RUNNER_TEMP/files-unified-export.log" 2>&1 && \
               test -s "$out/manifest.json"; then
              exported=1
              break
            fi
          done
          if [[ "$exported" != 1 ]]; then
            cat "$RUNNER_TEMP/files-unified-export.log" >&2
            echo "Files screenshot XCTest attachments missing (not a pass)" >&2
            exit 1
          fi
          python3 - "$out" <<'PY'
          import json
          import pathlib
          import sys
          out = pathlib.Path(sys.argv[1])
          data = json.loads((out / "manifest.json").read_text())
          attachments = [a for test in data for a in test.get("attachments", [])]
          names = {a.get("suggestedHumanReadableName", "") for a in attachments}
          required = {
              "ios-files-native-01-browse-home",
              "ios-files-native-02-recent",
              "ios-files-native-03-favorites",
              "ios-files-native-04-browse-return",
              "ios-files-native-05-browse-more",
              "ios-files-native-06-home-organizer",
              "ios-files-native-07-cloud-no-session",
              "ios-files-native-08-browse-restored",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Missing actual Files snapshots: " + ", ".join(missing))
          for attachment in attachments:
              if attachment.get("suggestedHumanReadableName") not in required:
                  continue
              exported = attachment.get("exportedFileName", "")
              if not exported or not (out / exported).is_file():
                  raise SystemExit("Missing screenshot bytes for " + str(exported))
          print("Verified 8 native XCTest screenshot attachments; "
                "synthetic Owner / no Session only, not signed-device PWA parity")
          PY
      - name: Upload runtime logs and crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-navigation-${{ matrix.source }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-navigation-results/xcodebuild.log
            ${{ runner.temp }}/native-navigation-results/photos-preflight-build.log
            ${{ runner.temp }}/native-navigation-results/dark-map.log
            ${{ runner.temp }}/native-navigation-results/diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Retire freshly created candidate MapKit simulator
        if: ${{ always() && matrix.source == 'candidate-mapkit' }}
        shell: bash
        run: |
          # Only delete the simulator that THIS job created, not the hosted
          # preinstalled iPhone or any other matrix shard.
          if [[ -n "${MAPKIT_CREATED_SIM:-}" && "${MAPKIT_CREATED_SIM:-}" == "${SMOKE_SIM:-}" ]]; then
            xcrun simctl shutdown "$MAPKIT_CREATED_SIM" >/dev/null 2>&1 || true
            xcrun simctl delete "$MAPKIT_CREATED_SIM" >/dev/null 2>&1 || true
            echo "MAPKIT_RETIRED_FRESH_SIMULATOR $MAPKIT_CREATED_SIM"
          fi
