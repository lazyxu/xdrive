name: PWA P0-B2c1 Read-only Public Archive Audit

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-archive-audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/pwa-public-archive-audit-b2c1-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only audit source and publisher-bound regression
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pwa-archive-audit.mjs
          node --check desktop/tests/pwa-archive-audit.cjs
          node --test desktop/tests/pwa-archive-audit.cjs
