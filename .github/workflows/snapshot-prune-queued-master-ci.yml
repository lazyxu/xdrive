name: Prune queued CI superseded by published Snapshot

# Never subscribe to release.edited: each asset replacement can fan out
# multiple events and redundant Actions jobs. The trusted publisher sends
# one explicit repository_dispatch only AFTER verifying the full Snapshot.
# No per-master-push workflow; manual dry-run and scoped PR tests remain.
on:
  repository_dispatch:
    types: [xdrive_snapshot_published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect old queued CI without cancelling them'
        type: boolean
        default: true
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/snapshot-prune-queued-master-ci.yml'
      - 'scripts/ci/prune-queued-master-ci.cjs'
      - 'scripts/ci/prune-queued-master-ci.test.cjs'

permissions:
  contents: read

concurrency:
  # Only newer PR tests may replace obsolete PR checks. Published Snapshot
  # and manually reviewed cleanup executions always get a unique run ID.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR code is executable only here, using a read-only token and an exact SHA.
  selector-contract:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run isolated cancellation selector regression without write permission
        run: |
          node --check scripts/ci/prune-queued-master-ci.cjs
          node --test scripts/ci/prune-queued-master-ci.test.cjs

  # Never run PR-supplied code with Actions write. Only post-publish dispatches
  # or explicit manual runs execute checkout from trusted master.
  prune-queued:
    permissions:
      contents: read
      actions: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'xdrive_snapshot_published')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted master-only cleanup code
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Run fail-closed cancellation selector regression
        run: node --test scripts/ci/prune-queued-master-ci.test.cjs
      - name: Prune only old queued CI already superseded by Snapshot
        uses: actions/github-script@v7
        env:
          PRUNE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          script: |
            const {pruneQueuedMasterCI} = require('./scripts/ci/prune-queued-master-ci.cjs')
            await pruneQueuedMasterCI({
              github, context, core,
              dryRun: String(process.env.PRUNE_DRY_RUN) === 'true',
            })
