name: Bootstrap MVP

on:
  push:
    branches: ["feat/mvp-cfapi"]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct source
        shell: bash
        run: |
          cat .bootstrap/bundle-* | base64 -d > /tmp/xdrive-source.tar.gz
          echo "c4aaba164777b39f84e92bd3cce3568d13a67b4ad276688ba8e9840a9e60fb47  /tmp/xdrive-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/xdrive-source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Resolve Go modules
        run: go mod tidy
      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          test -z "$files" || (echo "$files" && exit 1)
      - name: Test Go
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Build Go
        run: go build ./cmd/server ./cmd/xd
      - name: Cross-compile Windows CfAPI client
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 go test -c -o /tmp/xdrive-mount.test.exe ./internal/mount
          GOOS=windows GOARCH=amd64 go build -o /tmp/xd.exe ./cmd/xd

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Type-check web
        working-directory: web
        run: npm run lint
      - name: Build web
        working-directory: web
        run: npm run build

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement xDrive MVP with Windows CfAPI"
          git push origin HEAD:feat/mvp-cfapi
