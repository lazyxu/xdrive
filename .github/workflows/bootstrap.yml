name: Bootstrap MVP source

on:
  push:
    branches: ["feat/mvp-cfapi"]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  materialize-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-complete]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 -d > /tmp/xdrive-src.tar.gz
          tar -xzf /tmp/xdrive-src.tar.gz -C .
          grep -vF '"path/filepath"' internal/mount/mount_linux.go > /tmp/mount_linux.go && mv /tmp/mount_linux.go internal/mount/mount_linux.go
          printf '%s\n' '/// <reference types="vite/client" />' > web/src/vite-env.d.ts
          grep -vF '"allowImportingTsExtensions"' web/tsconfig.node.json > /tmp/tsconfig.node.json && mv /tmp/tsconfig.node.json web/tsconfig.node.json
          sed -i "s#process.env.VITE_DEV_API || 'http://localhost:8080'#'http://localhost:8080'#" web/vite.config.ts
          rm -rf .bootstrap
          rm -f BOOTSTRAP_TEST_FAILURE.log BOOTSTRAP_WEB_FAILURE.log
          rm -f .github/workflows/ci.yml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Go format and dependencies
        run: |
          gofmt -w ./cmd ./internal
          go mod tidy
      - name: Go tests
        shell: bash
        run: |
          set +e
          go test -race ./... > /tmp/go-test.log 2>&1
          rc=$?
          cat /tmp/go-test.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/go-test.log BOOTSTRAP_TEST_FAILURE.log
            git config user.name "xDrive CI"
            git config user.email "actions@users.noreply.github.com"
            git add BOOTSTRAP_TEST_FAILURE.log
            git commit -m "chore: capture bootstrap Go test failure"
            git push origin HEAD:feat/mvp-cfapi
            exit "$rc"
          fi
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./cmd/server ./cmd/xd
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Web typecheck
        shell: bash
        run: |
          set +e
          (cd web && npm run lint) > /tmp/web-typecheck.log 2>&1
          rc=$?
          cat /tmp/web-typecheck.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/web-typecheck.log BOOTSTRAP_WEB_FAILURE.log
            git config user.name "xDrive CI"
            git config user.email "actions@users.noreply.github.com"
            git add BOOTSTRAP_WEB_FAILURE.log
            git commit -m "chore: capture bootstrap Web typecheck failure"
            git push origin HEAD:feat/mvp-cfapi
            exit "$rc"
          fi
      - name: Web build
        working-directory: web
        run: npm run build
      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "xDrive CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement xDrive MVP with Linux FUSE and Windows CfAPI [bootstrap-complete]"
          git push origin HEAD:feat/mvp-cfapi
