name: Places Desktop trusted domain to selected LAN IP identity

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/places-desktop-lan-domain-ip-identity.yml'
      - 'desktop/tests/places-desktop-lan-domain-ip-identity.cjs'
      - 'desktop/src/main/lan_root_auto.cts'
      - 'desktop/src/main/places_guest_lan_tls.cts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-domain-lan-ip-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production HTTPS identity and Electron helper modules
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 openssl
          npm --prefix desktop install --no-audit --no-fund
          npm --prefix desktop run build:main
          node --check desktop/tests/places-desktop-lan-domain-ip-identity.cjs
      - name: Real domain SNI to specific RFC1918 IP, private CA and map guest certificate parity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          sudo ip addr add 10.233.15.10/32 dev lo
          trap 'sudo ip addr del 10.233.15.10/32 dev lo || true' EXIT
          XD_PLACES_TEST_LAN_IP=10.233.15.10 node --test \
            desktop/tests/places-desktop-lan-domain-ip-identity.cjs
