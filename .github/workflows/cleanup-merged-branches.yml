name: Cleanup redundant branches

# Merged PR events retire only their own exact source tip. This avoids the
# shared pending-slot cancellation and full-repository clone/scan on every
# merge. Older orphan branches are handled by prune-verified-branches.yml.
on:
  pull_request_target:
    types: [closed, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  # Each merged PR has its own slot. Manual scans stay serialized. No new
  # merged PR can evict another's pending exact-tip retirement job.
  group: cleanup-redundant-branches-${{ github.event_name == 'workflow_dispatch' && 'manual-scan' || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  retire-merged:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A write-capable pull_request_target event must NEVER check out or
      # execute the untrusted PR branch. Only trusted default-branch code.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          # The Git push uses the normal GITHUB_TOKEN; never a PAT.
          persist-credentials: true
          sparse-checkout: |
            scripts/ci/retire-merged-pr-branch.cjs
            scripts/ci/retire-merged-pr-branch.test.cjs
            scripts/ci/retire-merged-pr-workflow-contract.test.cjs
            .github/workflows/cleanup-merged-branches.yml
          sparse-checkout-cone-mode: false

      - name: Verify exact-head retirement guards
        run: |
          node --check scripts/ci/retire-merged-pr-branch.cjs
          node --test scripts/ci/retire-merged-pr-branch.test.cjs scripts/ci/retire-merged-pr-workflow-contract.test.cjs

      - name: Retire only the merged PR's unchanged, unused branch tip
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync} = require('node:child_process')
            const {retireMergedPRBranch} =
              require('./scripts/ci/retire-merged-pr-branch.cjs')
            const outcome = await retireMergedPRBranch({
              github, context,
              deleteExact: ({branch, sha}) => {
                // No shell; verify even though the helper has already
                // allowlisted this branch and SHA.
                execFileSync('git', ['check-ref-format', '--branch', branch],
                  {stdio: 'ignore'})
                try {
                  // CAS deletion: rejects an advanced remote ref even if
                  // another actor pushed after our getBranch check.
                  execFileSync('git', [
                    'push', '--force-with-lease=refs/heads/' + branch + ':' + sha,
                    'origin', ':refs/heads/' + branch,
                  ], {stdio: 'pipe', timeout: 120000})
                  return true
                } catch {
                  core.warning('Exact-HEAD branch retirement rejected by remote; preserved ' + branch)
                  return false
                }
              },
            })
            core.notice('merged PR branch cleanup: ' + outcome.reason +
              (outcome.branch ? ', branch=' + outcome.branch : ''))

  scan:
    # Full scans are intentionally manual or triggered by an explicit
    # labeled retirement review, never by routine merged PR events.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'labeled' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.pull_request.merged == true ||
          github.event.label.name == 'superseded'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Validate cleanup script
        run: bash -n scripts/cleanup-merged-branches.sh
      - name: Regression test against local Git refs
        run: bash scripts/test-cleanup-merged-branches.sh
      - name: One guarded scan for all stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-merged-branches.sh
