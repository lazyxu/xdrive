name: Cleanup redundant branches

on:
  push:
    branches: ["master"]
  pull_request_target:
    types: [closed, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-redundant-branches
  cancel-in-progress: false

jobs:
  cleanup:
    # A merged PR also pushes master, so let the push event own that cleanup and
    # avoid racing a second delete pass from the PR-closed event.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.action == 'labeled' ||
      github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      # pull_request_target has a write-capable token, so always execute the
      # cleanup script from the trusted default branch, never from PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Delete safely redundant branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-merged-branches.sh
