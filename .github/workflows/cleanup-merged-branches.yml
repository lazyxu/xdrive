name: Cleanup redundant branches

# A trusted merged/labeled PR event or explicit manual request scans all branches.
# Do not enqueue duplicate scans on every master push; daily prune covers orphans.

on:
  pull_request_target:
    types: [closed, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  # Serialize repeated scans, but do not let a new master push evict a queued
  # merged-PR event. Exact-head deletion has an atomic Git force-with-lease.
  group: cleanup-redundant-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'closed' && github.event.pull_request.merged == true) ||
          (
            github.event.action == 'labeled' &&
            (
              github.event.pull_request.merged == true ||
              github.event.label.name == 'superseded'
            )
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      # pull_request_target has a write-capable token, so always execute cleanup
      # code from the trusted default branch, never from PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate cleanup script
        run: bash -n scripts/cleanup-merged-branches.sh

      - name: Regression test against local Git refs
        run: bash scripts/test-cleanup-merged-branches.sh

      - name: Validate merged-PR queued CI cancellation selector
        run: |
          node --check scripts/ci/cancel-merged-pr-queued-ci.cjs
          node --test scripts/ci/cancel-merged-pr-queued-ci.test.cjs

      # Never evaluate code from an untrusted PR: checkout above is master.
      # Cancel only an exact SHA-matched old queued CI after its PR is merged.
      - name: Cancel obsolete queued CI for this merged PR
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const {cancelMergedPRQueuedCI} =
              require('./scripts/ci/cancel-merged-pr-queued-ci.cjs')
            const outcome = await cancelMergedPRQueuedCI({github, context})
            core.notice(outcome.reason + ': examined ' + outcome.examined +
              ' exact SHA workflow runs; requested cancellation of ' +
              outcome.cancelled.length + ' obsolete queued CI runs')

      - name: One guarded scan for all stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-merged-branches.sh
