name: PWA S4D2 Real Chrome Foreground Server Task Reconciliation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-s4d2-real-wake:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/pwa-s4d2-browser-wake-server-task-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xdrive
          POSTGRES_PASSWORD: xdrive
          POSTGRES_DB: xdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdrive -d xdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XD_TEST_DATABASE_URL: postgres://xdrive:xdrive@localhost:5432/xdrive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build authentic Web, verify Go/JS format and scope
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/api/pwa_s2b3_real_gin_auth_integration_test.go internal/api/pwa_s4d2_wake_fixture_test.go)"
          command -v xvfb-run >/dev/null && command -v Xvfb >/dev/null
          node --check desktop/scripts/pwa-s4d2-real-wake-browser.cjs
          node --test desktop/tests/pwa-s4d2-real-wake-contract.cjs
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          go test -c -o "$RUNNER_TEMP/pwa-s4d2-api.test" ./internal/api
          mkdir -p "$RUNNER_TEMP/pwa-s4d2-driver"
          npm install --prefix "$RUNNER_TEMP/pwa-s4d2-driver" --no-save --no-package-lock --ignore-scripts puppeteer-core@24.24.1
          if command -v google-chrome-stable >/dev/null; then
            echo "XD_PWA_CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "XD_PWA_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "XD_PWA_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Real Chrome browser required" >&2
            exit 1
          fi
      - name: Real Chrome background/foreground with actual Server task in Desktop and Android emulation
        env:
          XD_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XD_PR_HEAD"
          OUT="$GITHUB_WORKSPACE/desktop/pwa-s4d2-results"
          mkdir -p "$OUT"
          FIXTURE_PID=""
          READY=""
          cleanup() {
            if [ -n "$FIXTURE_PID" ] && kill -0 "$FIXTURE_PID" 2>/dev/null; then
              kill "$FIXTURE_PID" || true
              wait "$FIXTURE_PID" || true
            fi
            if [ -n "$READY" ]; then rm -f "$READY"; fi
          }
          trap cleanup EXIT
          for MODE in desktop mobile; do
            READY="$RUNNER_TEMP/pwa-s4d2-$MODE-ready.json"
            XD_PWA_S2B3_REAL_GIN=1 \
            XD_PWA_S4D2_WAKE=1 \
            XD_PWA_S2B3_READY_FILE="$READY" \
            XD_PWA_S2B3_DIST="$GITHUB_WORKSPACE/web/dist" \
              "$RUNNER_TEMP/pwa-s4d2-api.test" \
                -test.run='^TestPWAS2B3RealGinAuthFixture$' \
                -test.count=1 -test.v -test.timeout=5m \
                > "$RUNNER_TEMP/pwa-s4d2-private-gin-$MODE.log" 2>&1 &
            FIXTURE_PID=$!
            for attempt in $(seq 1 120); do
              if [ -s "$READY" ]; then break; fi
              if ! kill -0 "$FIXTURE_PID" 2>/dev/null; then
                echo "S4D2 isolated real Gin fixture exited before readiness" >&2
                exit 1
              fi
              sleep 1
            done
            test -s "$READY" || { echo "S4D2 private readiness file absent" >&2; exit 1; }
            xvfb-run -a -s '-screen 0 1920x1080x24' env \
              XDRIVE_BROWSER_EXECUTABLE="$XD_PWA_CHROME" \
              XDRIVE_PUPPETEER_MODULE="$RUNNER_TEMP/pwa-s4d2-driver/node_modules/puppeteer-core" \
              XD_PR_HEAD="$XD_PR_HEAD" \
                node desktop/scripts/pwa-s4d2-real-wake-browser.cjs \
                  --ready="$READY" --output-dir="$OUT" --mode="$MODE"
            if ! wait "$FIXTURE_PID"; then
              echo "S4D2 independent PostgreSQL owner/task postflight failed" >&2
              exit 1
            fi
            FIXTURE_PID=""
            rm -f "$READY"
            READY=""
            XD_S4D2_MODE="$MODE" node - <<'NODE'
          const fs = require('node:fs')
          const s = JSON.parse(fs.readFileSync('desktop/pwa-s4d2-results/summary-' +
            process.env.XD_S4D2_MODE + '.json', 'utf8'))
          const required = ['passed', 'realGin', 'realPostgreSQL', 'noApiMocks',
            'initialRunning', 'actualHidden', 'serverAdvancedOnly',
            'foregroundSummaryRead', 'foregroundTaskPageRead', 'uiCompleted',
            'coldReloadConsistent', 'noBrowserTaskMutations', 'onlyPublicOfflineCache']
          if (required.some(k => s[k] !== true) || s.physicalDevice || s.systemInstalled ||
              s.commit !== process.env.XD_PR_HEAD) process.exit(1)
          NODE
          done
          test "$(find "$OUT" -maxdepth 1 -name 'summary-*.json' -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-s4d2-real-foreground-sanitized
          path: desktop/pwa-s4d2-results/summary-*.json
          if-no-files-found: warn
          retention-days: 14
