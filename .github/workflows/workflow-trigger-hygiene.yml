name: PR workflow trigger hygiene

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/AGENTS.md'
      - 'docs/ci-workflow-trigger-policy.md'
      - 'scripts/ci/check_workflow_pr_scope.py'
      - 'scripts/ci/test_workflow_pr_scope.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/AGENTS.md'
      - 'scripts/ci/check_workflow_pr_scope.py'
      - 'scripts/ci/test_workflow_pr_scope.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-scope-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Unit-test scoped GitHub event filters
        run: python3 -m unittest discover -s scripts/ci -p 'test_workflow_pr_scope.py'
      - name: Reject broad standalone PR workflow triggers
        run: python3 scripts/ci/check_workflow_pr_scope.py
