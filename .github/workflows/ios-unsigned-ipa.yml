name: iOS Native Unsigned IPA

on:
  pull_request:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
      - 'scripts/ci/publish-ios-unsigned-ipa.sh'
      - 'scripts/ci/test-ios-unsigned-release.sh'
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
      - 'scripts/ci/publish-ios-unsigned-ipa.sh'
      - 'scripts/ci/test-ios-unsigned-release.sh'
  workflow_dispatch:

permissions:
  contents: read

# Cancel only superseded PR work; never evict independent master or manual artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout exact iOS release test source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test direct IPA publisher, SHA validation, and immutable release safety
        run: bash scripts/ci/test-ios-unsigned-release.sh

  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested PR merge candidate
        uses: actions/checkout@v4
        with:
          # PR checks need the real base+HEAD candidate so newer master
          # source-backed Swift contracts are present; push uses event SHA.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify native Clipboard SSE framing and Owner lifecycle contracts
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativeClipboardSSECursor.swift \
            ios/tests/ClipboardSSECursorChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-clipboard-sse"
          "$RUNNER_TEMP/xdrive-ios-clipboard-sse"
          node --test desktop/tests/native-clipboard-sse-contract.cjs

      - name: Verify iOS explicit Clipboard Share Extension input and privacy boundary
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/ClipboardShareExtension/ClipboardSharePolicy.swift \
            ios/tests/ClipboardSharePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-clipboard-share"
          "$RUNNER_TEMP/xdrive-ios-clipboard-share"
          node --test desktop/tests/ios-native-clipboard-share-extension.cjs

      - name: Verify native Clipboard device-bound key and Owner proof contracts
        run: |
          node --test desktop/tests/ios-native-clipboard-device-e2ee.cjs

      - name: Verify Clipboard encrypted file ref opens existing authenticated iOS Files Viewer
        run: |
          node --test desktop/tests/ios-native-clipboard-viewer-contract.cjs

      - name: Verify immutable photo and person selectors
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativePhotoContentIdentity.swift \
            ios/tests/NativePhotoContentIdentityChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-content-identity"
          "$RUNNER_TEMP/xdrive-ios-content-identity"

      - name: Verify persistent unified Gallery fingerprint index
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativePhotoFingerprintStore.swift \
            ios/tests/NativePhotoFingerprintStoreChecks.swift \
            -lsqlite3 -o "$RUNNER_TEMP/xdrive-ios-gallery-fingerprints"
          "$RUNNER_TEMP/xdrive-ios-gallery-fingerprints"
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativeUnifiedGalleryPolicy.swift \
            ios/tests/NativeUnifiedGalleryChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-unified-gallery"
          "$RUNNER_TEMP/xdrive-ios-unified-gallery"
          node --test desktop/tests/ios-native-unified-photo-gallery.cjs
          # Navigation regressions guard bounded Gallery/Files native returns.
          node --test desktop/tests/ios-native-navigation-continuity.cjs

      - name: Verify cold launch recovery and BG registration safety
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeLaunchCheckpoint.swift \
            ios/tests/NativeLaunchCheckpointChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-launch-check"
          "$RUNNER_TEMP/xdrive-ios-launch-check"
          node --test desktop/tests/ios-native-launch-recovery.cjs

      # Pure Foundation contract test is quick and independent of signing.
      - name: Verify native cloud OCR detail privacy and decoding
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativeCloudOCRPolicy.swift \
            ios/tests/NativeCloudOCRPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-cloud-ocr"
          "$RUNNER_TEMP/xdrive-ios-cloud-ocr"

      - name: Verify Apple Notes import text and source identity policy
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativeAppleNotesImportPolicy.swift \
            ios/tests/NativeAppleNotesImportPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-notes-import-policy"
          "$RUNNER_TEMP/xdrive-ios-notes-import-policy"

      - name: Verify explicit Markdown plus local image import policy
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativeNotesManualImportPolicy.swift \
            ios/tests/NativeNotesManualImportPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-notes-manual-import"
          "$RUNNER_TEMP/xdrive-ios-notes-manual-import"

      - name: Verify native Notes launcher and Owner-only editor contracts
        run: |
          set -euo pipefail
          node --test desktop/tests/ios-native-notes-route.cjs

      - name: Verify bounded iOS PhotoKit scan-window math
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupScanWindow.swift \
            ios/tests/PhotoBackupScanWindowChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-window-check"
          "$RUNNER_TEMP/xdrive-ios-window-check"

      - name: Verify truthful bounded iOS original backup window scan progress
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupScanWindow.swift \
            ios/XDriveIOS/NativeBackupWindowReadProgress.swift \
            ios/tests/NativeBackupWindowReadProgressChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-window-read-progress"
          "$RUNNER_TEMP/xdrive-ios-window-read-progress"
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupIssueSummary.swift \
            ios/tests/PhotoBackupIssueSummaryChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photo-issues"
          "$RUNNER_TEMP/xdrive-ios-photo-issues"
          node --test desktop/tests/ios-native-photo-backup-window-progress.cjs

      - name: Verify crash-durable Owner-local PhotoKit queue SQLite
        run: |
          set -euo pipefail
          # Native Swift/SQLite state transitions, not merely source regexes.
          # This executes both the 70-item out-of-window selected retry and
          # obsolete failure-reason transaction cleanup on the exact PR HEAD.
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/PhotoBackupChangeQueueStore.swift \
            ios/tests/PhotoBackupChangeQueueStoreChecks.swift \
            -lsqlite3 -o "$RUNNER_TEMP/xdrive-ios-photo-queue-sqlite"
          "$RUNNER_TEMP/xdrive-ios-photo-queue-sqlite"
          node --test \
            desktop/tests/ios-photo-persistent-failure-reasons.cjs \
            desktop/tests/ios-photo-single-failed-retry.cjs

      - name: Verify V2 PhotoKit journal shard routing
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoLedgerShardPolicy.swift \
            ios/tests/PhotoLedgerShardPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-shard-policy-check"
          "$RUNNER_TEMP/xdrive-ios-shard-policy-check"

      - name: Verify bounded iOS receipt batch on 100k metadata
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoPendingBatchAccumulator.swift \
            ios/tests/PhotoPendingBatchAccumulatorChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-receipt-batch-check"
          "$RUNNER_TEMP/xdrive-ios-receipt-batch-check"

      - name: Verify persistent PhotoKit cursor generation policy
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoCursorEpochPolicy.swift \
            ios/tests/PhotoCursorEpochPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-epoch-check"
          "$RUNNER_TEMP/xdrive-ios-epoch-check"

      - name: Verify bounded stable PhotoKit equal-date backup boundaries
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupTieBoundaryPolicy.swift \
            ios/tests/PhotoBackupTieBoundaryPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-tie-boundary-check"
          "$RUNNER_TEMP/xdrive-ios-tie-boundary-check"

      - name: Verify shared foreground and background PhotoKit epoch fences
        run: node --test desktop/tests/ios-photo-cursor-epoch.cjs desktop/tests/ios-bg-cursor-epoch.cjs

      - name: Verify foreground automatic schedule and bounded cursor
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoAutoSchedulePolicy.swift \
            ios/tests/PhotoAutoSchedulePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-auto-policy-check"
          "$RUNNER_TEMP/xdrive-ios-auto-policy-check"

      - name: Verify native iPhone managed Photos backup destination contract
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativePhotoBackupDestinationNamePolicy.swift \
            ios/tests/NativePhotoBackupDestinationNamePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photo-destination-name-check"
          "$RUNNER_TEMP/xdrive-ios-photo-destination-name-check"
          node --test \
            desktop/tests/ios-native-photo-managed-destination-contract.cjs \
            desktop/tests/ios-native-photo-destination-ui.cjs

      - name: Verify native managed original upload route and exact receipts
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/BackgroundOriginalRoutePolicy.swift \
            ios/XDriveIOS/ManagedPhotoUploadRoutePolicy.swift \
            ios/tests/ManagedPhotoUploadRoutePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-managed-upload-route-check"
          "$RUNNER_TEMP/xdrive-ios-managed-upload-route-check"
          node --test \
            desktop/tests/ios-native-photo-managed-foreground-contract.cjs \
            desktop/tests/ios-native-photo-managed-background-contract.cjs
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/PhotoBackupDestinationCursorPolicy.swift \
            ios/tests/PhotoBackupDestinationCursorPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photo-managed-cursor-check"
          "$RUNNER_TEMP/xdrive-ios-photo-managed-cursor-check"

      - name: Verify focused first-pass native PhotoKit window progression
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupScanWindow.swift \
            ios/XDriveIOS/PhotoAutoSchedulePolicy.swift \
            ios/XDriveIOS/PhotoFocusedBackupPolicy.swift \
            ios/tests/PhotoFocusedBackupPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-focused-policy-check"
          "$RUNNER_TEMP/xdrive-ios-focused-policy-check"
          node --test desktop/tests/ios-native-photo-focused-backup.cjs

      - name: Verify bounded private PhotoKit orphan staging cleanup
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoStagingCleanup.swift \
            ios/tests/PhotoStagingCleanupChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-private-staging-check"
          "$RUNNER_TEMP/xdrive-ios-private-staging-check"
          node --test desktop/tests/ios-photo-staging-cleanup.cjs

      - name: Verify original still/video media limits
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupMediaPolicy.swift \
            ios/tests/PhotoOriginalMediaPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-original-media-check"
          "$RUNNER_TEMP/xdrive-ios-original-media-check"

      - name: Verify lossless Live still/motion ZIP and manifest
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/LiveOriginalArchive.swift \
            ios/tests/LiveOriginalArchiveChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-live-original-check"
          "$RUNNER_TEMP/xdrive-ios-live-original-check"

      - name: Verify bounded cloud Live ZIP extraction and corruption cleanup
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/LiveOriginalArchive.swift \
            ios/XDriveIOS/LivePreviewArchive.swift \
            ios/tests/LivePreviewArchiveChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-live-preview-check"
          "$RUNNER_TEMP/xdrive-ios-live-preview-check"
          node --test desktop/tests/ios-native-cloud-preview-scene-lifecycle.cjs

      - name: Verify native background grant token and expiry contract
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackgroundGrantPolicy.swift \
            ios/tests/PhotoBackgroundGrantPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-native-grant-check"
          "$RUNNER_TEMP/xdrive-ios-native-grant-check"

      - name: Verify approved iOS BG credential interval and lifetime
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/BGApprovalPolicy.swift \
            ios/tests/BGApprovalPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-bg-approval-check"
          "$RUNNER_TEMP/xdrive-ios-bg-approval-check"

      - name: Verify native background Owner-root route and filename fencing
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/BackgroundOriginalRoutePolicy.swift \
            ios/tests/BackgroundOriginalRoutePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-bg-route-check"
          "$RUNNER_TEMP/xdrive-ios-bg-route-check"

      - name: Verify actual bounded background original safety and native BG consent
        run: node --test desktop/tests/ios-bg-bounded-original-runner.cjs desktop/tests/ios-native-background-grant-ui.cjs

      - name: Verify read-only native Gallery cache retention on revoked access
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeMediaPageRetryPolicy.swift \
            ios/tests/NativeMediaPageRetryPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-gallery-retention-check"
          "$RUNNER_TEMP/xdrive-ios-gallery-retention-check"

      - name: Verify native HTTPS LAN pre-login selection without credential retries
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativeLANTrust.swift \
            ios/XDriveIOS/AuthService.swift \
            ios/XDriveIOS/NativeLANCertificateBootstrap.swift \
            ios/XDriveIOS/NativeLANLoginRoute.swift \
            ios/tests/NativeLANLoginRouteChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-lan-route-check"
          "$RUNNER_TEMP/xdrive-ios-lan-route-check"
          node --test desktop/tests/ios-native-lan-ip-login.cjs
          bash ios/tests/check-native-lan-trust.sh "$RUNNER_TEMP"

      - name: Reproduce and classify native login TLS, Owner/root and retry errors
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativeLANTrust.swift \
            ios/XDriveIOS/AuthService.swift \
            ios/XDriveIOS/OwnerRootVerifier.swift \
            ios/XDriveIOS/NativeOwnerSessionStore.swift \
            ios/XDriveIOS/NativeOwnerLoginFailurePolicy.swift \
            ios/tests/NativeOwnerLoginFailureChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-login-failure-policy"
          "$RUNNER_TEMP/xdrive-ios-login-failure-policy"
          node --test desktop/tests/ios-native-owner-login-errors.cjs

      - name: Verify native password profiles never mix LAN routes or Owner keys
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/NativeLANTrust.swift \
            ios/XDriveIOS/AuthService.swift \
            ios/XDriveIOS/NativeLANCertificateBootstrap.swift \
            ios/XDriveIOS/NativeLANLoginRoute.swift \
            ios/XDriveIOS/NativeOwnerSessionStore.swift \
            ios/XDriveIOS/NativePasswordProfiles.swift \
            ios/tests/NativePasswordProfilesChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-saved-login-profiles"
          "$RUNNER_TEMP/xdrive-ios-saved-login-profiles"

      - name: Verify native historical receipt counts never claim full-library completion
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoCoveragePolicy.swift \
            ios/tests/NativePhotoCoveragePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photo-coverage"
          "$RUNNER_TEMP/xdrive-ios-photo-coverage"
          node --test desktop/tests/ios-native-photo-coverage.cjs

      - name: Verify explicit current PhotoKit original Owner Node proof policy
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCurrentPhotoReceiptPolicy.swift \
            ios/tests/NativeCurrentPhotoReceiptPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-current-photo-receipt-check"
          "$RUNNER_TEMP/xdrive-ios-current-photo-receipt-check"
          node --test desktop/tests/ios-native-photo-current-receipt.cjs

      - name: Verify bounded local PhotoKit Viewer filmstrip identity and thumbnail contract
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeLocalPhotoViewerFilmstripPolicy.swift \
            ios/tests/NativeLocalPhotoViewerFilmstripPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photo-filmstrip-check"
          "$RUNNER_TEMP/xdrive-ios-photo-filmstrip-check"
          node --test desktop/tests/ios-native-photo-filmstrip-contract.cjs

      - name: Verify bounded native PhotoKit and Owner PhotoAsset filmstrip scrub gesture
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoFilmstripScrubPolicy.swift \
            ios/tests/NativePhotoFilmstripScrubPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photo-filmstrip-scrub"
          "$RUNNER_TEMP/xdrive-ios-photo-filmstrip-scrub"
          node --test desktop/tests/ios-native-photo-filmstrip-scrub-contract.cjs

      - name: Verify native Photos Owner, auto backup, cloud thumbnail and receipt contracts
        run: |
          set -euo pipefail
          node --test \
            desktop/tests/ios-native-historical-screen-recovery.cjs \
            desktop/tests/ios-native-owner-login-foundation.cjs \
            desktop/tests/ios-native-direct-workspace-entry.cjs \
            desktop/tests/ios-native-no-webview-fallback.cjs \
            desktop/tests/ios-native-photos-auto-view-mvp.cjs \
            desktop/tests/ios-native-photo-receipt-review.cjs \
            desktop/tests/ios-native-cloud-original-thumbnail-wall.cjs \
            desktop/tests/ios-native-auto-foreground-root-lifecycle.cjs \
            desktop/tests/ios-native-album-navigation.cjs \
            desktop/tests/ios-native-album-continuous.cjs \
            desktop/tests/ios-native-five-tab-navigation.cjs \
            desktop/tests/ios-native-photo-zoom-viewer.cjs \
            desktop/tests/ios-native-photo-viewer-return.cjs \
            desktop/tests/ios-native-photoasset-gallery.cjs \
            desktop/tests/ios-native-cloud-still-bounded-preview.cjs \
            desktop/tests/ios-native-photo-auto-ack-enable-guard.cjs \
            desktop/tests/ios-native-photo-detail-permission-fence.cjs \
            desktop/tests/ios-native-local-viewer-on-demand-icloud.cjs \
            desktop/tests/ios-native-photo-cloud-confirmed-refresh.cjs \
            desktop/tests/ios-native-cloud-preview-scene-lifecycle.cjs

      - name: Verify native PhotoAsset Viewer cloud filmstrip Owner and revision admission
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudPhotoAssetFilmstripPolicy.swift \
            ios/tests/NativeCloudPhotoAssetFilmstripPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photoasset-filmstrip-check"
          "$RUNNER_TEMP/xdrive-ios-photoasset-filmstrip-check"
          node --test desktop/tests/ios-native-cloud-filmstrip-contract.cjs

      - name: Verify native Cloud Originals Viewer filmstrip Owner and exact Node identity
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudOriginalFilmstripPolicy.swift \
            ios/tests/NativeCloudOriginalFilmstripPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-original-filmstrip-policy"
          "$RUNNER_TEMP/xdrive-ios-original-filmstrip-policy"
          node --test desktop/tests/ios-native-cloud-original-filmstrip.cjs

      - name: Verify native cloud PhotoAsset original still/video save-to-Photos boundaries
        run: node --test desktop/tests/ios-native-photoasset-original-restore.cjs

      - name: Verify native cloud Live Photo original pair add-to-Photos
        run: node --test desktop/tests/ios-native-photoasset-live-original-restore.cjs

      - name: Verify native bounded PhotoKit metadata filename/date/media search
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoSearchQueryPolicy.swift \
            ios/tests/NativePhotoSearchQueryPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-local-photo-search"
          "$RUNNER_TEMP/xdrive-ios-local-photo-search"
          node --test desktop/tests/ios-native-photo-metadata-search.cjs

      - name: Verify native whole-library PhotoKit calendar jump policy
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoTimelinePolicy.swift \
            ios/tests/NativePhotoTimelinePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-local-calendar-check"
          "$RUNNER_TEMP/xdrive-ios-local-calendar-check"
          node --test desktop/tests/ios-native-photo-timeline.cjs desktop/tests/ios-native-local-continuous.cjs
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeLocalPhotoSharePolicy.swift \
            ios/tests/NativeLocalPhotoSharePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-local-share-policy"
          "$RUNNER_TEMP/xdrive-ios-local-share-policy"

      - name: Verify native Photos square thumbnail density without rescan
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoWallDensityPolicy.swift \
            ios/tests/NativePhotoWallDensityPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-wall-density-policy"
          "$RUNNER_TEMP/xdrive-ios-wall-density-policy"
          node --test desktop/tests/ios-native-photo-wall-density.cjs desktop/tests/ios-native-photo-wall-shared.cjs

      - name: Verify native PhotoKit actual-day group boundaries
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoDayGroupingPolicy.swift \
            ios/tests/NativePhotoDayGroupingPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photo-day-group"
          "$RUNNER_TEMP/xdrive-ios-photo-day-group"

      - name: Verify native Live and screenshot full-library subtype filters
        run: node --test desktop/tests/ios-native-photo-subtype-filter.cjs

      - name: Verify native PhotoKit full-library media filtering
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -framework Photos -framework Photos \
            ios/XDriveIOS/NativePhotoMediaFilterPolicy.swift \
            ios/tests/NativePhotoMediaFilterChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-media-filter"
          "$RUNNER_TEMP/xdrive-ios-media-filter"
          node --test desktop/tests/ios-native-photo-subtype-filter.cjs

      - name: Verify native PhotoAsset Viewer bounded neighbors
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoAssetViewerNeighborPolicy.swift \
            ios/tests/NativePhotoAssetViewerNeighborPolicyChecks.swift \
