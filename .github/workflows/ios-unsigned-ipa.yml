name: iOS Native Unsigned IPA

on:
  pull_request:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel only superseded PR work; never evict independent master or manual artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Pure Foundation contract test is quick and independent of signing.
      - name: Verify bounded iOS PhotoKit scan-window math
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupScanWindow.swift \
            ios/tests/PhotoBackupScanWindowChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-window-check"
          "$RUNNER_TEMP/xdrive-ios-window-check"

      - name: Verify V2 PhotoKit journal shard routing
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoLedgerShardPolicy.swift \
            ios/tests/PhotoLedgerShardPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-shard-policy-check"
          "$RUNNER_TEMP/xdrive-ios-shard-policy-check"

      - name: Verify bounded iOS receipt batch on 100k metadata
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoPendingBatchAccumulator.swift \
            ios/tests/PhotoPendingBatchAccumulatorChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-receipt-batch-check"
          "$RUNNER_TEMP/xdrive-ios-receipt-batch-check"

      - name: Verify persistent PhotoKit cursor generation policy
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoCursorEpochPolicy.swift \
            ios/tests/PhotoCursorEpochPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-epoch-check"
          "$RUNNER_TEMP/xdrive-ios-epoch-check"

      - name: Verify shared foreground and background PhotoKit epoch fences
        run: node --test desktop/tests/ios-photo-cursor-epoch.cjs desktop/tests/ios-bg-cursor-epoch.cjs

      - name: Verify foreground automatic schedule and bounded cursor
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoAutoSchedulePolicy.swift \
            ios/tests/PhotoAutoSchedulePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-auto-policy-check"
          "$RUNNER_TEMP/xdrive-ios-auto-policy-check"

      - name: Verify bounded private PhotoKit orphan staging cleanup
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoStagingCleanup.swift \
            ios/tests/PhotoStagingCleanupChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-private-staging-check"
          "$RUNNER_TEMP/xdrive-ios-private-staging-check"
          node --test desktop/tests/ios-photo-staging-cleanup.cjs

      - name: Verify original still/video media limits
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupMediaPolicy.swift \
            ios/tests/PhotoOriginalMediaPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-original-media-check"
          "$RUNNER_TEMP/xdrive-ios-original-media-check"

      - name: Verify lossless Live still/motion ZIP and manifest
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/LiveOriginalArchive.swift \
            ios/tests/LiveOriginalArchiveChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-live-original-check"
          "$RUNNER_TEMP/xdrive-ios-live-original-check"

      - name: Verify native background grant token and expiry contract
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackgroundGrantPolicy.swift \
            ios/tests/PhotoBackgroundGrantPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-native-grant-check"
          "$RUNNER_TEMP/xdrive-ios-native-grant-check"

      - name: Verify approved iOS BG credential interval and lifetime
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/BGApprovalPolicy.swift \
            ios/tests/BGApprovalPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-bg-approval-check"
          "$RUNNER_TEMP/xdrive-ios-bg-approval-check"

      - name: Verify native background Owner-root route and filename fencing
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/BackgroundOriginalRoutePolicy.swift \
            ios/tests/BackgroundOriginalRoutePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-bg-route-check"
          "$RUNNER_TEMP/xdrive-ios-bg-route-check"

      - name: Verify actual bounded background original safety contract
        run: node --test desktop/tests/ios-bg-bounded-original-runner.cjs

      - name: Verify native Photos Owner, auto backup, cloud thumbnail and receipt contracts
        run: |
          set -euo pipefail
          node --test \
            desktop/tests/ios-native-historical-screen-recovery.cjs \
            desktop/tests/ios-native-owner-login-foundation.cjs \
            desktop/tests/ios-native-photos-auto-view-mvp.cjs \
            desktop/tests/ios-native-photo-receipt-review.cjs \
            desktop/tests/ios-native-cloud-original-thumbnail-wall.cjs \
            desktop/tests/ios-native-auto-foreground-root-lifecycle.cjs \
            desktop/tests/ios-native-album-navigation.cjs \
            desktop/tests/ios-native-five-tab-navigation.cjs \
            desktop/tests/ios-native-photo-zoom-viewer.cjs \
            desktop/tests/ios-native-photo-viewer-return.cjs \
            desktop/tests/ios-native-cloud-still-bounded-preview.cjs

      - name: Prepare native brand and home screen icon
        run: bash ios/scripts/prepare-assets.sh

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios
          xcodegen generate --spec project.yml

      - name: Compile unsigned iOS device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/xDriveIOS.xcodeproj \
            -scheme xDriveIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/xdrive-ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Validate app and package SideStore compatible IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/xdrive-ios-build/Build/Products/Release-iphoneos/xDriveIOS.app"
          test -s "$app/xDriveIOS"
          test -s "$app/Assets.car"
          test ! -e "$app/embedded.mobileprovision"
          actual=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          test "$actual" = 'com.lazyxu.xdrive.ios'
          /usr/libexec/PlistBuddy -c 'Print NSLocalNetworkUsageDescription' "$app/Info.plist" | grep -Fq 'xDrive'
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$app" "$RUNNER_TEMP/unsigned/Payload/"
          (
            cd "$RUNNER_TEMP/unsigned"
            zip -qry "$GITHUB_WORKSPACE/xDrive-unsigned.ipa" Payload
          )
          unzip -tq xDrive-unsigned.ipa
          shasum -a 256 xDrive-unsigned.ipa > xDrive-unsigned.ipa.sha256

      - name: Upload unsigned IPA and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: xDrive-iOS-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            xDrive-unsigned.ipa
            xDrive-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
