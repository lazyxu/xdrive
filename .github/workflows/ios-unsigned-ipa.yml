name: iOS Native Unsigned IPA

on:
  pull_request:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel only superseded PR work; never evict independent master or manual artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify cold launch recovery and BG registration safety
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeLaunchCheckpoint.swift \
            ios/tests/NativeLaunchCheckpointChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-launch-check"
          "$RUNNER_TEMP/xdrive-ios-launch-check"
          node --test desktop/tests/ios-native-launch-recovery.cjs

      # Pure Foundation contract test is quick and independent of signing.
      - name: Verify bounded iOS PhotoKit scan-window math
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupScanWindow.swift \
            ios/tests/PhotoBackupScanWindowChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-window-check"
          "$RUNNER_TEMP/xdrive-ios-window-check"

      - name: Verify truthful bounded iOS original backup window scan progress
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupScanWindow.swift \
            ios/XDriveIOS/NativeBackupWindowReadProgress.swift \
            ios/tests/NativeBackupWindowReadProgressChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-window-read-progress"
          "$RUNNER_TEMP/xdrive-ios-window-read-progress"
          node --test desktop/tests/ios-native-photo-backup-window-progress.cjs

      - name: Verify V2 PhotoKit journal shard routing
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoLedgerShardPolicy.swift \
            ios/tests/PhotoLedgerShardPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-shard-policy-check"
          "$RUNNER_TEMP/xdrive-ios-shard-policy-check"

      - name: Verify bounded iOS receipt batch on 100k metadata
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoPendingBatchAccumulator.swift \
            ios/tests/PhotoPendingBatchAccumulatorChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-receipt-batch-check"
          "$RUNNER_TEMP/xdrive-ios-receipt-batch-check"

      - name: Verify persistent PhotoKit cursor generation policy
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoCursorEpochPolicy.swift \
            ios/tests/PhotoCursorEpochPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-epoch-check"
          "$RUNNER_TEMP/xdrive-ios-epoch-check"

      - name: Verify shared foreground and background PhotoKit epoch fences
        run: node --test desktop/tests/ios-photo-cursor-epoch.cjs desktop/tests/ios-bg-cursor-epoch.cjs

      - name: Verify foreground automatic schedule and bounded cursor
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoAutoSchedulePolicy.swift \
            ios/tests/PhotoAutoSchedulePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-auto-policy-check"
          "$RUNNER_TEMP/xdrive-ios-auto-policy-check"

      - name: Verify bounded private PhotoKit orphan staging cleanup
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoStagingCleanup.swift \
            ios/tests/PhotoStagingCleanupChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-private-staging-check"
          "$RUNNER_TEMP/xdrive-ios-private-staging-check"
          node --test desktop/tests/ios-photo-staging-cleanup.cjs

      - name: Verify original still/video media limits
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackupMediaPolicy.swift \
            ios/tests/PhotoOriginalMediaPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-original-media-check"
          "$RUNNER_TEMP/xdrive-ios-original-media-check"

      - name: Verify lossless Live still/motion ZIP and manifest
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/LiveOriginalArchive.swift \
            ios/tests/LiveOriginalArchiveChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-live-original-check"
          "$RUNNER_TEMP/xdrive-ios-live-original-check"

      - name: Verify bounded cloud Live ZIP extraction and corruption cleanup
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/LiveOriginalArchive.swift \
            ios/XDriveIOS/LivePreviewArchive.swift \
            ios/tests/LivePreviewArchiveChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-live-preview-check"
          "$RUNNER_TEMP/xdrive-ios-live-preview-check"
          node --test desktop/tests/ios-native-cloud-preview-scene-lifecycle.cjs

      - name: Verify native background grant token and expiry contract
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/PhotoBackgroundGrantPolicy.swift \
            ios/tests/PhotoBackgroundGrantPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-native-grant-check"
          "$RUNNER_TEMP/xdrive-ios-native-grant-check"

      - name: Verify approved iOS BG credential interval and lifetime
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/BGApprovalPolicy.swift \
            ios/tests/BGApprovalPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-bg-approval-check"
          "$RUNNER_TEMP/xdrive-ios-bg-approval-check"

      - name: Verify native background Owner-root route and filename fencing
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/BackgroundOriginalRoutePolicy.swift \
            ios/tests/BackgroundOriginalRoutePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-bg-route-check"
          "$RUNNER_TEMP/xdrive-ios-bg-route-check"

      - name: Verify actual bounded background original safety and native BG consent
        run: node --test desktop/tests/ios-bg-bounded-original-runner.cjs desktop/tests/ios-native-background-grant-ui.cjs

      - name: Verify read-only native Gallery cache retention on revoked access
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeMediaPageRetryPolicy.swift \
            ios/tests/NativeMediaPageRetryPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-gallery-retention-check"
          "$RUNNER_TEMP/xdrive-ios-gallery-retention-check"

      - name: Verify native HTTPS LAN pre-login selection without credential retries
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/AuthService.swift \
            ios/XDriveIOS/NativeLANLoginRoute.swift \
            ios/tests/NativeLANLoginRouteChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-lan-route-check"
          "$RUNNER_TEMP/xdrive-ios-lan-route-check"
          node --test desktop/tests/ios-native-lan-ip-login.cjs

      - name: Reproduce and classify native login TLS, Owner/root and retry errors
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/AuthService.swift \
            ios/XDriveIOS/OwnerRootVerifier.swift \
            ios/XDriveIOS/NativeOwnerSessionStore.swift \
            ios/XDriveIOS/NativeOwnerLoginFailurePolicy.swift \
            ios/tests/NativeOwnerLoginFailureChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-login-failure-policy"
          "$RUNNER_TEMP/xdrive-ios-login-failure-policy"
          node --test desktop/tests/ios-native-owner-login-errors.cjs

      - name: Verify native password profiles never mix LAN routes or Owner keys
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -parse-as-library \
            ios/XDriveIOS/AuthService.swift \
            ios/XDriveIOS/NativeLANLoginRoute.swift \
            ios/XDriveIOS/NativeOwnerSessionStore.swift \
            ios/XDriveIOS/NativePasswordProfiles.swift \
            ios/tests/NativePasswordProfilesChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-saved-login-profiles"
          "$RUNNER_TEMP/xdrive-ios-saved-login-profiles"

      - name: Verify native historical receipt counts never claim full-library completion
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoCoveragePolicy.swift \
            ios/tests/NativePhotoCoveragePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photo-coverage"
          "$RUNNER_TEMP/xdrive-ios-photo-coverage"
          node --test desktop/tests/ios-native-photo-coverage.cjs

      - name: Verify explicit current PhotoKit original Owner Node proof policy
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCurrentPhotoReceiptPolicy.swift \
            ios/tests/NativeCurrentPhotoReceiptPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-current-photo-receipt-check"
          "$RUNNER_TEMP/xdrive-ios-current-photo-receipt-check"
          node --test desktop/tests/ios-native-photo-current-receipt.cjs

      - name: Verify native Photos Owner, auto backup, cloud thumbnail and receipt contracts
        run: |
          set -euo pipefail
          node --test \
            desktop/tests/ios-native-historical-screen-recovery.cjs \
            desktop/tests/ios-native-owner-login-foundation.cjs \
            desktop/tests/ios-native-direct-workspace-entry.cjs \
            desktop/tests/ios-native-no-webview-fallback.cjs \
            desktop/tests/ios-native-photos-auto-view-mvp.cjs \
            desktop/tests/ios-native-photo-receipt-review.cjs \
            desktop/tests/ios-native-cloud-original-thumbnail-wall.cjs \
            desktop/tests/ios-native-auto-foreground-root-lifecycle.cjs \
            desktop/tests/ios-native-album-navigation.cjs \
            desktop/tests/ios-native-five-tab-navigation.cjs \
            desktop/tests/ios-native-photo-zoom-viewer.cjs \
            desktop/tests/ios-native-photo-viewer-return.cjs \
            desktop/tests/ios-native-photoasset-gallery.cjs \
            desktop/tests/ios-native-cloud-still-bounded-preview.cjs \
            desktop/tests/ios-native-photo-auto-ack-enable-guard.cjs \
            desktop/tests/ios-native-photo-detail-permission-fence.cjs \
            desktop/tests/ios-native-local-viewer-on-demand-icloud.cjs \
            desktop/tests/ios-native-photo-cloud-confirmed-refresh.cjs \
            desktop/tests/ios-native-cloud-preview-scene-lifecycle.cjs

      - name: Verify native cloud PhotoAsset original still/video save-to-Photos boundaries
        run: node --test desktop/tests/ios-native-photoasset-original-restore.cjs

      - name: Verify native whole-library PhotoKit calendar jump policy
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoTimelinePolicy.swift \
            ios/tests/NativePhotoTimelinePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-local-calendar-check"
          "$RUNNER_TEMP/xdrive-ios-local-calendar-check"
          node --test desktop/tests/ios-native-photo-timeline.cjs desktop/tests/ios-native-local-continuous.cjs
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeLocalPhotoSharePolicy.swift \
            ios/tests/NativeLocalPhotoSharePolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-local-share-policy"
          "$RUNNER_TEMP/xdrive-ios-local-share-policy"

      - name: Verify native Photos square thumbnail density without rescan
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoWallDensityPolicy.swift \
            ios/tests/NativePhotoWallDensityPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-wall-density-policy"
          "$RUNNER_TEMP/xdrive-ios-wall-density-policy"
          node --test desktop/tests/ios-native-photo-wall-density.cjs

      - name: Verify native PhotoKit actual-day group boundaries
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoDayGroupingPolicy.swift \
            ios/tests/NativePhotoDayGroupingPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photo-day-group"
          "$RUNNER_TEMP/xdrive-ios-photo-day-group"

      - name: Verify native PhotoKit full-library media filtering
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoMediaFilterPolicy.swift \
            ios/tests/NativePhotoMediaFilterChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-media-filter"
          "$RUNNER_TEMP/xdrive-ios-media-filter"

      - name: Verify native PhotoAsset Viewer bounded neighbors
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoAssetViewerNeighborPolicy.swift \
            ios/tests/NativePhotoAssetViewerNeighborPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photoasset-viewer-neighbors"
          "$RUNNER_TEMP/xdrive-ios-photoasset-viewer-neighbors"
          node --test desktop/tests/ios-native-photoasset-viewer-neighbors.cjs desktop/tests/ios-native-photoasset-live.cjs

      - name: Verify native cloud PhotoAsset cross-range Viewer and numeric cursor
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoAssetRangeCursorPolicy.swift \
            ios/tests/NativePhotoAssetRangeCursorChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-photoasset-range-cursor"
          "$RUNNER_TEMP/xdrive-ios-photoasset-range-cursor"
          node --test desktop/tests/ios-native-photoasset-viewer-adjacent-range.cjs

      - name: Verify native PhotoKit Viewer tile scroll return
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoViewerReturnAnchorPolicy.swift \
            ios/tests/NativePhotoViewerReturnAnchorPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-viewer-return-tile"
          "$RUNNER_TEMP/xdrive-ios-viewer-return-tile"
          node --test desktop/tests/ios-native-photo-viewer-tile-scroll.cjs

      - name: Verify native five-slot, Owner route resume and Gallery L2 focus
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeNavigationRouteStore.swift \
            ios/tests/NativeNavigationRouteStoreChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-nav-route-check"
          "$RUNNER_TEMP/xdrive-ios-nav-route-check"
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeFocusVisibilityPolicy.swift \
            ios/tests/NativeFocusVisibilityPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-focus-policy-check"
          "$RUNNER_TEMP/xdrive-ios-focus-policy-check"
          node --test \
            desktop/tests/ios-native-owner-scope-tab-reset.cjs \
            desktop/tests/ios-native-route-resume-wiring.cjs \
            desktop/tests/ios-native-compact-bottom-bar.cjs \
            desktop/tests/ios-native-l2-focus-bar-integration.cjs \
            desktop/tests/ios-native-supported-orientations.cjs

      - name: Verify native album Viewer exact adjacent PhotoKit page and return anchor
        run: node --test desktop/tests/ios-native-album-viewer-adjacent.cjs

      - name: Verify native bounded MapKit PhotoKit page and Gallery route
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativePhotoMapPolicy.swift \
            ios/tests/NativePhotoMapPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-native-map-policy-check"
          "$RUNNER_TEMP/xdrive-ios-native-map-policy-check"
          # Full-library streaming aggregation keeps only 64 representatives
          # while exercising a deterministic 100k-item metadata simulation.
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeLocalPhotoMapSpatialPolicy.swift \
            ios/tests/NativeLocalPhotoMapSpatialPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-full-photo-gps-policy-check"
          "$RUNNER_TEMP/xdrive-ios-full-photo-gps-policy-check"
          node --test desktop/tests/ios-native-photo-map-mvp.cjs

      - name: Verify native Owner WGS84 map overview transport
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeOwnerPhotoMapOverview.swift \
            ios/tests/NativeOwnerPhotoMapOverviewChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-native-owner-map-overview"
          "$RUNNER_TEMP/xdrive-ios-native-owner-map-overview"
          node --test desktop/tests/ios-native-owner-map-overview.cjs

      - name: Verify native Owner MapKit to original GPS PhotoAsset Range
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeOwnerPhotoMapOverview.swift \
            ios/XDriveIOS/NativeOwnerMapSelectionPolicy.swift \
            ios/tests/NativeOwnerMapSelectionPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-owner-map-selection-policy"
          "$RUNNER_TEMP/xdrive-ios-owner-map-selection-policy"
          node --test desktop/tests/ios-native-owner-map-gallery.cjs

      - name: Verify native Files Owner Range, search and fixed-tab wiring
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudFilesPolicy.swift \
            ios/tests/NativeCloudFilesPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-page-check"
          "$RUNNER_TEMP/xdrive-ios-files-page-check"
          node --test desktop/tests/ios-native-files-browser.cjs

      - name: Verify native Files Viewer bounded navigation and Owner preview contracts
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudFilesPolicy.swift \
            ios/XDriveIOS/NativeFilesViewerPolicy.swift \
            ios/tests/NativeFilesViewerPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-viewer-policy"
          "$RUNNER_TEMP/xdrive-ios-files-viewer-policy"
          node --test desktop/tests/ios-native-files-viewer.cjs

      - name: Verify native Files folder creation name and Owner-scoped POST
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeFilesFolderNamePolicy.swift \
            ios/tests/NativeFilesFolderNameChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-folder-check"
          "$RUNNER_TEMP/xdrive-ios-files-folder-check"
          node --test desktop/tests/ios-native-files-create-folder.cjs desktop/tests/ios-native-files-download-export.cjs

      - name: Verify native Files 1 GiB single-export capacity and signed ticket
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeFilesExportCapacityPolicy.swift \
            ios/tests/NativeFilesExportCapacityPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-export-capacity"
          "$RUNNER_TEMP/xdrive-ios-files-export-capacity"
          node --test desktop/tests/ios-native-files-download-export.cjs

      - name: Verify native Files manual original receipt and Files picker integration
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeFilesUploadConfirmationPolicy.swift \
            ios/tests/NativeFilesUploadEvidenceChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-upload-proof"
          "$RUNNER_TEMP/xdrive-ios-files-upload-proof"
          node --test desktop/tests/ios-native-files-manual-upload.cjs

      - name: Verify native Files revision-bound rename and trash
        run: node --test desktop/tests/ios-native-files-single-mutation.cjs

      - name: Verify native Files real destination selection and single-file copy/move
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudFilesPolicy.swift \
            ios/XDriveIOS/NativeFilesDestinationReceiptPolicy.swift \
            ios/tests/NativeFilesDestinationReceiptChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-destination-check"
          "$RUNNER_TEMP/xdrive-ios-files-destination-check"
          node --test desktop/tests/ios-native-files-destination.cjs

      - name: Verify native Files Viewer and management action integration
        run: node --test desktop/tests/ios-native-files-management-integration.cjs

      - name: Verify native Files directory rename and subtree trash
        run: node --test desktop/tests/ios-native-files-folder-actions.cjs

      - name: Verify native Files user-cancellable foreground transfers
        run: node --test desktop/tests/ios-native-files-transfer-cancel.cjs

      - name: Verify native Files folder copy/move and cycle guard
        run: node --test desktop/tests/ios-native-files-folder-copy-move.cjs

      - name: Verify native Files one-page atomic batch trash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudFilesPolicy.swift \
            ios/XDriveIOS/NativeFilesBatchTrashPolicy.swift \
            ios/tests/NativeFilesBatchTrashChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-batch-trash-check"
          "$RUNNER_TEMP/xdrive-ios-files-batch-trash-check"
          node --test desktop/tests/ios-native-files-batch-trash.cjs

      - name: Verify native Files one-page atomic batch copy and move
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudFilesPolicy.swift \
            ios/XDriveIOS/NativeFilesBatchTrashPolicy.swift \
            ios/XDriveIOS/NativeFilesBatchTargetPolicy.swift \
            ios/tests/NativeFilesBatchTargetChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-batch-target-check"
          "$RUNNER_TEMP/xdrive-ios-files-batch-target-check"
          node --test desktop/tests/ios-native-files-batch-target.cjs

      - name: Verify native Files shared list/grid presentation and actions
        run: node --test desktop/tests/ios-native-files-list-grid.cjs

      - name: Verify native Files Owner-scoped recycle bin read and restore
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudFilesPolicy.swift \
            ios/XDriveIOS/NativeFilesTrashPolicy.swift \
            ios/tests/NativeFilesTrashPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-trash-policy"
          "$RUNNER_TEMP/xdrive-ios-trash-policy"
          node --test desktop/tests/ios-native-files-trash.cjs

      - name: Verify native Files recent/favorites Owner projections and routes
        run: |
          set -euo pipefail
          swiftc -swift-version 5             ios/XDriveIOS/NativeCloudFilesPolicy.swift             ios/XDriveIOS/NativeFilesCollectionsPolicy.swift             ios/tests/NativeFilesCollectionsPolicyChecks.swift             -o "$RUNNER_TEMP/xdrive-ios-file-collections"
          "$RUNNER_TEMP/xdrive-ios-file-collections"
          node --test desktop/tests/ios-native-files-collections.cjs

      - name: Verify native Files bounded sequential multi-file upload
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeFilesFolderNamePolicy.swift \
            ios/XDriveIOS/NativeFilesUploadBatchPolicy.swift \
            ios/tests/NativeFilesUploadBatchPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-upload-batch-check"
          "$RUNNER_TEMP/xdrive-ios-files-upload-batch-check"
          node --test desktop/tests/ios-native-files-upload-batch.cjs

      - name: Verify native Files search result locate-in-folder
        run: |
          set -euo pipefail
          swiftc -swift-version 5             ios/XDriveIOS/NativeCloudFilesPolicy.swift             ios/XDriveIOS/NativeFilesLocationPolicy.swift             ios/tests/NativeFilesLocationPolicyChecks.swift             -o "$RUNNER_TEMP/xdrive-ios-file-location"
          "$RUNNER_TEMP/xdrive-ios-file-location"
          node --test desktop/tests/ios-native-files-location.cjs

      - name: Verify native Files revision-scoped Server thumbnail derivative policy
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudFilesPolicy.swift \
            ios/XDriveIOS/NativeFilesThumbnailPolicy.swift \
            ios/tests/NativeFilesThumbnailPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-thumbnail-policy"
          "$RUNNER_TEMP/xdrive-ios-files-thumbnail-policy"
          node --test desktop/tests/ios-native-files-thumbnail.cjs

      - name: Verify native Files two-slot cancellation-aware thumbnail admission
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudFilesPolicy.swift \
            ios/XDriveIOS/NativeFilesThumbnailPolicy.swift \
            ios/XDriveIOS/NativeFilesThumbnailSlots.swift \
            ios/tests/NativeFilesThumbnailSlotsChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-thumbnail-slots"
          "$RUNNER_TEMP/xdrive-ios-files-thumbnail-slots"

      - name: Verify native Files sequential bounded multi-file export
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeCloudFilesPolicy.swift \
            ios/XDriveIOS/NativeFilesFolderNamePolicy.swift \
            ios/XDriveIOS/NativeFilesBatchExportPolicy.swift \
            ios/tests/NativeFilesBatchExportPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-batch-export"
          "$RUNNER_TEMP/xdrive-ios-files-batch-export"
          node --test desktop/tests/ios-native-files-batch-export.cjs

      - name: Verify native Files cloud share permission, expiry and existing-link edit
        run: |
          set -euo pipefail
          swiftc -swift-version 5 \
            ios/XDriveIOS/NativeFilesShareLinkPolicy.swift \
            ios/tests/NativeFilesShareLinkPolicyChecks.swift \
            -o "$RUNNER_TEMP/xdrive-ios-files-share-policy-check"
          "$RUNNER_TEMP/xdrive-ios-files-share-policy-check"
          node --test desktop/tests/ios-native-files-share-links.cjs

      - name: Prepare native brand and home screen icon
        run: bash ios/scripts/prepare-assets.sh

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios
          xcodegen generate --spec project.yml

      - name: Compile unsigned iOS device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/xDriveIOS.xcodeproj \
            -scheme xDriveIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/xdrive-ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Validate app and package SideStore compatible IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/xdrive-ios-build/Build/Products/Release-iphoneos/xDriveIOS.app"
          test -s "$app/xDriveIOS"
          test -s "$app/Assets.car"
          test ! -e "$app/embedded.mobileprovision"
          actual=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          test "$actual" = 'com.lazyxu.xdrive.ios'
          /usr/libexec/PlistBuddy -c 'Print NSLocalNetworkUsageDescription' "$app/Info.plist" | grep -Fq 'xDrive'
          # Test the actual compiled device app, not only the XcodeGen YAML.
          APP_PLIST="$app/Info.plist" python3 - <<'PY'
          import os
          import plistlib
          with open(os.environ["APP_PLIST"], "rb") as fp:
              info = plistlib.load(fp)
          iphone = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          ipad = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationPortraitUpsideDown",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          assert info.get("UISupportedInterfaceOrientations") == iphone, (
              "iPhone IPA must support portrait and both landscape orientations"
          )
          assert info.get("UISupportedInterfaceOrientations~ipad") == ipad, (
              "iPad IPA must support all four interface orientations"
          )
          print("compiled iOS device orientation declarations: PASS")
          PY
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$app" "$RUNNER_TEMP/unsigned/Payload/"
          (
            cd "$RUNNER_TEMP/unsigned"
            zip -qry "$GITHUB_WORKSPACE/xDrive-unsigned.ipa" Payload
          )
          unzip -tq xDrive-unsigned.ipa
          shasum -a 256 xDrive-unsigned.ipa > xDrive-unsigned.ipa.sha256

      - name: Upload unsigned IPA and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: xDrive-iOS-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            xDrive-unsigned.ipa
            xDrive-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
