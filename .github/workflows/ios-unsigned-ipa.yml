      - name: Prepare native brand and home screen icon
        run: bash ios/scripts/prepare-assets.sh

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios
          xcodegen generate --spec project.yml

      - name: Compile unsigned iOS device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/xDriveIOS.xcodeproj \
            -scheme xDriveIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/xdrive-ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            XDRIVE_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            build

      - name: Validate app and package SideStore compatible IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/xdrive-ios-build/Build/Products/Release-iphoneos/xDriveIOS.app"
          test -s "$app/xDriveIOS"
          test -s "$app/Assets.car"
          test ! -e "$app/embedded.mobileprovision"
          actual=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          test "$actual" = 'com.lazyxu.xdrive.ios'
          compiled_source=$(/usr/libexec/PlistBuddy -c 'Print XDriveSourceCommit' "$app/Info.plist")
          test "$compiled_source" = "$(git rev-parse HEAD)"
          /usr/libexec/PlistBuddy -c 'Print NSLocalNetworkUsageDescription' "$app/Info.plist" | grep -Fq 'xDrive'
          # Test the actual compiled device app, not only the XcodeGen YAML.
          APP_PLIST="$app/Info.plist" python3 - <<'PY'
          import os
          import plistlib
          with open(os.environ["APP_PLIST"], "rb") as fp:
              info = plistlib.load(fp)
          iphone = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          ipad = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationPortraitUpsideDown",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          assert info.get("UISupportedInterfaceOrientations") == iphone, (
              "iPhone IPA must support portrait and both landscape orientations"
          )
          assert info.get("UISupportedInterfaceOrientations~ipad") == ipad, (
              "iPad IPA must support all four interface orientations"
          )
          print("compiled iOS device orientation declarations: PASS")
          PY
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$app" "$RUNNER_TEMP/unsigned/Payload/"
          (
            cd "$RUNNER_TEMP/unsigned"
            zip -qry "$GITHUB_WORKSPACE/xDrive-unsigned.ipa" Payload
          )
          unzip -tq xDrive-unsigned.ipa
          shasum -a 256 xDrive-unsigned.ipa > xDrive-unsigned.ipa.sha256

      - name: Upload unsigned IPA and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: xDrive-iOS-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            xDrive-unsigned.ipa
            xDrive-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  publish-unsigned-ipa:
    needs: [unsigned-ipa, ios-release-contract]
    # The PR's untrusted/unsigned build is retained as an Action Artifact only.
    # Publication requires a successful, exact-source master build.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact successful master source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified IPA from this workflow run, not a PR or another run
        uses: actions/download-artifact@v4
        with:
          name: xDrive-iOS-unsigned-${{ github.sha }}
          path: dist/ios-unsigned
      - name: Verify exact checked-out source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Publish direct .ipa and .sha256 to an immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/ci/publish-ios-unsigned-ipa.sh dist/ios-unsigned "$GITHUB_SHA"
