appId: io.github.lazyxu.xdrive.desktop
productName: xDrive Desktop
asar: true
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../assets/icon/tray
    to: tray-icons
    filter:
      - "*.png"
  - from: ../assets/icon/web/pwa-192.png
    to: app-icon.png
  - from: ../assets/icon/windows/app.ico
    to: app-icon.ico
win:
  executableName: xdrive-desktop
  icon: ../assets/icon/windows/app.ico
linux:
  executableName: xdrive-desktop
  icon: ../assets/icon/master/xdrive-icon-master.svg
  category: Utility
  synopsis: xDrive desktop client
  description: xDrive Electron desktop client with secure local integration to the Go xdrive-agent.
